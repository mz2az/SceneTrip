# 파이썬 린트/포맷 규칙 (ruff) — 게이트(`just check`)가 쓴다.
#
# 이 파일이 있어야 **어느 기계에서든 같은 판정**이 난다 — 없으면 ruff 가
# 사용자 전역 설정을 주워 쓰기도 해서, 내 맥과 CI 가 다른 결과를 낸다.
# CI 는 ruff 0.16.5 를 고정 설치한다(.github/workflows/ci.yml).

[lint]
# 기본(E4·E7·E9·F)에 더해 — import 정렬(I), 넓은 except(BLE001),
# 조용한 예외 삼킴(S110·S112), 실행 비트/셔뱅(EXE), 단순화(SIM), ruff 자체 규칙(RUF).
extend-select = ["I", "BLE", "S110", "S112", "EXE", "SIM", "RUF"]
# 이 저장소의 주석·독스트링은 한국어다 — 가운뎃점(·)·줄표(—)·× 같은 문장부호를
# 「모호한 유니코드」로 잡는 RUF001~003 은 전부 오탐이라 언어 정책으로 끈다.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.per-file-ignores]
# 프로토타입 서버(MZ2AZ-293)는 **실패를 정상 취급**하는 것이 설계다 —
# 비공식 네이버 엔드포인트·외부 API 를 47만 건 어느 것으로 물어도 화면이
# 죽으면 안 되므로, 넓게 잡아 기본값으로 떨어지는 자리가 수십 곳 있다
# (server.py 각 함수 주석에 이유가 적혀 있다). 정식 이관(283·284·285) 때
# 예외를 좁히는 것이 맞고, 프로토타입에서 41곳을 고치는 것은 위험만 든다.
"apps/navi_proto/*.py" = ["BLE001", "S110", "S112", "SIM105"]
