  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: 장바구니에 담기
      description: |
        목업에는 담는 경로가 셋이다 — 장소 카드의 `+`, 상세의 저장 버튼,
        장면 팝업의 북마크. 셋 다 이 하나를 부른다.

        같은 장소를 두 번 담으면 409 다. 프론트는 이때
        "이미 저장된 장소입니다" 토스트를 띄운다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreate"
      responses:
        "201":
          description: 담긴 항목
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 이미 담긴 장소
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/items/{placeId}:
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: 장바구니에서 빼기
      description: 목업 상세 화면의 "저장됨" 토글을 되돌리는 동작.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 삭제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: 내 코스 목록
      description: |
        여행 중(`active`)인 코스가 위, 예정(`upcoming`)이 아래이고 각각 최근에 만든 순이다.
        홈 화면의 정렬 그대로라 프론트는 받은 순서를 그리면 된다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: 코스 목록. 하나도 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [courses]
      operationId: createCourse
      summary: 코스 만들기
      description: |
        **받는 것은 기간과 만든 방식뿐이다.** 떠나는 날도 시작 시각도 받지 않는다.

        만들어진 코스는 일차만 있고 장소는 비어 있다. 장소를 담는 것은 편집이고,
        편집은 `PUT /courses/{courseId}` 한 번으로 끝난다.

        마켓에서 담아 오는 경우는 이 경로가 아니라
        `POST /market/courses/{marketCourseId}/saves` 다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: 만들어진 코스. 일차는 비어 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: 코스 상세
      description: |
        일차와 그 안의 장소를 순서대로, 하루 소요 시간까지 담아 돌려준다. 화면 하나를
        그리는 데 필요한 것이 전부 이 응답에 있다.

        **편집 화면도 이것 하나로 시작한다.** 받은 내용을 프론트가 메모리에 들고
        편집하다가, 완료를 누를 때 `PUT` 으로 되돌려 보낸다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: 코스 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [courses]
      operationId: replaceCourse
      summary: 편집 완료 — 코스 전체 교체
      description: |
        **편집 화면의 「완료」가 부르는 하나뿐인 요청이다.**

        제목을 고치고, 기간을 늘렸다 줄이고, 장소를 담고 빼고, 드래그로 순서를 바꾸고,
        체류시간을 조절하는 동안 서버로는 아무것도 나가지 않는다. 프론트가 코스 사본을
        들고 편집하다가 완료를 누를 때 **최종 모습을 통째로** 보낸다.

        그래서 되돌리기가 공짜다 — 잘못 지웠어도 완료 전이면 서버에 아무 일도 일어나지
        않았다. 그리고 한 트랜잭션이라 반쪽만 반영되는 상태가 없다.

        ## 보낸 것이 전부다

        | 보낸 것 | 결과 |
        | --- | --- |
        | `days` 배열의 길이 | 그것이 곧 기간이다. 3개면 3일 코스 |
        | `id` 가 있는 아이템 | 원래 있던 것 — **그대로 유지된다** |
        | `id` 가 없는 아이템 | 새로 담은 것 |
        | 요청에 없는 아이템 | **지워진다** (직접 찍은 핀이었다면 핀도 함께) |
        | `startDate` 를 뺌 | 떠나는 날을 지운다 |

        **기존 장소는 받았던 `id` 를 반드시 실어 보낸다.** 빠뜨리면 서버가 새 장소로
        보아 **방문 체크(`visitedAt`)가 날아간다.**

        ## 기간을 줄이면 장소가 지워진다

        5일 코스의 `days` 를 3개만 보내면 4·5일차의 장소가 **삭제된다.** 되돌릴 수 없다.

        **프론트는 완료를 누르기 전에 확인을 받아야 한다** — "4일차·5일차의 장소 3곳이
        삭제됩니다". 편집 화면이 이미 코스 전체를 들고 있으므로 몇 곳인지 세는 데 추가
        호출이 필요 없다.

        ## 상태는 여기서 못 바꾼다

        코스를 시작하거나 일차를 넘기는 것은 편집이 아니라 여행 중 동작이다.
        `PUT /courses/{courseId}/progress` 를 쓴다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseReplace"
      responses:
        "200":
          description: 반영된 코스. 이동시간과 하루 소요 시간이 새 순서로 다시 계산돼 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            여행 중인 코스를 지금 일차보다 짧게 줄이려 했다. 3일차를 걷고 있는데 2일
            코스로 만들 수는 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [courses]
      operationId: deleteCourse
      summary: 코스 삭제
      description: |
        일차·장소·이 코스에서 찍은 핀이 함께 지워진다.

        **마켓에 올려 둔 사본은 남는다.** 사본이라 원본과 수명이 다르다 — 내리려면
        `DELETE /market/courses/{marketCourseId}` 를 따로 부른다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: 삭제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}/progress:
    put:
      tags: [courses]
      operationId: updateCourseProgress
      summary: 코스 시작·일차 이동 (여행 중)
      description: |
        **편집이 아니라 여행 중 동작이라 즉시 반영된다.** 「시작」을 누르면 `active` 가
        되고 그때부터 방문 체크와 지도 위 현재 위치가 나온다.

        상태에 「완료」가 없는 것은 목업 그대로다. 여행을 끝내면 `upcoming` 으로 돌아간다.

        `active` 로 바꿀 때 `currentDayNo` 를 함께 보낸다. `upcoming` 으로 되돌릴 때는
        보내지 않는다 — 예정 코스에 "지금 몇 일차" 는 뜻이 없다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseProgress"
      responses:
        "200":
          description: 바뀐 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}/items/{itemId}/visit:
    put:
      tags: [courses]
      operationId: updateCourseItemVisit
      summary: 방문 체크 (여행 중)
      description: |
        성지에 도착해 체크를 누르는 동작이다. **편집이 아니라 즉시 반영된다** — 이때
        코스 전체를 보내라고 할 수는 없다.

        토글이라 이미 체크된 것을 다시 체크해도 오류가 아니다. 체크한 시각은 서버가
        찍는다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitUpdate"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 여행 중이 아닌 코스. 예정 상태에서는 방문 체크가 뜻이 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /favorites/contents:
    get:
      tags: [favorites]
      operationId: listFavoriteContents
      summary: 찜한 작품 목록
      description: |
        찜한 순서(최근 것부터)로 돌려준다.

        「어떤 작품을 좋아하나요?」 화면이 이것을 맨 위에 모으고, AI 코스 추천이
        우선순위 입력으로 읽는다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 찜 목록. 하나도 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [favorites]
      operationId: addFavoriteContent
      summary: 작품 찜하기
      description: |
        **작품에는 찜(하트), 장소에는 장바구니다. 장소에 찜은 없다.** 둘은 다른 것이라
        합치지 않았다 — 장소를 담는 것은 `POST /cart/items` 다.

        비회원도 찜할 수 있다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteContentCreate"
      responses:
        "204":
          description: |
            찜됨. **이미 찜한 작품을 다시 보내도 204 다.** 하트는 토글이라 같은 상태를
            두 번 요청하는 일이 흔하고, 그때마다 409 를 내면 프론트가 사용자에게 보여 줄
            것이 없다. 장바구니(`POST /cart/items`)가 409 를 내는 것과 다른 점이다.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /favorites/contents/{contentId}:
    delete:
      tags: [favorites]
      operationId: removeFavoriteContent
      summary: 찜 해제
      description: 찜하지 않은 작품을 해제해도 `204` 다. 이유는 찜하기와 같다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204":
          description: 해제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses:
    get:
      tags: [market]
      operationId: listMarketCourses
      summary: 올라온 코스 목록
      description: |
        누구나 볼 수 있다. 내려간 코스는 나오지 않는다.

        `q` 는 **작품 이름**으로 찾는다 — 한글 제목·영문 제목·줄임말을 모두 보므로
        `Goblin` 으로도 도깨비 코스가 걸린다. 코스 이름이 아니라 작품 이름인 이유는,
        사용자가 마켓에 오는 동기가 "이 작품 성지순례 코스를 찾고 싶다" 이기 때문이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - name: q
          in: query
          description: 작품 이름. 생략하면 전체 목록이다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            $ref: "#/components/schemas/MarketSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 올라온 코스 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [market]
      operationId: createMarketCourse
      summary: 코스 올리기
      description: |
        **올린 코스는 사본이다.** 올리는 순간의 일차·순서·머무는 시간을 통째로 떠서
        저장한다. 그 뒤에 원본을 고쳐도 마켓의 것은 그대로 남는다 — 남이 담아 간 코스가
        어느 날 갑자기 바뀌면 안 되기 때문이다.

        사본이라 고칠 방법이 없다. 바꾸려면 내렸다가 다시 올린다. 그러면 새 사본이 된다.
        한 코스를 동시에 두 번 올릴 수는 없다.

        **직접 찍은 핀은 빠진다.** 개인 숙소 위치가 남에게 공개되면 안 되기 때문이다.
        경복궁 → 숙소 → 북촌으로 짠 코스는 경복궁 → 북촌으로 올라간다. 프론트는 올리기
        화면에서 "직접 찍은 핀 1곳은 공유되지 않습니다" 를 미리 알려 준다 — 숙소를
        기준으로 동선을 짰다면 남는 순서가 어색해 보일 수 있는데 올린 사람은 그것을
        모른다.

        핀만 있던 일차는 사본에서 비어 있게 되고, 그래도 기간은 그대로 유지된다.

        **가입 사용자만 올릴 수 있다.** 비회원이 올린 뒤 앱을 지우면 그 코스를 아무도
        내릴 수 없어서다 — 신고가 들어와도 본인이 처리하지 못한다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketCourseCreate"
      responses:
        "201":
          description: 올라간 사본
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 그 코스는 이미 올라가 있다. 내린 뒤에 다시 올린다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}:
    get:
      tags: [market]
      operationId: getMarketCourse
      summary: 올라온 코스 상세
      description: |
        **올린 시점의 모습이다.** 원본 코스의 현재 모습이 아니다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "200":
          description: 사본의 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [market]
      operationId: deleteMarketCourse
      summary: 내리기
      description: |
        올린 사람만 내릴 수 있다. 목록과 상세에서 사라진다.

        **이미 담아 간 사람의 코스는 그대로 남는다** — 담기가 복사이기 때문이다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 내려감
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          description: 남이 올린 코스는 내릴 수 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}/saves:
    post:
      tags: [market]
      operationId: saveMarketCourse
      summary: 담기 — 내 코스로 복사
      description: |
        순서와 머무는 시간을 그대로 복사해 **내 코스를 새로 만든다.** 응답이 그 새 코스다.

        **날짜는 묻지 않는다** — 떠나는 날은 비어 있고 나중에 붙인다. 만든 방식은
        `market` 으로 기록되고, 어느 코스에서 담아 왔는지도 남는다.

        담은 뒤로는 원본과 아무 관계가 없어 마음대로 고칠 수 있다. 같은 코스를 여러 번
        담으면 그때마다 새 코스가 생긴다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "201":
          description: 새로 만들어진 내 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}/likes:
    post:
      tags: [market]
      operationId: likeMarketCourse
      summary: 좋아요
      description: 이미 누른 상태로 다시 보내도 `204` 다. 하트는 토글이라 그렇다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [market]
      operationId: unlikeMarketCourse
      summary: 좋아요 취소
      description: 누르지 않은 상태로 보내도 `204` 다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /navigation/next-leg:
    post:
      tags: [navigation]
      operationId: getNextLeg
      summary: 현재 위치에서 다음 목적지까지 (여행 중 전용)
      description: |
        **여행 중에만 부를 수 있다.** 코스가 `active` 가 아니면 `409` 다. 유료 API 라
        호출 여부를 서버가 정한다 — 클라이언트가 정하게 두면 과금이 클라이언트 손에
        넘어간다. 같은 이유로 가입 사용자만 부를 수 있다.

        전체 구간을 미리 계산해 두지 않고 **한 구간씩** 부른다. 사용자가 계획대로만
        움직이지 않기 때문이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextLegRequest"
      responses:
        "200":
          description: 실제 경로와 예상 소요 시간
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextLeg"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 여행 중이 아닌 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: |
            경로를 찾지 못했다. 사용자 잘못이 아니다 — 섬·산속처럼 대중교통이 닿지
            않는 곳이거나, 출발지·목적지 근처에 정류장이 없는 자리다. `code` 로
            갈린다 (docs/api/errors.md).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: |
            길찾기 제공자(카카오)가 응답하지 않거나 호출 한도를 넘었다. 잠시 뒤 다시
            시도할 수 있다. 서버 사정이라 `traceId` 가 실린다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /guide/chat:
    post:
      tags: [guide]
      operationId: chatWithGuide
      summary: 여행 가이드 챗봇 — 한 턴 주고받기
      description: |
        앱은 **대화 이력·지금 위치·화면 상태**를 보내고, 서버가 LLM 을 부르고 도구
        (`poi_nearby`·`route`·`add_to_cart`)를 실행해 답을 만든다. 앱은 LLM 을 직접 부르지
        않고 모델 이름·키를 모른다 — [ADR 0012](../../docs/architecture/adr/0012-guide-chat-is-served-by-the-server.md).

        **화면 상태(`context`)가 곧 모델의 눈이다.** 담은 지점의 번호·이름·다녀옴 표시,
        여행 단계·가는 곳·남은 직선거리·걸은 거리. 「다 돌았어?」「다음은 어디야?」는 이것만으로
        도구 없이 답한다. 좌표는 모델에게 주지 않는다(스스로 거리를 재려 들고 틀린다).
        번호를 좌표로 바꾸는 것은 서버다.

        한 턴에 도구는 최대 3회 왕복한다. 넘으면 그때까지의 결과로 답한다. 실측(gpt-oss-20b,
        2026-09-05): 도구 없는 답 2~9초, 도구 1회 포함 30초 — `tookSeconds` 로 돌려준다.
        클라이언트 타임아웃은 120초 이상으로 둔다.

        `sessionId` 는 대화 하나를 잇는 열쇠다. 서버는 그 대화에서 **보여 준 장소 목록**을
        기억해 「거기 어떻게 가」의 「거기」를 푼다. 서버 재시작이면 잊는다 — 앱은 새 세션으로
        다시 묻는다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideChatRequest"
      responses:
        "200":
          description: |
            답과, 그 답을 만들며 부른 도구·찾은 장소·그린 경로. **`toolsUsed` 는 화면에 보인다** —
            근거 없이 답한 것을 사용자가 알아볼 수 있어야 한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideChatReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: |
            LLM 이 응답하지 않는다(꺼져 있거나 적재 중이거나 한도 초과). `code` 는
            `GUIDE_UNAVAILABLE`. **조용히 규칙 기반으로 떨어지지 않는다** — 왜 답이 밋밋한지
            사용자가 알아야 한다. 잠시 뒤 다시 시도할 수 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 응답 언어. 생략하거나 해당 번역이 없으면 `ko` 로 폴백한다.
      schema:
        $ref: "#/components/schemas/Lang"

    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        앱이 최초 실행 시 만들어 보관하는 **설치 UUID**. 헤더 이름은 「기기」라고
        하지만 가리키는 것은 기기가 아니라 그 설치본이다 — 앱을 지웠다 깔면 새
        값이 된다.

        저장의 주체는 이 값이 아니라 이 값으로 찾아낸 계정이다. 서버가 처음 보는
        값이면 비회원 계정을 만들어 짝지어 둔다. 앱이 보낼 값은 지금과 같다.
      schema:
        type: string
        format: uuid

    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ItemId:
      name: itemId
      in: path
      required: true
      description: 코스 안의 장소 하나. `CourseItem.id` 다.
      schema:
        type: integer
        format: int64

    MarketCourseId:
      name: marketCourseId
      in: path
      required: true
      description: 마켓에 올라온 사본의 id. 원본 코스의 id 가 아니다.
      schema:
        type: integer
        format: int64

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    OriginLat:
      name: lat
      in: query
      description: 거리 계산의 기준 위도. `lng` 와 반드시 짝으로 준다.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90

    OriginLng:
      name: lng
      in: query
      description: 거리 계산의 기준 경도. `lat` 와 반드시 짝으로 준다.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180

  headers:
    ContentLanguage:
      description: 서버가 실제로 고른 언어. 요청한 언어와 다를 수 있다(폴백).
      schema:
        $ref: "#/components/schemas/Lang"

  responses:
    BadRequest:
      description: 파라미터가 규칙에 맞지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SignInRequired:
      description: |
        가입해야 할 수 있는 동작. 좋아요 · 마켓에 담기 · 마켓에 올리기 · 마켓에서
        내리기 · 여행 중 길찾기 다섯이다.

        나머지는 계정 없이 다 된다 — 검색하고, 장바구니에 담고, 작품을 찜하고, 코스를
        만들어 시작하는 데까지 계정이 필요 없다. 로그인 벽을 앞에 세우면 사람들이 앱을
        써 보기도 전에 나가기 때문이다.

        마켓 쪽을 막은 이유는 비회원이 올린 뒤 앱을 지우면 그 코스를 아무도 내릴 수 없어
        서다. 길찾기를 막은 이유는 다르다 — T맵 종량제라 호출마다 돈이 나가는데, 계정이
        없으면 누가 얼마나 썼는지 셀 수가 없다.

        > **지금은 아무도 이 벽을 넘지 못한다.** 로그인 스토리가 8/23 주차라 가입할
        > 방법이 아직 없다. 계약에 자리를 잡아 두는 것이므로 **프론트는 이 동작들의
        > 화면을 아직 만들지 않는다.**
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: |
        서버가 요청을 처리하지 못함. **재시도해도 된다** — 클라이언트가 고칠 것은 없다.

        이 응답에만 `traceId` 가 실린다. 사용자가 그 문자열 하나를 알려 주면 서버 쪽에서
        그 요청의 트레이스와 로그를 그대로 찾을 수 있으므로, **화면에 보여 주거나 오류
        보고에 함께 담는다.** 다른 상태 코드에는 이 필드가 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    Lang:
      type: string
      enum: [ko, en, ja, zh-Hant]
      default: ko
      description: 지원 언어. `zh-Hant` 는 번체(대만·홍콩)로 간체와 구분한다.

    ContentCategory:
      type: string
      enum: [drama, movie, variety, kpop]

    EntityType:
      type: string
      enum: [place, content, person]
      description: |
        검색 결과의 종류. 목록 화면의 탭은 장소·작품 둘뿐이고,
        `person` 은 자동완성에만 나타나 작품 목록으로 연결된다.

    RoleType:
      type: string
      enum: [actor, director]
      description: 이 작품에서의 직군. 사람의 속성이 아니라 사람과 작품 사이의 속성이다.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            기계가 분기하는 식별자. 클라이언트 로직은 이 값만 보고 판단한다.

            **전체 목록과 각 코드의 뜻은 `docs/api/errors.md` 에 있다.** 여기에
            같은 목록을 두면 한쪽만 고쳐져 어긋나므로 옮겨 적지 않는다.
          example: PLACE_NOT_FOUND
        message:
          type: string
          description: 사람이 읽는 설명. 사용자에게 그대로 보여 줄 문구가 아니다.
        traceId:
          type: string
          nullable: true
          description: |
            이 요청의 추적 ID. SigNoz 에서 같은 값으로 조회할 수 있다.

            **`500`·`503` 응답에만 실린다.** `400`·`404`·`409`·`422` 는 클라이언트가 무엇을 잘못했는지
            `code` 로 이미 알 수 있어 서버 로그를 뒤질 일이 없다. 값이 없는 필드는 응답에서
            아예 빠지므로, 다른 상태 코드에서는 이 키가 보이지 않는다.

    SuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"

    Suggestion:
      type: object
      required: [type, id, name]
      properties:
        type:
          $ref: "#/components/schemas/EntityType"
        id:
          type: integer
          format: int64
          description: 종류에 따라 장소·작품·인물의 ID
        name:
          type: string
          description: 화면에 보여 줄 대표 이름
          example: 도깨비
        matchedTerm:
          type: string
          nullable: true
          description: |
            실제로 걸린 표기. 별칭으로 걸렸을 때 `name` 과 다르다 —
            `Goblin` 으로 쳐서 `도깨비` 가 나왔다면 이 값이 `Goblin` 이다.
        subtitle:
          type: string
          nullable: true
          description: |
            같은 이름을 구별하기 위한 보조 문구. 작품은 `방송사 · 연도`,
            장소는 주소의 시·구, 인물은 대표 작품이 들어간다.
          example: "tvN · 2016"

    ContentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
        total:
          type: integer
          description: 조건에 맞는 전체 개수. `items` 길이보다 크면 잘린 것이다.
        limit:
          type: integer
        offset:
          type: integer

    ContentSummary:
      type: object
      required: [id, category, title, placeCount]
      properties:
        id:
          type: integer
          format: int64
        category:
          $ref: "#/components/schemas/ContentCategory"
        title:
          type: string
          example: 도깨비
        posterUrl:
          type: string
          nullable: true
          format: uri
        broadcaster:
          type: string
          nullable: true
          example: tvN
        releaseYear:
          type: integer
          nullable: true
          example: 2016
        genres:
          type: array
          description: 수집 원본에서 `;` 로 구분된 값을 분해한 것
          items:
            type: string
          example: ["판타지", "멜로"]
        placeCount:
          type: integer
          description: 이 작품의 촬영지 수

    ContentDetail:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: 줄거리
            aliases:
              type: array
              description: 다른 표기. 영어 제목이 여기 들어간다.
              items:
                type: string
              example: ["Guardian: The Lonely and Great God", "Goblin"]
            cast:
              type: array
              items:
                $ref: "#/components/schemas/PersonRef"

    PersonRef:
      type: object
      required: [personId, name, roleType]
      properties:
        personId:
          type: integer
          format: int64
        name:
          type: string
        roleType:
          $ref: "#/components/schemas/RoleType"

    ContentRef:
      type: object
      required: [contentId, title]
      properties:
        contentId:
          type: integer
          format: int64
        title:
          type: string
        posterUrl:
          type: string
          nullable: true
          format: uri

    PlaceList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaceSummary"
        total:
          type: integer
          description: |
            조건에 맞는 전체 개수. `items` 길이보다 크면 인기도 상위만 잘려
            나온 것이다 — 지도에서 "더 있음" 을 판단하는 근거다.
        limit:
          type: integer
        offset:
          type: integer

    PlaceSummary:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 여의도공원
        type:
          type: string
          nullable: true
          description: |
            수집된 장소 유형을 가공 없이 그대로 돌려준다. 현재 37종의 자유
            문자열이라 필터 값으로 쓰기에 적합하지 않다 — 목업의 카테고리 칩으로
            묶는 매핑은 데이터 정제 후에 정한다.
          example: 카페
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
          description: 대표 이미지. 정렬 순서상 첫 번째 사진이다.
        distanceMeters:
          type: integer
          nullable: true
          description: 요청에 `lat`·`lng` 가 있을 때만 채워진다.
        contents:
          type: array
          description: 이 장소에 등장한 작품들. 목업 장소 카드의 작품 배지에 대응한다.
          items:
            $ref: "#/components/schemas/ContentRef"
        sceneDescription:
          type: string
          nullable: true
          description: |
            이 장소가 작품에서 어떻게 등장했는지. `contentId` 로 좁혀 조회했을 때
            (또는 `GET /contents/{contentId}/places`) 그 작품 기준으로 채워진다.
            작품을 특정하지 않은 조회에서는 `null` 이다.

    PlaceDetail:
      allOf:
        - $ref: "#/components/schemas/PlaceSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: 장소 자체의 설명. 작품별 장면 설명은 `scenes` 쪽이다.
            naverPlaceUrl:
              type: string
              nullable: true
              format: uri
              description: 네이버 지도 링크. 길찾기 연동에 쓴다.
            imageUrls:
              type: array
              description: 정렬 순서대로의 전체 사진
              items:
                type: string
                format: uri
            scenes:
              type: array
              description: |
                이 장소에서 촬영된 작품과 장면. 목업의 "이 장소의 장면" 가로
                스크롤 카드에 대응한다.

                **인기도 내림차순**이다. 같은 인기도면 최신 작품이 앞선다.
                한 장소가 여러 작품에 걸릴 때 어느 것을 먼저 보여 줄지가
                화면에서 갈리지 않도록 서버가 정한다 — 클라이언트는 받은
                순서를 그대로 그린다.
              items:
                $ref: "#/components/schemas/Scene"

    PoiCategoryGroup:
      type: string
      enum: [food, stay, sight, transit]
      description: |
        네 갈래. 원본 분류(biz_middle 아홉 종)를 접은 것 — `docs/project/plans/poi.md` §4-0.
        `food` 는 음식점·카페·술집, `sight` 는 관광명소·종교·문화생활시설·레저.

    PoiList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PoiSummary"
        total:
          type: integer
          description: |
            조건에 맞는 전체 개수. `items` 길이보다 크면 잘려 나온 것이다 —
            앱이 「더 확대하세요」를 판단하는 근거다.
        limit:
          type: integer
        offset:
          type: integer

    PoiSummary:
      type: object
      required: [id, name, category, categoryGroup, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 명동교자 본점
        category:
          type: string
          description: |
            수집된 세부 종류를 가공 없이 그대로 돌려준다(한식·카페기타·펜션·지하철역 …
            93 종). 필터 값으로 쓰기에 적합하지 않다 — 칩으로 묶는 규칙은 목업 뒤에 정한다.
            `categoryGroup` 이 거르는 용도다.
          example: 한식
        categoryGroup:
          $ref: "#/components/schemas/PoiCategoryGroup"
        address:
          type: string
          nullable: true
          description: 지번 주소. 시/군/구 + 동까지이고 건물번호는 없다.
          example: 서울 중구 명동
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        distanceMeters:
          type: integer
          nullable: true
          description: 요청에 `lat`·`lng` 가 있을 때만 채워진다.

    PoiDetail:
      allOf:
        - $ref: "#/components/schemas/PoiSummary"
        - type: object
          properties:
            road:
              type: string
              nullable: true
              description: 도로명. 건물번호는 없다.
              example: 명동10길
            tel:
              type: string
              nullable: true
              description: 28~60% 가 비어 있다.
              example: 02-776-5348
            region:
              type: string
              nullable: true
              example: 서울
            city:
              type: string
              nullable: true
              example: 중구

    PoiCard:
      type: object
      required: [poiId]
      description: |
        바깥 출처(네이버 장소)에서 가져온 카드. 세 상태다 — `pending`(아직 안 물어봄), `found: false`
        (물어봤는데 없음), `found: true`(있음). `pending` 이 아니면 `found` 와 `checkedAt` 이 있다.
        `found: true` 일 때 아래 정보는 **있는 것만** 실린다 — 별점이 없는 가게가 많고, 없는 값을
        0 으로 채우면 「최악의 평점」으로 읽힌다.
      properties:
        poiId:
          type: integer
          format: int64
        pending:
          type: boolean
          description: 아직 안 물어봤다. 이것이 `true` 면 다른 필드는 없다
        found:
          type: boolean
          description: 물어본 결과. `pending` 이 아니면 있다
        checkedAt:
          type: string
          format: date-time
          description: 언제 확인한 정보인가. `pending` 이 아니면 있다
        why:
          type: string
          nullable: true
          description: "`found: false` 일 때 이유 한 줄. 예 「150 m 떨어져 이름이 정확히 같아야 하는데 「포490 강남점」이다」"
        name:
          type: string
          nullable: true
          description: 출처가 부르는 이름. 우리 이름(`PoiSummary.name`)과 다를 수 있다
          example: 명동교자본점
        category:
          type: string
          nullable: true
          description: 출처의 분류 문구
          example: 칼국수,만두
        address:
          type: string
          nullable: true
          description: 도로명 주소
        phone:
          type: string
          nullable: true
        hours:
          type: string
          nullable: true
          description: 영업시간 문구 그대로. 구조화하지 않는다
          example: 매일 10:30 - 21:00
        score:
          type: number
          format: double
          nullable: true
          description: 별점 0~5. 없을 수 있다
        reviewCount:
          type: integer
          nullable: true
          description: 방문자 리뷰 수
        blogReviews:
          type: integer
          nullable: true
          description: 블로그 리뷰 수
        images:
          type: array
          description: 최대 3 장. 출처의 CDN 주소를 앱이 직접 그린다 — 데모 한정(ADR 0011)
          items:
            type: string
            format: uri
        naverUrl:
          type: string
          format: uri
          nullable: true
          description: 출처의 장소 페이지

    PoiCardBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 요청한 순서대로, 요청한 개수만큼
          items:
            $ref: "#/components/schemas/PoiCard"
        retryAfterSeconds:
          type: integer
          nullable: true
          description: "`pending` 이 하나라도 있을 때만. 이만큼 뒤에 `pending` 이었던 id 만 다시 물어라. 1~30"

    Scene:
      type: object
      required: [contentId, contentTitle]
      properties:
        contentId:
          type: integer
          format: int64
        contentTitle:
          type: string
        posterUrl:
          type: string
          nullable: true
          format: uri
          description: 작품 포스터. 장면 사진이 아니다 — 그쪽은 `sceneImageUrl`.
        sceneDescription:
          type: string
          nullable: true
          description: 이 작품에서 이 장소가 어떻게 등장했는지
        sceneImageUrl:
          type: string
          nullable: true
          format: uri
          description: |
            그 장면의 스틸. 작품마다 다르므로 `posterUrl` 과 별개다.

            목업에서 작품을 눌렀을 때 뜨는 팝업이 `sceneDescription` 과 이것을
            함께 쓴다. 둘 다 이 응답에 실려 오므로 **팝업을 열 때 추가 호출이
            필요 없다.**

            수집분에 없는 장면이 있어 `null` 이 올 수 있다. 그때는 자리를 비우고
            설명만 보여 준다 — 포스터로 대신 채우면 사용자가 그것을 장면 사진으로
            읽는다.

    Cart:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalCount:
          type: integer

    CartItemCreate:
      type: object
      required: [placeId]
      properties:
        placeId:
          type: integer
          format: int64
        sourceContentId:
          type: integer
          nullable: true
          format: int64
          description: |
            어떤 작품을 보다가 담았는지. 선택 사항이지만, 장바구니 목록에
            대표 작품을 보여 주려면 필요하다.

    CartItem:
      type: object
      required: [placeId, name, addedAt]
      properties:
        placeId:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        sourceContentId:
          type: integer
          nullable: true
          format: int64
        sourceContentTitle:
          type: string
          nullable: true
        addedAt:
          type: string
          format: date-time
    # ───────────── 코스 ─────────────

    CourseStatus:
      type: string
      enum: [upcoming, active]
      description: |
        예정(`upcoming`) / 여행 중(`active`).

        **이 값이 여행 중 기능의 스위치다.** `active` 일 때만 방문 체크와 길찾기가
        열린다. 「완료」 상태가 없는 것은 목업 그대로다 — 여행을 끝내면 `upcoming` 으로
        돌아가고, 지난 여행은 떠나는 날로 구분한다.

    CourseOrigin:
      type: string
      enum: [ai, self, market]
      description: |
        이 코스를 어떻게 만들었는가. AI 가 짠 코스와 직접 짠 코스의 완주율이 다를 것이라
        나중에 비교하려면 만든 시점에 남겨 둬야 한다 — 소급이 안 된다.

        `market` 은 코스마켓에서 담아 온 것이고, 이 값은 서버가 붙인다.

    CoursePace:
      type: string
      enum: [tight, loose]
      description: |
        「빡빡하게 / 널널하게」. AI 로 짠 코스만 값이 있다.

        **지금은 두 값의 결과가 같다.** 항목은 확정됐지만 일정을 어떻게 바꾸는지가 아직
        정해지지 않았다(3주차 회의 Open Issue 3). 그래도 받아 두는 이유는 로직이
        정해지면 지난 코스도 다시 계산할 수 있어서다.

    PinCategory:
      type: string
      enum: [lodging, food, attraction, street, building]
      description: |
        직접 찍은 핀의 분류. 목업의 다섯 갈래다 — 숙소 · 음식점·카페 · 명소·자연 ·
        거리·다리 · 건물·시설.

        등록된 촬영지의 `type` 과 다르다. 그쪽은 수집된 자유 문자열이고 이쪽은 사용자가
        고르는 닫힌 목록이다.

    TravelBasis:
      type: string
      enum: [straight-line, route]
      description: |
        이동시간을 무엇으로 냈는가. `straight-line` 은 직선거리에서 나온 **추정**이라
        실제와 다르다. 계획 단계는 언제나 이 값이다.

    CourseItemSource:
      type: string
      enum: [place, customPin]
      description: 등록된 촬영지인가, 사용자가 지도에 직접 찍은 핀인가.

    CourseCreate:
      type: object
      required: [dayCount, origin]
      properties:
        dayCount:
          type: integer
          minimum: 1
          maximum: 15
          description: 며칠짜리인가. 이만큼의 빈 일차가 함께 만들어진다.
        title:
          type: string
          maxLength: 50
          description: 비우면 서버가 「이름 없는 코스」로 채운다. 응답에는 언제나 값이 있다.
        origin:
          $ref: "#/components/schemas/CourseOrigin"
        pace:
          $ref: "#/components/schemas/CoursePace"

    CourseList:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        totalCount:
          type: integer

    CourseSummary:
      type: object
      required: [id, title, dayCount, status, origin, placeCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 비어 있지 않다. 사용자가 안 적었으면 서버가 채운 값이다.
        dayCount:
          type: integer
          description: 며칠짜리인가. 편집에서 보낸 `days` 배열의 길이가 그대로 여기 온다.
        startDate:
          type: string
          format: date
          nullable: true
          description: |
            떠나는 날. 정하지 않았으면 없다. 돌아오는 날은 주지 않는다 —
            `startDate + dayCount - 1` 로 나오는 파생값이다.
        status:
          $ref: "#/components/schemas/CourseStatus"
        currentDayNo:
          type: integer
          nullable: true
          description: 여행 중일 때 지금 몇 일차인지. 예정 코스에는 없다.
        origin:
          $ref: "#/components/schemas/CourseOrigin"
        pace:
          $ref: "#/components/schemas/CoursePace"
        sourceMarketCourseId:
          type: integer
          format: int64
          nullable: true
          description: 마켓에서 담아 왔다면 그 원본. 「담아 온 코스」 표시에 쓴다.
        placeCount:
          type: integer
          description: 모든 일차의 장소 수 합계. 목록 카드의 "장소 7곳" 이다.
        thumbnailUrl:
          type: string
          nullable: true
          format: uri
          description: 첫 번째 장소의 대표 이미지. 장소가 하나도 없으면 비어 있다.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              description: |
                1일차부터 순서대로. **빈 일차도 빠지지 않는다** — 배열 길이가 곧
                기간이다.
              items:
                $ref: "#/components/schemas/CourseDay"

    CourseDay:
      type: object
      required: [dayNumber, items, dwellMinutes, travelMinutes, totalMinutes, travelBasis]
      properties:
        dayNumber:
          type: integer
          minimum: 1
          description: |
            1 부터. **날짜가 아니다** — 떠나는 날이 없어도 일차는 있다. 배열 순서와 같다.
        items:
          type: array
          description: 갈 순서대로. 프론트는 받은 순서를 그대로 그리면 된다.
          items:
            $ref: "#/components/schemas/CourseItem"
        dwellMinutes:
          type: integer
          description: 이 날 머무는 시간의 합
        travelMinutes:
          type: integer
          description: |
            이 날 이동에 드는 시간의 합. **일차 합계로만 준다** — 구간별 소요 시간은
            여행 전에 보여 주지 않기로 했으므로 `CourseItem` 에 그 필드가 아예 없다.
        totalMinutes:
          type: integer
          description: |
            `dwellMinutes + travelMinutes`. **시작 시각을 받지 않으므로 도착·출발 시각은
            없다.** 화면은 "약 6시간 20분" 처럼 길이만 보여 준다.
        travelBasis:
          $ref: "#/components/schemas/TravelBasis"

    CourseItem:
      type: object
      required: [id, source, name, latitude, longitude, dwellMinutes]
      properties:
        id:
          type: integer
          format: int64
          description: |
            **편집 완료(`PUT`)에서 이 값을 그대로 돌려보내야 한다.** 빠뜨리면 서버가
            새 장소로 보아 방문 체크가 날아간다.
        source:
          $ref: "#/components/schemas/CourseItemSource"
        placeId:
          type: integer
          format: int64
          nullable: true
          description: |
            등록된 촬영지일 때만 있다. 직접 찍은 핀에는 없다 — 그 핀은 `place` 에 들어가지
            않아 촬영지 상세로 갈 수 없다.
        customPinId:
          type: integer
          format: int64
          nullable: true
          description: |
            직접 찍은 핀일 때만 있다. **편집에서 이 값을 쓸 일은 없다** — 자리를 가리키는
            것은 아이템의 `id` 이고, 핀은 그 자리 전용이라 함께 따라간다. 같은 숙소를 두
            자리에 넣었다면 이 값이 서로 다르다.
        name:
          type: string
        address:
          type: string
          nullable: true
          description: 등록된 촬영지만 있다. 직접 찍은 핀은 주소를 받지 않는다.
        category:
          type: string
          nullable: true
          description: |
            등록된 촬영지는 수집된 유형 문자열, 직접 찍은 핀은 `PinCategory` 값이다.
            둘의 값 범위가 다르므로 하나로 묶어 필터에 쓰지 않는다.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        dwellMinutes:
          type: integer
          minimum: 15
          maximum: 180
          description: 머무는 시간(분). 15분 ~ 3시간이 목업 슬라이더의 범위다.
        distanceMetersFromPrevious:
          type: integer
          nullable: true
          description: |
            앞 장소에서 여기까지의 **직선거리**다. 첫 번째 장소에는 없다.

            실제 도로 거리가 아니고, 여기에 대응하는 소요 시간 필드도 없다 — 여행 전에는
            "몇 분" 을 보여 주지 않는다. 직접 찍은 핀도 이 계산에 들어간다(숙소가 하루의
            시작과 끝이라 빼면 합계가 크게 어긋난다).
        sourceContentId:
          type: integer
          format: int64
          nullable: true
          description: |
            어떤 작품 때문에 담았는지. 장바구니에서 넘어올 때 따라온다.

            같은 N서울타워가 이태원 클라쓰의 것인지 눈물의 여왕의 것인지 구별하는 값이라,
            화면에 작품 배지를 띄울 때 이것을 쓴다.
        sourceContentTitle:
          type: string
          nullable: true
        visitedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            여행 중 방문 체크를 누른 시각. 없으면 아직 안 갔다는 뜻이다.

            **편집 완료에서 `id` 를 빠뜨리면 이 값이 사라진다.**

    CourseReplace:
      type: object
      required: [title, days]
      description: |
        편집 화면의 최종 모습. **보낸 것이 코스의 전부이고, 빠진 것은 지운 것이다.**
      properties:
        title:
          type: string
          maxLength: 50
          description: 비우면 서버가 「이름 없는 코스」로 채운다.
        startDate:
          type: string
          format: date
          description: 떠나는 날. **빼면 지운다.**
        days:
          type: array
          minItems: 1
          maxItems: 15
          description: |
            1일차부터 순서대로. **배열 길이가 곧 기간이다** — 5일 코스에 3개를 보내면
            3일 코스가 되고 4·5일차의 장소는 삭제된다.

            빈 일차는 `items` 가 빈 배열인 항목으로 표현한다. 일차는 큐라서 뒤에서만
            늘고 준다 — 가운데를 빼는 조작은 없다.
          items:
            $ref: "#/components/schemas/CourseDayInput"

    CourseDayInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            갈 순서대로. **배열 순서가 곧 방문 순서다** — 드래그 결과를 따로 보내는
            요청이 없는 이유가 이것이다.
          items:
            $ref: "#/components/schemas/CourseItemInput"

    CourseItemInput:
      type: object
      description: |
        `placeId` 와 `customPin` 중 **정확히 하나**를 보낸다. 둘 다이거나 둘 다 없으면
        `400` 이다. OpenAPI 로는 이 조건을 표현할 방법이 마땅치 않아 서버가 검사한다.
      properties:
        id:
          type: integer
          format: int64
          description: |
            **원래 있던 장소면 조회에서 받은 `id` 를 그대로 넣는다.** 그래야 방문
            체크(`visitedAt`)가 보존된다. 새로 담은 장소는 이 값을 비운다.
        placeId:
          type: integer
          format: int64
          description: |
            등록된 촬영지. 장바구니에서 꺼내든 검색으로 찾든 같은 값이다.
        customPin:
          $ref: "#/components/schemas/CustomPinInput"
        dwellMinutes:
          type: integer
          minimum: 15
          maximum: 180
          description: |
            머무는 시간(분).

            **비우면 서버가 장소 유형에 맞는 기본값을 채운다** — 고궁 90, 카페 40,
            다리 15 처럼 다르고 모르는 유형은 60 이다. 프론트가 그 표를 들고 있을 필요가
            없다. 값이 필요하면 담은 뒤 응답의 `CourseItem.dwellMinutes` 를 보면 된다.

            사용자가 슬라이더를 만졌으면 그 값을 보낸다. 이미 담긴 장소를 옮기기만 할
            때도 지금 값을 그대로 실어 보내는 편이 안전하다 — 비우면 기본값으로
            되돌아간다.
        sourceContentId:
          type: integer
          format: int64
          description: |
            어떤 작품 때문에 담았는지. 장바구니에서 넘어올 때 그 값을 그대로 옮긴다.

    CustomPinInput:
      type: object
      required: [name, category, latitude, longitude]
      description: |
        등록되지 않은 곳을 지도에 직접 찍은 핀. 주로 숙소다. 이름·분류·위경도만 받는다 —
        주소도 작품도 없다.

        **핀은 담은 자리마다 따로 만들어진다.** 2박 3일 숙소를 1일차 끝과 2일차 끝에
        넣으면 핀이 둘 생긴다. 하나를 여러 자리가 나눠 쓰게 하면 프론트가 핀에 이름표를
        붙여 관리해야 하는데, 그 복잡함에 비해 얻는 것이 없다고 봤다 — 사용자 눈에는
        어느 쪽이든 같은 화면이다.

        그 대신 **숙소 이름이나 위치를 고치면 담은 자리마다 각각 보내야 한다.** 프론트가
        한 곳에서 고쳤다면 그 값을 해당 자리 전부에 채워 보낸다.

        `id` 가 있는 아이템에 이 값을 함께 보내면 그 자리의 핀을 갱신한다. 아이템이
        요청에서 빠지면 그 핀도 함께 지워진다 — 핀이 그 자리 전용이라 남길 이유가 없다.

        **이 핀은 그 코스 안에서만 존재한다.** 검색·지도 결과에 나타나지 않고 다른
        코스로 가져갈 수도 없다. 마켓에 올릴 때도 빠진다.
      properties:
        name:
          type: string
          maxLength: 50
        category:
          $ref: "#/components/schemas/PinCategory"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    CourseProgress:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CourseStatus"
        currentDayNo:
          type: integer
          minimum: 1
          description: |
            지금 몇 일차인지. `active` 로 바꿀 때 함께 보낸다. `upcoming` 으로 되돌릴
            때는 보내지 않는다 — 예정 코스에는 뜻이 없는 값이다.

    VisitUpdate:
      type: object
      required: [visited]
      properties:
        visited:
          type: boolean
          description: 체크했으면 `true`, 되돌리면 `false`. 시각은 서버가 찍는다.

    # ───────────── 작품 찜 ─────────────

    FavoriteContentCreate:
      type: object
      required: [contentId]
      properties:
        contentId:
          type: integer
          format: int64

    # ───────────── 코스마켓 ─────────────

    MarketSort:
      type: string
      enum: [saves, likes]
      default: saves
      description: 담기순(`saves`) / 좋아요순(`likes`). 동점이면 최근에 올라온 것이 앞선다.

    MarketCourseCreate:
      type: object
      required: [courseId, description]
      properties:
        courseId:
          type: integer
          format: int64
          description: 올릴 내 코스. **이 시점의 모습이 사본으로 떠진다.**
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: 이 코스가 어떤 코스인지. 목업 기준 200자다.

    MarketCourseList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketCourseSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    MarketCourseSummary:
      type: object
      required:
        [id, title, description, dayCount, placeCount, likeCount, saveCount, liked, saved, mine, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 올릴 때의 코스 이름. 사본이라 원본을 고쳐도 바뀌지 않는다.
        description:
          type: string
        dayCount:
          type: integer
        placeCount:
          type: integer
          description: 직접 찍은 핀을 뺀 수다. 원본보다 적을 수 있다.
        contents:
          type: array
          description: |
            이 코스의 작품 태그. 카드의 작품 배지이자 `q` 검색이 보는 대상이다.

            올릴 때 값으로 굳힌다 — 나중에 장소-작품 연결이 늘어도 올릴 때의 태그가
            유지된다.
          items:
            $ref: "#/components/schemas/ContentRef"
        thumbnailUrl:
          type: string
          nullable: true
          format: uri
        likeCount:
          type: integer
        saveCount:
          type: integer
        liked:
          type: boolean
          description: 내가 좋아요를 눌렀는가. 하트를 채울지 정한다. 비회원은 언제나 `false`.
        saved:
          type: boolean
          description: 내가 이미 담아 갔는가. 「담김」 표시에 쓴다.
        mine:
          type: boolean
          description: 내가 올렸는가. 「내리기」 버튼을 보일지 정한다.
        publishedAt:
          type: string
          format: date-time

    MarketCourseDetail:
      allOf:
        - $ref: "#/components/schemas/MarketCourseSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/MarketDay"

    MarketDay:
      type: object
      required: [dayNumber, items, dwellMinutes, travelMinutes, totalMinutes, travelBasis]
      description: |
        `CourseDay` 와 모양이 닮았지만 별개 스키마다. 이쪽은 **올린 시점의 사본**이라
        장소에 코스 아이템 id 도 방문 체크도 없다.

        직접 찍은 핀이 빠지므로 **`items` 가 빈 일차가 있을 수 있다.** 숙소만 넣어 둔
        마지막 날이 그렇다. 그래도 기간은 그대로 유지된다.
      properties:
        dayNumber:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketItem"
        dwellMinutes:
          type: integer
        travelMinutes:
          type: integer
        totalMinutes:
          type: integer
        travelBasis:
          $ref: "#/components/schemas/TravelBasis"

    MarketItem:
      type: object
      required: [placeId, name, latitude, longitude, dwellMinutes]
      properties:
        placeId:
          type: integer
          format: int64
          description: |
            언제나 등록된 촬영지다 — 직접 찍은 핀은 올릴 때 빠진다.

            장소 정보 자체는 사본으로 굳히지 않고 계속 참조한다. 이름이나 주소가 나중에
            고쳐지면 마켓에서도 고쳐진 값이 보이는 편이 맞다. 사본이어야 하는 것은 장소가
            아니라 **순서와 머무는 시간**이다.
        name:
          type: string
        address:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        dwellMinutes:
          type: integer
        distanceMetersFromPrevious:
          type: integer
          nullable: true
        sourceContentId:
          type: integer
          format: int64
          nullable: true
          description: |
            함께 복사한다. 없으면 담아 간 코스가 장소마다 「어느 작품 때문에 담겼는지」를
            잃는다 — 작품 태그는 코스 단위라 거기까지 말하지 못한다.
        sourceContentTitle:
          type: string
          nullable: true

    # ───────────── 길찾기 ─────────────

    NextLegRequest:
      type: object
      required: [courseId, itemId, latitude, longitude]
      description: |
        목적지는 코스 항목(`itemId`)으로만 가리킨다. 챗봇이 찾아 준 가게로 갈아타는
        것(코스에 없는 좌표)은 이 계약에 없다 — 호출 통제(「활성 코스의 항목만」)를
        느슨하게 만들기 때문에 따로 정한다.
      properties:
        courseId:
          type: integer
          format: int64
          description: 여행 중(`active`)인 코스여야 한다.
        itemId:
          type: integer
          format: int64
          description: |
            다음 목적지. 계획 순서와 달라도 된다 — 사용자는 계획대로만 움직이지 않는다.
        latitude:
          type: number
          format: double
          description: 지금 사용자의 위치
        longitude:
          type: number
          format: double

    NextLeg:
      type: object
      required: [totalMinutes, transfers, guidanceLang, legs]
      description: |
        현재 위치에서 다음 목적지까지의 실제 경로. 여행 중에만 나온다.

        구간(`legs`)이 따로 오는 이유 — 앱은 도보와 대중교통을 **다른 선**으로 그리고
        구간마다 안내 카드를 낸다. 전체를 선 하나로 뭉치면 「어디서 내려서 얼마나
        걷는가」가 사라진다.

        `legs` 가 비어 있으면 출발지와 목적지가 같다 — 이미 도착한 것이다. 오류가
        아니다.
      properties:
        totalMinutes:
          type: integer
          description: |
            예상 소요 시간(분). 제공자의 합계를 그대로 올림한 값이다 — 그 합계는
            **문에서 문까지**라 양 끝 도보와 대기가 이미 들어 있다(실측 2026-09-02).
            서버가 기워 넣은 도보 시간을 여기에 더하지 않는다. 더하면 두 번 센다.
        transfers:
          type: integer
          description: 환승 횟수. 도보만이면 0.
        walkMeters:
          type: integer
          nullable: true
          description: |
            걷는 거리(m). **모르면 `null` 이고 0 이 아니다.**

            카카오 대중교통 응답은 승차·하차 중심이라 도보 구간을 안 주는 것이 정상
            동작이다(카카오 확인). 서버가 도보 API 로 기워 넣는데, 그것도 실패하면
            모르는 값이다. 0 으로 두면 「안 걸어도 되는 경로」가 되어 가장 좋아
            보인다 — 프로토타입이 같은 실수를 네 번 반복하고 얻은 규칙이다.
        fareWon:
          type: integer
          nullable: true
          description: 요금(원). 도보만이면 0, 모르면 `null`. 범위로 오면 중간값을 쓴다.
        guidanceLang:
          type: string
          enum: [ko, en]
          description: |
            이 응답의 `legs[].guidance` 가 무슨 언어인가.

            제공자(카카오)는 한국어와 영어만 준다. `Accept-Language` 가 `ko` 면 `ko`,
            그 외(`en`·`ja`·`zh-Hant`)는 전부 `en` 으로 받는다 — 일본어 사용자에게
            한국어보다 영어가 낫고, 영어판은 고유명사가 로마자라 표지판과 맞춘다.
            **서버는 번역하지 않는다.** 앱이 이 값과 자기 로케일을 견줘 그대로 보여 줄지,
            기기 안에서 번역할지 정한다.
        legs:
          type: array
          description: 출발지부터 목적지까지 순서대로. 좌표를 이어 붙이면 전체 경로선이 된다.
          items:
            $ref: "#/components/schemas/RouteLeg"

    RouteLeg:
      type: object
      required: [mode, guidance, path, hasStairs]
      description: |
        한 번의 안내를 이루는 조각 하나 — 걷거나, 타거나.

        **문장이 아니라 재료를 준다.** 「도보 3분 · 210 m」「3 정거장 · 7분」「마을 종로02」
        같은 표시 문구는 앱이 `meters`·`seconds`·`stopCount`·`vehicleType`·`vehicleName`
        으로 자기 로케일에 맞춰 조립한다. 서버가 문장을 만들면 그 문장의 언어를 서버가
        떠안게 되고, 이 저장소는 표시 문구를 앱에 둔다.
      properties:
        mode:
          type: string
          enum: [walk, transit]
        guidance:
          type: string
          description: |
            제공자의 안내문 원문. 언어는 `NextLeg.guidanceLang` 이 말한다.
            도보는 턴바이턴(「반석빌라까지 110m 이동(북촌로11길)」 / 「Go 110m along
            Bukchon-ro 11-gil to Banseok Ville」), 대중교통은 노선과 승·하차
            (「마을 종로02외 1대 (북촌한옥마을입구 > 가회동주민센터)」).
          example: Go 110m along Bukchon-ro 11-gil to Banseok Ville
        meters:
          type: integer
          nullable: true
          description: 이 구간의 거리(m). 모르면 `null`.
        seconds:
          type: integer
          nullable: true
          description: 이 구간의 시간(초). 모르면 `null`.
        stopCount:
          type: integer
          nullable: true
          description: 대중교통만. 지나는 정거장 수 — 「N 정거장」. 도보는 `null`.
        vehicleType:
          type: string
          nullable: true
          description: |
            대중교통만. 「마을」「간선」「지선」「직행」「광역」 같은 제공자 원문. **어느 언어로
            요청해도 한국어다** — 제공자가 이 필드는 번역하지 않는다. 앱이 자기 표로 옮긴다.
          example: 마을
        vehicleName:
          type: string
          nullable: true
          description: 대중교통만. 「종로02」「143」「2호선」.
          example: 종로02
        path:
          $ref: "#/components/schemas/LineString"
        hasStairs:
          type: boolean
          description: |
            계단이 있는 구간인가. 카카오는 이것을 구조화해서 주지 않는다 — 대중교통
            안내문에 「계단」이 섞여 나올 때만 `true` 다. 도보 응답에는 그 문구조차
            없어 늘 `false` 인데, 이것은 「계단 없음」이 아니라 「모름」이다.
    LineString:
      type: object
      required: [type, coordinates]
      description: |
        GeoJSON(RFC 7946)의 `LineString`. 지도 라이브러리에 그대로 넣어 폴리라인으로
        그린다.

        자유 형식 객체(`type: object` 만)로 두지 않은 이유는 Swift 생성기가 그것을
        `AnyCodable` 로 만들고, 그 타입이 별도 의존성이라 클라이언트 빌드가 깨지기
        때문이다. 형태를 적어 두면 생성기가 제대로 된 타입을 만든다.
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          description: |
            **좌표 순서가 `[경도, 위도]` 다.** 국내 API 는 대부분 `위도, 경도` 순으로
            주므로 뒤집기 쉽고, 뒤집으면 좌표가 아프리카 앞바다로 간다.
          items:
            type: array
            items:
              type: number
              format: double

    GuideChatRequest:
      type: object
      required: [sessionId, latitude, longitude, messages]
      properties:
        sessionId:
          type: string
          format: uuid
          description: 대화 하나의 열쇠. 앱이 만들고 시트를 닫을 때까지 같은 값을 보낸다.
        latitude:
          type: number
          format: double
          description: 지금 사용자의 위치. 「주변」의 기준이자 길찾기의 출발점.
        longitude:
          type: number
          format: double
        messages:
          type: array
          minItems: 1
          maxItems: 40
          description: 대화 이력 전부. 마지막이 이번 질문이다. 서버는 이력을 저장하지 않는다.
          items:
            $ref: "#/components/schemas/GuideMessage"
        context:
          $ref: "#/components/schemas/GuideContext"

    GuideMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000

    GuideContext:
      type: object
      description: |
        **화면이 지금 보여 주는 것.** 질문마다 다시 만들어 보낸다 — 순서를 바꾸거나 동선
        최적화를 누르면 번호가 바뀌는데, 모델이 보는 번호와 지도의 번호가 같아야 한다.
      required: [stops]
      properties:
        stops:
          type: array
          maxItems: 50
          description: 지금 일차에 담긴 지점. 지도의 번호 핀과 **같은 번호**.
          items:
            $ref: "#/components/schemas/GuideStop"
        picked:
          $ref: "#/components/schemas/GuideStop"
        trip:
          $ref: "#/components/schemas/GuideTrip"

    GuideStop:
      type: object
      required: [number, name, latitude, longitude]
      properties:
        number:
          type: integer
          minimum: 0
          description: 지도의 번호. `picked` 에서는 0 이어도 된다.
        name:
          type: string
        category:
          type: string
          nullable: true
          description: 명소·식당·카페 같은 종류. 모델에게 「어떤 곳인지」를 주는 힌트다.
        latitude:
          type: number
          format: double
          description: 서버만 쓴다 — 번호를 좌표로 바꿀 때. 모델에게는 주지 않는다.
        longitude:
          type: number
          format: double
        visited:
          type: boolean
          default: false
          description: 이번 여행에서 다녀왔는가(발바닥 도장).

    GuideTrip:
      type: object
      description: |
        여행 상태. 없으면 여행 중이 아닌 것이다. 모델이 「방문 여부를 모른다」고 답하지
        않으려면 이것이 있어야 한다(2026-09-05 실측 — 발자국이 다 찍혔는데 몰랐다).
      required: [phase, course, day, days, walkedKilometers]
      properties:
        phase:
          type: string
          enum: [plan, guiding, arrived]
          description: 계획 보기 · 가는 중 · 도착함
        course:
          type: string
          description: 코스 제목
        day:
          type: integer
          minimum: 1
          description: 지금 보는 일차(1부터)
        days:
          type: integer
          minimum: 1
        targetNumber:
          type: integer
          nullable: true
          description: 가는(또는 방금 닿은) 곳의 번호. `plan` 이면 없다.
        targetMeters:
          type: integer
          nullable: true
          description: 내 자리에서 그 곳까지 **직선** m. 도로 거리가 아니고 모델에게도 그렇게 말한다.
        walkedKilometers:
          type: number
          format: double
          description: 최근 하루 발자국으로 잰 걸은 거리(km). 소수 첫째 자리.

    GuideChatReply:
      type: object
      required: [reply, toolsUsed, places, tookSeconds]
      properties:
        reply:
          type: string
          description: 사용자에게 보일 답. 사용자가 쓴 언어로 온다. 마크다운일 수 있다.
        toolsUsed:
          type: array
          description: 이번 턴에 실제로 부른 도구. 비면 도구 없이 상태·이력만으로 답한 것이다.
          items:
            $ref: "#/components/schemas/GuideToolUse"
        places:
          type: array
          description: |
            이번 턴에 `poi_nearby` 가 찾아 준 장소. **좌표가 있으므로 지도에 찍을 수 있다.**
            비면 앞 턴의 목록을 그대로 둔다 — 「어디 기준이야?」 같은 되물음에 목록이 사라지면 안 된다.
          items:
            $ref: "#/components/schemas/PoiSummary"
        route:
          nullable: true
          description: |
            `route` 도구가 그린 경로. 목적지가 코스 항목이 아니라 **찾아 준 편의시설**이라
            `POST /navigation/next-leg` 와 별개의 자리다(그 계약의 「따로 정한다」가 이것이다).
          allOf:
            - $ref: "#/components/schemas/NextLeg"
        tookSeconds:
          type: number
          format: double
          description: 서버가 잰 처리 시간. 화면이 「근거」줄에 같이 보인다.

    GuideToolUse:
      type: object
      required: [tool, arguments]
      properties:
        tool:
          type: string
          enum: [poi_nearby, route, add_to_cart]
        arguments:
          $ref: "#/components/schemas/GuideToolArguments"

    GuideToolArguments:
      type: object
      description: |
        모델이 넣은 인자 — 검증을 통과한 값만. 세 도구의 인자를 한 모양에 모았다(생성기가 자유 객체를
        못 만들어서다). 도구마다 쓰는 필드만 채워지고 나머지는 없다. 정본은 `contracts/schemas/guide/tools/`.
      properties:
        radiusMeters:
          type: integer
          nullable: true
          description: "`poi_nearby` — 반경"
        group:
          $ref: "#/components/schemas/PoiCategoryGroup"
        category:
          type: string
          nullable: true
          description: "`poi_nearby` — 업종"
        query:
          type: string
          nullable: true
          description: "`poi_nearby` — 이름에 들어갈 말"
        near:
          type: string
          nullable: true
          description: "`poi_nearby` — 기준. 번호·`선택`·빈 값"
        name:
          type: string
          nullable: true
          description: "`route`·`add_to_cart` — 보여 준 장소의 이름"
