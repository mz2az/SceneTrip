openapi: 3.0.3

# scene-api 의 REST 계약. 이 파일이 정본이고 핸들러가 여기를 따라간다.
#
# 규칙 (contracts/README.md · contracts/openapi/README.md):
#   - 손으로 쓴다. 구현에서 역생성하지 않는다.
#   - iOS·Android 클라이언트는 이 파일로부터 생성된다. 앱이 직접 쓰지 않는다.
#   - 파괴적 변경은 메이저 버전을 올리고 새 파일로 낸다 — 제자리 수정 금지.
#
# 설계 배경과 v1 에서 뺀 필드의 목록: docs/project/plans/scene-api-search-map.md

info:
  title: scene-api
  version: 1.1.0
  description: |
    SceneTrip 앱 **작품검색 탭**과 **경로여정 탭**을 받치는 API. 작품·촬영지·인물을
    검색하고, 지도 뷰포트 안의 촬영지를 조회하고, 방문할 장소를 장바구니에 담고,
    담은 장소로 며칠짜리 코스를 짜서 남과 나눈다.

    ## 언어

    사람이 읽는 모든 문자열(작품 제목, 장소명, 주소, 장면 설명)은
    `Accept-Language` 헤더를 따른다. 해당 언어의 번역이 없으면 `ko` 로 폴백하고,
    실제로 무엇을 골랐는지 `Content-Language` 응답 헤더로 알린다.

    ## 검색 범위

    **통합검색이다.** 사용자는 검색 전에 탭을 고르지 않는다. 검색어에 걸린 것과
    이어진 것을 **작품과 장소 양쪽으로 모두** 돌려주고, 탭은 그것을 종류별로 나눠
    보여 줄 뿐이다.

    훑는 곳은 다섯이고, 두 엔드포인트가 **같은 텍스트 뭉치**를 본다.

    | 훑는 곳 | 어떻게 |
    | --- | --- |
    | 장소명 · 장소 별칭 | `search_term` |
    | 장소 설명 | 원문 부분 일치 |
    | 작품 제목 · 작품 별칭 | `search_term` |
    | 작품 설명 | 원문 부분 일치 |
    | 인물 이름 (배우·감독) | `search_term` |

    걸린 것은 `place_content` 와 `content_cast` 를 타고 **양쪽으로 옮겨진다.**

    | 검색어 | 작품 탭 | 장소 탭 |
    | --- | --- | --- |
    | `도깨비` (작품명) | 도깨비 | 도깨비 촬영지 전부 |
    | `북촌한옥마을` (장소명) | 거기서 찍은 작품 전부 | 북촌한옥마을 |
    | `공유` (인물명) | 공유 출연작 | 그 출연작의 촬영지 전부 |
    | `한강` (장소 설명) | 그 장소의 촬영작 | 설명에 그 말이 든 장소 |

    별칭이 있으므로 `Goblin` 으로도 `도깨비` 가 걸린다.

    **다리는 하나만 건넌다.** `도깨비` 로 그 촬영지들까지는 오지만, 그 촬영지에서
    찍은 *또 다른* 작품까지 딸려 오지는 않는다. 무한히 번지면 결과가 사실상 전체
    목록이 되어 검색이 뜻을 잃는다.

    **엔드포인트는 나뉘어 있다.** 탭마다 페이지네이션이 따로 필요해 하나로 합치지
    않았다 — 합친 목록에는 `limit`·`offset`·`total` 이 하나뿐이라 "장소만 더" 를
    표현할 수 없다. 프론트가 둘을 호출해 각 탭에 꽂는다.

    **자동완성(`/search/suggestions`)은 범위가 좁다.** 이름류(`search_term`)만 보고
    설명은 보지 않는다. 제안어로 쓸 수 없는 긴 문장이 나오기 때문이다.

    **알려진 한계** — 수집된 장소명은 현재 한국어 표기뿐이라, 영어로 입력하면
    작품만 걸리고 장소는 걸리지 않는다. 장소 영문명 확보는 별도 작업이다.

    ## 인증

    v1 에는 로그인이 없다. 장바구니·코스·찜·마켓이 `X-Device-Id` 헤더의 기기 UUID 로
    주체를 구분한다. 로그인이 생기면 이 UUID 를 실제 사용자 계정에 이어 붙인다.

    남의 기기 것은 보이지 않는다. 마켓에 올라온 코스만 예외로 모두에게 공개된다.

    ## 코스의 시간 모델

    **시작 시각을 받지 않는다.** 따라서 장소별 도착·출발 시각을 계산하지 않고,
    그런 필드도 없다. 하루가 얼마나 걸리는지만 낸다.

    ```
    하루 소요 시간 = Σ 머무는 시간 + Σ 이동시간
    ```

    **떠나는 날도 필수가 아니다.** 코스를 만들 때는 며칠짜리인지만 받고, 날짜는
    나중에 붙이거나 비워 둘 수 있다.

    **여행 전과 여행 중이 다르다.**

    | | 계획 단계 (`status: upcoming`) | 여행 중 (`status: active`) |
    | --- | --- | --- |
    | 구간 표시 | 직선거리(m)만 | 실제 경로 |
    | 구간 소요 시간 | **주지 않는다** | 준다 |
    | 길찾기 API | 부르지 않는다 | 종량제로 한 구간씩 |

    그래서 `CourseItem` 에는 `distanceMetersFromPrevious` 만 있고 구간 소요 시간
    필드가 없다. 일차 단위의 `travelMinutes` 는 하루 합계를 설명하기 위한 값이고
    직선거리에서 나온 추정이다 — `CourseDay.travelBasis` 가 그 근거를 밝힌다.

    ## 수정은 PUT 전체 교체다

    코스와 아이템을 고칠 때 PATCH 를 쓰지 않는다. "떠나는 날을 지운다" 를 PATCH 로
    표현하려면 *필드가 없음*(안 고침)과 *값이 null*(지움)을 구분해야 하는데, 그 구분은
    생성기 설정과 의존성을 하나 더 부른다. PUT 은 구분 자체를 없앤다 — **보낸 것이
    전부이고 빠진 것은 지운 것이다.**

    ## 정렬과 상위 N

    목록의 기본 정렬은 **인기도 내림차순**이다. 지도 전체를 훑으면 핀이 수천 개가
    되므로 `limit` 이 상한이고, 잘린 경우 `total` 이 `items` 길이보다 크게 나온다.
    프론트는 이 차이로 "더 있음" 을 판단한다.

    **v1 의 인기도는 임시로 고정한 값이다.** 사용자 행동(조회·검색·저장) 기반의
    실제 계산은 로그가 쌓인 뒤에 붙인다. 그래서 점수 자체는 응답에 넣지 않는다 —
    지금 값에는 의미가 없고, 프론트가 쓸 것은 점수가 아니라 **정렬된 순서**다.
    나중에 계산 방식이 바뀌어도 이 계약은 그대로다.
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080/v1
    description: 로컬 개발

tags:
  - name: search
    description: 통합 검색과 자동완성
  - name: contents
    description: 작품 조회
  - name: places
    description: 촬영지 조회 — 목록·지도·상세
  - name: cart
    description: 장바구니 — 담긴 장소. 코스에 넣는 것은 `courses` 쪽이다
  - name: courses
    description: 코스 — 만들기·고치기, 일차와 그 안의 장소
  - name: favorites
    description: 작품 찜 — 장소 장바구니와 별개다
  - name: market
    description: 코스 공유 — 올리기·담기·내리기
  - name: navigation
    description: 길찾기 — 여행 중에만. 아직 구현되지 않았다

paths:
  /search/suggestions:
    get:
      tags: [search]
      operationId: suggest
      summary: 자동완성 제안
      description: |
        입력 중인 문자열에 대해 장소·작품·인물 제안을 인기도 순으로 돌려준다.
        앞글자 일치를 우선하고 부분 일치가 뒤따른다.

        **이름과 별칭만 본다. 설명·줄거리는 보지 않는다.** 목록 검색
        (`GET /contents`·`GET /places`)과 범위가 다른 점에 주의한다. 자동완성은
        한 줄짜리 제안이라 "줄거리 어딘가에 그 낱말이 있다" 를 보여 줄 방법이
        없고, 이름용 정규화(`term_norm`)는 문장에 맞지 않는다.

        각 항목이 `type` 과 `id` 를 들고 있으므로 프론트는 눌린 항목이 어디로
        가는지 추가 조회 없이 안다 — `place` 는 장소 상세, `content` 는 작품 상세,
        `person` 은 그 인물의 작품 목록(`GET /contents?personId=`).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          required: true
          description: 입력 중인 검색어. 앞뒤 공백은 서버가 제거한다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: gob
        - name: limit
          in: query
          description: 제안 개수 상한
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: 제안 목록. 걸린 것이 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents:
    get:
      tags: [contents]
      operationId: listContents
      summary: 작품 목록·검색
      description: |
        목업의 **작품 탭** 목록. `q` 가 없으면 인기도 상위 작품을 돌려준다.

        `q` 는 이 작품에 딸린 **모든 텍스트**에 걸린다.

        | 걸리는 곳 | 예 |
        | --- | --- |
        | 작품 제목 · 작품 별칭 | `도깨비` · `Goblin` |
        | 작품 설명 | `재벌` → 설명에 그 말이 든 작품 |
        | 인물 이름 (배우·감독) | `공유` → 공유 출연작 |
        | 이 작품이 성지로 가진 장소의 이름 · 별칭 | `북촌한옥마을` → 거기서 찍은 작품들 |
        | 이 작품이 성지로 가진 장소의 설명 | `한강` → 설명에 그 말이 든 장소의 촬영작 |

        마지막 두 줄이 `GET /places?q=` 와 **대칭**을 이룬다. 그쪽은 걸린 것과 이어진
        장소를 모으고, 이쪽은 이어진 작품을 모은다. 사용자는 검색 전에 탭을 고르지
        않으므로 검색어 하나가 두 탭을 모두 채워야 한다.

        **장면 설명은 보지 않는다.** 장면은 장소와 작품 사이에 붙은 값이라
        어느 한쪽의 검색 대상으로 삼으면 경계가 흐려진다.

        결과는 합쳐서 중복을 제거하고 **인기도 내림차순**으로 정렬한다. 같은
        작품이 제목과 배우 양쪽에 걸려도 한 번만 나온다.

        설명까지 뒤지므로 흔한 낱말은 결과가 많다. 정렬이 인기도순이고
        `limit`·`offset` 이 있으므로, 프론트는 위에서부터 필요한 만큼만 받아
        무한 스크롤로 이어 붙인다. `total` 로 남은 양을 안다.

        `personId` 는 인물을 **정확히 지목**할 때 쓴다 — 자동완성에서 인물
        제안을 누른 경우다. 동명이인이 있어도 어긋나지 않는다는 점이 `q` 와
        다르다. 둘을 함께 주면 교집합이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          description: 작품 제목·별칭·설명·인물 이름·촬영지 이름·별칭·설명을 함께 검색
          schema:
            type: string
            maxLength: 100
          example: 공유
        - name: personId
          in: query
          description: 이 인물이 참여한 작품만
          schema:
            type: integer
            format: int64
        - name: category
          in: query
          description: 작품 분류
          schema:
            $ref: "#/components/schemas/ContentCategory"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 인기도 내림차순 작품 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents/{contentId}:
    get:
      tags: [contents]
      operationId: getContent
      summary: 작품 상세
      description: |
        목업의 **작품 상세** 화면. 줄거리·출연진·별칭까지 포함한다.
        촬영지 목록은 별도 조회다 — `GET /contents/{contentId}/places`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: 작품 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents/{contentId}/places:
    get:
      tags: [contents, places]
      operationId: listContentPlaces
      summary: 한 작품의 촬영지 목록
      description: |
        작품 상세 화면의 **촬영 장소 리스트**이자, 지도에 찍을 핀의 원본이다.

        목업은 각 행에 번호를 매겨 촬영 순서처럼 보여 주지만, 수집 데이터에
        촬영 순서가 없다. 응답은 인기도 내림차순이고 번호는 프론트가 배열
        순서대로 매긴다.

        `lat`·`lng` 를 함께 주면 각 항목의 `distanceMeters` 가 채워진다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 이 작품의 촬영지 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /places:
    get:
      tags: [places]
      operationId: listPlaces
      summary: 촬영지 목록·검색·지도 조회
      description: |
        하나의 엔드포인트가 목업의 세 가지 상황을 모두 담당한다.

        | 상황 | 파라미터 |
        | --- | --- |
        | 장소 탭 검색 | `q` |
        | 지도 뷰포트 안의 핀 · 「현 지도 내 성지 검색」 | `bbox` |
        | 한 점을 중심으로 한 반경 (「이어서 걷기 좋은 곳」) | `lat` + `lng` + `radiusMeters` |

        **`bbox` 와 `radiusMeters` 는 함께 쓸 수 없다.** 둘 다 오면 400 이다.
        화면은 네모지 원이 아니므로 「이 화면 안」을 묻는 동작에는 `bbox` 를 쓴다 —
        앱의 「현 지도 내 성지 검색」이 그렇게 부른다.
        영역 조건이 하나도 없으면 전국을 대상으로 인기도 상위를 돌려준다.

        `sort=distance` 는 기준점이 있을 때만 유효하다 — `lat`·`lng` 없이 주면 400.

        `q` 는 이 장소에 딸린 **모든 텍스트**에 걸린다.

        | 걸리는 곳 | 예 |
        | --- | --- |
        | 장소명 · 장소 별칭 | `여의도공원` |
        | 장소 설명 | `한강` → 설명에 그 말이 든 장소 |
        | 이 장소에서 촬영된 작품의 제목·별칭 | `도깨비` → 도깨비 촬영지 전부 |
        | 이 장소에서 촬영된 작품의 설명 | `재벌` → 그런 작품이 촬영된 장소들 |
        | 그 작품에 참여한 인물의 이름 | `공유` → 공유 출연작의 촬영지 전부 |

        `GET /contents?q=` 와 **같은 텍스트 뭉치**를 본다. 다른 것은 결과를 작품으로
        내느냐 장소로 내느냐뿐이다. 검색어 하나로 두 탭이 함께 채워지고, 사용자는
        탭을 먼저 고르지 않는다.

        작품을 **정확히 지목**하려면 `contentId` 를 쓴다 — 작품 탭에서 작품을 눌렀을
        때다. `GET /contents/{contentId}/places` 도 같은 것을 준다.

        **장면 설명은 보지 않는다.** 장면은 장소와 작품 사이에 붙은 값이라
        어느 한쪽의 검색 대상으로 삼으면 경계가 흐려진다.

        결과는 중복을 제거하고 **인기도 내림차순**으로 정렬한다. 흔한 낱말은
        결과가 많으므로 `limit`·`offset` 으로 나눠 받는다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          description: 장소명·별칭·장소 설명·등장 작품의 제목·별칭·설명·출연진 이름을 함께 검색
          schema:
            type: string
            maxLength: 100
          example: 감자탕
        - name: contentId
          in: query
          description: 이 작품에 등장한 장소만
          schema:
            type: integer
            format: int64
        - name: bbox
          in: query
          description: |
            지도 뷰포트. `minLng,minLat,maxLng,maxLat` 순서의 쉼표 구분 4개 —
            GeoJSON 과 같은 경도-위도 순서다.
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
          example: 126.9,37.5,127.1,37.6
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
        - name: radiusMeters
          in: query
          description: |
            기준점으로부터의 반경. 지금 이것을 쓰는 곳은 촬영지 상세의
            "이어서 걷기 좋은 곳" 하나다 (`GET /places/{placeId}` 설명 참고).
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            type: string
            enum: [popularity, distance]
            default: popularity
        - name: limit
          in: query
          description: |
            돌려줄 개수 상한. 지도용이라 목록 기본값보다 크다.
            `total` 이 이 값보다 크면 인기도 상위만 잘려 나온 것이다.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 조건에 맞는 촬영지 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /places/{placeId}:
    get:
      tags: [places]
      operationId: getPlace
      summary: 촬영지 상세
      description: |
        목업의 **촬영지 상세** 화면. 이 장소에서 촬영된 작품들과 각 장면 설명을
        함께 돌려준다.

        "이어서 걷기 좋은 곳" 은 별도 필드가 아니다. 이 장소의 좌표로
        `GET /places?lat=&lng=&radiusMeters=1000&limit=3` 을 부르면 된다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
      responses:
        "200":
          description: 촬영지 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: 장바구니 조회
      description: 담은 순서(오래된 것부터)로 돌려준다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: 장바구니 내용. 비어 있으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: 장바구니에 담기
      description: |
        목업에는 담는 경로가 셋이다 — 장소 카드의 `+`, 상세의 저장 버튼,
        장면 팝업의 북마크. 셋 다 이 하나를 부른다.

        같은 장소를 두 번 담으면 409 다. 프론트는 이때
        "이미 저장된 장소입니다" 토스트를 띄운다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemCreate"
      responses:
        "201":
          description: 담긴 항목
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 이미 담긴 장소
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /cart/items/{placeId}:
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: 장바구니에서 빼기
      description: 목업 상세 화면의 "저장됨" 토글을 되돌리는 동작.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 삭제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /courses:
    get:
      tags: [courses]
      operationId: listCourses
      summary: 내 코스 목록
      description: |
        여행 중(`active`)인 코스가 위, 예정(`upcoming`)이 아래이고 각각 최근에 만든 순이다.
        홈 화면의 정렬 그대로라 프론트는 받은 순서를 그리면 된다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: 코스 목록. 하나도 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [courses]
      operationId: createCourse
      summary: 코스 만들기
      description: |
        **받는 것은 기간과 만든 방식뿐이다.** 떠나는 날도 시작 시각도 받지 않는다.

        만들어진 코스는 일차만 있고 장소는 비어 있다. 장소를 담는 것은 편집이고,
        편집은 `PUT /courses/{courseId}` 한 번으로 끝난다.

        마켓에서 담아 오는 경우는 이 경로가 아니라
        `POST /market/courses/{marketCourseId}/saves` 다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
      responses:
        "201":
          description: 만들어진 코스. 일차는 비어 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}:
    get:
      tags: [courses]
      operationId: getCourse
      summary: 코스 상세
      description: |
        일차와 그 안의 장소를 순서대로, 하루 소요 시간까지 담아 돌려준다. 화면 하나를
        그리는 데 필요한 것이 전부 이 응답에 있다.

        **편집 화면도 이것 하나로 시작한다.** 받은 내용을 프론트가 메모리에 들고
        편집하다가, 완료를 누를 때 `PUT` 으로 되돌려 보낸다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: 코스 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [courses]
      operationId: replaceCourse
      summary: 편집 완료 — 코스 전체 교체
      description: |
        **편집 화면의 「완료」가 부르는 하나뿐인 요청이다.**

        제목을 고치고, 기간을 늘렸다 줄이고, 장소를 담고 빼고, 드래그로 순서를 바꾸고,
        체류시간을 조절하는 동안 서버로는 아무것도 나가지 않는다. 프론트가 코스 사본을
        들고 편집하다가 완료를 누를 때 **최종 모습을 통째로** 보낸다.

        그래서 되돌리기가 공짜다 — 잘못 지웠어도 완료 전이면 서버에 아무 일도 일어나지
        않았다. 그리고 한 트랜잭션이라 반쪽만 반영되는 상태가 없다.

        ## 보낸 것이 전부다

        | 보낸 것 | 결과 |
        | --- | --- |
        | `days` 배열의 길이 | 그것이 곧 기간이다. 3개면 3일 코스 |
        | `id` 가 있는 아이템 | 원래 있던 것 — **그대로 유지된다** |
        | `id` 가 없는 아이템 | 새로 담은 것 |
        | 요청에 없는 아이템 | **지워진다** (직접 찍은 핀이었다면 핀도 함께) |
        | `startDate` 를 뺌 | 떠나는 날을 지운다 |

        **기존 장소는 받았던 `id` 를 반드시 실어 보낸다.** 빠뜨리면 서버가 새 장소로
        보아 **방문 체크(`visitedAt`)가 날아간다.**

        ## 기간을 줄이면 장소가 지워진다

        5일 코스의 `days` 를 3개만 보내면 4·5일차의 장소가 **삭제된다.** 되돌릴 수 없다.

        **프론트는 완료를 누르기 전에 확인을 받아야 한다** — "4일차·5일차의 장소 3곳이
        삭제됩니다". 편집 화면이 이미 코스 전체를 들고 있으므로 몇 곳인지 세는 데 추가
        호출이 필요 없다.

        ## 상태는 여기서 못 바꾼다

        코스를 시작하거나 일차를 넘기는 것은 편집이 아니라 여행 중 동작이다.
        `PUT /courses/{courseId}/progress` 를 쓴다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseReplace"
      responses:
        "200":
          description: 반영된 코스. 이동시간과 하루 소요 시간이 새 순서로 다시 계산돼 있다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            여행 중인 코스를 지금 일차보다 짧게 줄이려 했다. 3일차를 걷고 있는데 2일
            코스로 만들 수는 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [courses]
      operationId: deleteCourse
      summary: 코스 삭제
      description: |
        일차·장소·이 코스에서 찍은 핀이 함께 지워진다.

        **마켓에 올려 둔 사본은 남는다.** 사본이라 원본과 수명이 다르다 — 내리려면
        `DELETE /market/courses/{marketCourseId}` 를 따로 부른다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: 삭제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}/progress:
    put:
      tags: [courses]
      operationId: updateCourseProgress
      summary: 코스 시작·일차 이동 (여행 중)
      description: |
        **편집이 아니라 여행 중 동작이라 즉시 반영된다.** 「시작」을 누르면 `active` 가
        되고 그때부터 방문 체크와 지도 위 현재 위치가 나온다.

        상태에 「완료」가 없는 것은 목업 그대로다. 여행을 끝내면 `upcoming` 으로 돌아간다.

        `active` 로 바꿀 때 `currentDayNo` 를 함께 보낸다. `upcoming` 으로 되돌릴 때는
        보내지 않는다 — 예정 코스에 "지금 몇 일차" 는 뜻이 없다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseProgress"
      responses:
        "200":
          description: 바뀐 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /courses/{courseId}/items/{itemId}/visit:
    put:
      tags: [courses]
      operationId: updateCourseItemVisit
      summary: 방문 체크 (여행 중)
      description: |
        성지에 도착해 체크를 누르는 동작이다. **편집이 아니라 즉시 반영된다** — 이때
        코스 전체를 보내라고 할 수는 없다.

        토글이라 이미 체크된 것을 다시 체크해도 오류가 아니다. 체크한 시각은 서버가
        찍는다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitUpdate"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 여행 중이 아닌 코스. 예정 상태에서는 방문 체크가 뜻이 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /favorites/contents:
    get:
      tags: [favorites]
      operationId: listFavoriteContents
      summary: 찜한 작품 목록
      description: |
        찜한 순서(최근 것부터)로 돌려준다.

        「어떤 작품을 좋아하나요?」 화면이 이것을 맨 위에 모으고, AI 코스 추천이
        우선순위 입력으로 읽는다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 찜 목록. 하나도 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [favorites]
      operationId: addFavoriteContent
      summary: 작품 찜하기
      description: |
        **작품에는 찜(하트), 장소에는 장바구니다. 장소에 찜은 없다.** 둘은 다른 것이라
        합치지 않았다 — 장소를 담는 것은 `POST /cart/items` 다.

        비회원도 찜할 수 있다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteContentCreate"
      responses:
        "204":
          description: |
            찜됨. **이미 찜한 작품을 다시 보내도 204 다.** 하트는 토글이라 같은 상태를
            두 번 요청하는 일이 흔하고, 그때마다 409 를 내면 프론트가 사용자에게 보여 줄
            것이 없다. 장바구니(`POST /cart/items`)가 409 를 내는 것과 다른 점이다.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /favorites/contents/{contentId}:
    delete:
      tags: [favorites]
      operationId: removeFavoriteContent
      summary: 찜 해제
      description: 찜하지 않은 작품을 해제해도 `204` 다. 이유는 찜하기와 같다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204":
          description: 해제됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses:
    get:
      tags: [market]
      operationId: listMarketCourses
      summary: 올라온 코스 목록
      description: |
        누구나 볼 수 있다. 내려간 코스는 나오지 않는다.

        `q` 는 **작품 이름**으로 찾는다 — 한글 제목·영문 제목·줄임말을 모두 보므로
        `Goblin` 으로도 도깨비 코스가 걸린다. 코스 이름이 아니라 작품 이름인 이유는,
        사용자가 마켓에 오는 동기가 "이 작품 성지순례 코스를 찾고 싶다" 이기 때문이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - name: q
          in: query
          description: 작품 이름. 생략하면 전체 목록이다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            $ref: "#/components/schemas/MarketSort"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 올라온 코스 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [market]
      operationId: createMarketCourse
      summary: 코스 올리기
      description: |
        **올린 코스는 사본이다.** 올리는 순간의 일차·순서·머무는 시간을 통째로 떠서
        저장한다. 그 뒤에 원본을 고쳐도 마켓의 것은 그대로 남는다 — 남이 담아 간 코스가
        어느 날 갑자기 바뀌면 안 되기 때문이다.

        사본이라 고칠 방법이 없다. 바꾸려면 내렸다가 다시 올린다. 그러면 새 사본이 된다.
        한 코스를 동시에 두 번 올릴 수는 없다.

        **직접 찍은 핀은 빠진다.** 개인 숙소 위치가 남에게 공개되면 안 되기 때문이다.
        경복궁 → 숙소 → 북촌으로 짠 코스는 경복궁 → 북촌으로 올라간다. 프론트는 올리기
        화면에서 "직접 찍은 핀 1곳은 공유되지 않습니다" 를 미리 알려 준다 — 숙소를
        기준으로 동선을 짰다면 남는 순서가 어색해 보일 수 있는데 올린 사람은 그것을
        모른다.

        핀만 있던 일차는 사본에서 비어 있게 되고, 그래도 기간은 그대로 유지된다.

        **가입 사용자만 올릴 수 있다.** 비회원이 올린 뒤 앱을 지우면 그 코스를 아무도
        내릴 수 없어서다 — 신고가 들어와도 본인이 처리하지 못한다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketCourseCreate"
      responses:
        "201":
          description: 올라간 사본
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 그 코스는 이미 올라가 있다. 내린 뒤에 다시 올린다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}:
    get:
      tags: [market]
      operationId: getMarketCourse
      summary: 올라온 코스 상세
      description: |
        **올린 시점의 모습이다.** 원본 코스의 현재 모습이 아니다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "200":
          description: 사본의 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [market]
      operationId: deleteMarketCourse
      summary: 내리기
      description: |
        올린 사람만 내릴 수 있다. 목록과 상세에서 사라진다.

        **이미 담아 간 사람의 코스는 그대로 남는다** — 담기가 복사이기 때문이다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 내려감
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "403":
          description: 남이 올린 코스는 내릴 수 없다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}/saves:
    post:
      tags: [market]
      operationId: saveMarketCourse
      summary: 담기 — 내 코스로 복사
      description: |
        순서와 머무는 시간을 그대로 복사해 **내 코스를 새로 만든다.** 응답이 그 새 코스다.

        **날짜는 묻지 않는다** — 떠나는 날은 비어 있고 나중에 붙인다. 만든 방식은
        `market` 으로 기록되고, 어느 코스에서 담아 왔는지도 남는다.

        담은 뒤로는 원본과 아무 관계가 없어 마음대로 고칠 수 있다. 같은 코스를 여러 번
        담으면 그때마다 새 코스가 생긴다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "201":
          description: 새로 만들어진 내 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /market/courses/{marketCourseId}/likes:
    post:
      tags: [market]
      operationId: likeMarketCourse
      summary: 좋아요
      description: 이미 누른 상태로 다시 보내도 `204` 다. 하트는 토글이라 그렇다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [market]
      operationId: unlikeMarketCourse
      summary: 좋아요 취소
      description: 누르지 않은 상태로 보내도 `204` 다.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/MarketCourseId"
      responses:
        "204":
          description: 반영됨
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /navigation/next-leg:
    post:
      tags: [navigation]
      operationId: getNextLeg
      summary: 현재 위치에서 다음 목적지까지 (여행 중 전용)
      description: |
        > **아직 구현되지 않았다. 지금은 `501` 을 돌려준다.**
        > 선행 티켓 MZ2AZ-204(T맵 종량제 연동 준비)와 MZ2AZ-205(남용 방지 정책)가 끝나야
        > 한다. 아래 요청·응답 모양은 T맵 응답을 확인하며 바뀔 수 있으므로 **이 경로에
        > 의존하는 화면을 아직 만들지 않는다.**

        **여행 중에만 부를 수 있다.** 코스가 `active` 가 아니면 `409` 다. 유료 API 라
        호출 여부를 서버가 정한다 — 클라이언트가 정하게 두면 과금이 클라이언트 손에
        넘어간다. 같은 이유로 가입 사용자만 부를 수 있다.

        전체 구간을 미리 계산해 두지 않고 **한 구간씩** 부른다. 사용자가 계획대로만
        움직이지 않기 때문이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NextLegRequest"
      responses:
        "200":
          description: 실제 경로와 예상 소요 시간
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NextLeg"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SignInRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 여행 중이 아닌 코스
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "501":
          description: 아직 구현되지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: 응답 언어. 생략하거나 해당 번역이 없으면 `ko` 로 폴백한다.
      schema:
        $ref: "#/components/schemas/Lang"

    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        앱이 최초 실행 시 생성해 보관하는 기기 UUID. 장바구니의 주체다.
        로그인이 도입되면 이 값을 사용자 계정에 이어 붙인다.
      schema:
        type: string
        format: uuid

    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    ItemId:
      name: itemId
      in: path
      required: true
      description: 코스 안의 장소 하나. `CourseItem.id` 다.
      schema:
        type: integer
        format: int64

    MarketCourseId:
      name: marketCourseId
      in: path
      required: true
      description: 마켓에 올라온 사본의 id. 원본 코스의 id 가 아니다.
      schema:
        type: integer
        format: int64

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0

    OriginLat:
      name: lat
      in: query
      description: 거리 계산의 기준 위도. `lng` 와 반드시 짝으로 준다.
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90

    OriginLng:
      name: lng
      in: query
      description: 거리 계산의 기준 경도. `lat` 와 반드시 짝으로 준다.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180

  headers:
    ContentLanguage:
      description: 서버가 실제로 고른 언어. 요청한 언어와 다를 수 있다(폴백).
      schema:
        $ref: "#/components/schemas/Lang"

  responses:
    BadRequest:
      description: 파라미터가 규칙에 맞지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 대상이 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    SignInRequired:
      description: |
        가입해야 할 수 있는 동작. 좋아요 · 마켓에 담기 · 마켓에 올리기 · 여행 중 길찾기
        넷이다.

        나머지는 계정 없이 다 된다 — 검색하고, 장바구니에 담고, 작품을 찜하고, 코스를
        만들어 시작하는 데까지 계정이 필요 없다. 로그인 벽을 앞에 세우면 사람들이 앱을
        써 보기도 전에 나가기 때문이다.

        마켓 쪽을 막은 이유는 비회원이 올린 뒤 앱을 지우면 그 코스를 아무도 내릴 수 없어
        서다. 길찾기를 막은 이유는 다르다 — T맵 종량제라 호출마다 돈이 나가는데, 계정이
        없으면 누가 얼마나 썼는지 셀 수가 없다.

        > **지금은 아무도 이 벽을 넘지 못한다.** 로그인 스토리가 8/23 주차라 가입할
        > 방법이 아직 없다. 계약에 자리를 잡아 두는 것이므로 **프론트는 이 동작들의
        > 화면을 아직 만들지 않는다.**
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: |
        서버가 요청을 처리하지 못함. **재시도해도 된다** — 클라이언트가 고칠 것은 없다.

        이 응답에만 `traceId` 가 실린다. 사용자가 그 문자열 하나를 알려 주면 서버 쪽에서
        그 요청의 트레이스와 로그를 그대로 찾을 수 있으므로, **화면에 보여 주거나 오류
        보고에 함께 담는다.** 다른 상태 코드에는 이 필드가 없다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    Lang:
      type: string
      enum: [ko, en, ja, zh-Hant]
      default: ko
      description: 지원 언어. `zh-Hant` 는 번체(대만·홍콩)로 간체와 구분한다.

    ContentCategory:
      type: string
      enum: [drama, movie, variety, kpop]

    EntityType:
      type: string
      enum: [place, content, person]
      description: |
        검색 결과의 종류. 목록 화면의 탭은 장소·작품 둘뿐이고,
        `person` 은 자동완성에만 나타나 작품 목록으로 연결된다.

    RoleType:
      type: string
      enum: [actor, director]
      description: 이 작품에서의 직군. 사람의 속성이 아니라 사람과 작품 사이의 속성이다.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            기계가 분기하는 식별자. 클라이언트 로직은 이 값만 보고 판단한다.

            **전체 목록과 각 코드의 뜻은 `docs/api/errors.md` 에 있다.** 여기에
            같은 목록을 두면 한쪽만 고쳐져 어긋나므로 옮겨 적지 않는다.
          example: PLACE_NOT_FOUND
        message:
          type: string
          description: 사람이 읽는 설명. 사용자에게 그대로 보여 줄 문구가 아니다.
        traceId:
          type: string
          nullable: true
          description: |
            이 요청의 추적 ID. SigNoz 에서 같은 값으로 조회할 수 있다.

            **`500` 응답에만 실린다.** `400`·`404`·`409` 는 클라이언트가 무엇을 잘못했는지
            `code` 로 이미 알 수 있어 서버 로그를 뒤질 일이 없다. 값이 없는 필드는 응답에서
            아예 빠지므로, 다른 상태 코드에서는 이 키가 보이지 않는다.

    SuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"

    Suggestion:
      type: object
      required: [type, id, name]
      properties:
        type:
          $ref: "#/components/schemas/EntityType"
        id:
          type: integer
          format: int64
          description: 종류에 따라 장소·작품·인물의 ID
        name:
          type: string
          description: 화면에 보여 줄 대표 이름
          example: 도깨비
        matchedTerm:
          type: string
          nullable: true
          description: |
            실제로 걸린 표기. 별칭으로 걸렸을 때 `name` 과 다르다 —
            `Goblin` 으로 쳐서 `도깨비` 가 나왔다면 이 값이 `Goblin` 이다.
        subtitle:
          type: string
          nullable: true
          description: |
            같은 이름을 구별하기 위한 보조 문구. 작품은 `방송사 · 연도`,
            장소는 주소의 시·구, 인물은 대표 작품이 들어간다.
          example: "tvN · 2016"

    ContentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentSummary"
        total:
          type: integer
          description: 조건에 맞는 전체 개수. `items` 길이보다 크면 잘린 것이다.
        limit:
          type: integer
        offset:
          type: integer

    ContentSummary:
      type: object
      required: [id, category, title, placeCount]
      properties:
        id:
          type: integer
          format: int64
        category:
          $ref: "#/components/schemas/ContentCategory"
        title:
          type: string
          example: 도깨비
        posterUrl:
          type: string
          nullable: true
          format: uri
        broadcaster:
          type: string
          nullable: true
          example: tvN
        releaseYear:
          type: integer
          nullable: true
          example: 2016
        genres:
          type: array
          description: 수집 원본에서 `;` 로 구분된 값을 분해한 것
          items:
            type: string
          example: ["판타지", "멜로"]
        placeCount:
          type: integer
          description: 이 작품의 촬영지 수

    ContentDetail:
      allOf:
        - $ref: "#/components/schemas/ContentSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: 줄거리
            aliases:
              type: array
              description: 다른 표기. 영어 제목이 여기 들어간다.
              items:
                type: string
              example: ["Guardian: The Lonely and Great God", "Goblin"]
            cast:
              type: array
              items:
                $ref: "#/components/schemas/PersonRef"

    PersonRef:
      type: object
      required: [personId, name, roleType]
      properties:
        personId:
          type: integer
          format: int64
        name:
          type: string
        roleType:
          $ref: "#/components/schemas/RoleType"

    ContentRef:
      type: object
      required: [contentId, title]
      properties:
        contentId:
          type: integer
          format: int64
        title:
          type: string
        posterUrl:
          type: string
          nullable: true
          format: uri

    PlaceList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaceSummary"
        total:
          type: integer
          description: |
            조건에 맞는 전체 개수. `items` 길이보다 크면 인기도 상위만 잘려
            나온 것이다 — 지도에서 "더 있음" 을 판단하는 근거다.
        limit:
          type: integer
        offset:
          type: integer

    PlaceSummary:
      type: object
      required: [id, name, latitude, longitude]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: 여의도공원
        type:
          type: string
          nullable: true
          description: |
            수집된 장소 유형을 가공 없이 그대로 돌려준다. 현재 37종의 자유
            문자열이라 필터 값으로 쓰기에 적합하지 않다 — 목업의 카테고리 칩으로
            묶는 매핑은 데이터 정제 후에 정한다.
          example: 카페
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
          description: 대표 이미지. 정렬 순서상 첫 번째 사진이다.
        distanceMeters:
          type: integer
          nullable: true
          description: 요청에 `lat`·`lng` 가 있을 때만 채워진다.
        contents:
          type: array
          description: 이 장소에 등장한 작품들. 목업 장소 카드의 작품 배지에 대응한다.
          items:
            $ref: "#/components/schemas/ContentRef"
        sceneDescription:
          type: string
          nullable: true
          description: |
            이 장소가 작품에서 어떻게 등장했는지. `contentId` 로 좁혀 조회했을 때
            (또는 `GET /contents/{contentId}/places`) 그 작품 기준으로 채워진다.
            작품을 특정하지 않은 조회에서는 `null` 이다.

    PlaceDetail:
      allOf:
        - $ref: "#/components/schemas/PlaceSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
              description: 장소 자체의 설명. 작품별 장면 설명은 `scenes` 쪽이다.
            naverPlaceUrl:
              type: string
              nullable: true
              format: uri
              description: 네이버 지도 링크. 길찾기 연동에 쓴다.
            imageUrls:
              type: array
              description: 정렬 순서대로의 전체 사진
              items:
                type: string
                format: uri
            scenes:
              type: array
              description: |
                이 장소에서 촬영된 작품과 장면. 목업의 "이 장소의 장면" 가로
                스크롤 카드에 대응한다.

                **인기도 내림차순**이다. 같은 인기도면 최신 작품이 앞선다.
                한 장소가 여러 작품에 걸릴 때 어느 것을 먼저 보여 줄지가
                화면에서 갈리지 않도록 서버가 정한다 — 클라이언트는 받은
                순서를 그대로 그린다.
              items:
                $ref: "#/components/schemas/Scene"

    Scene:
      type: object
      required: [contentId, contentTitle]
      properties:
        contentId:
          type: integer
          format: int64
        contentTitle:
          type: string
        posterUrl:
          type: string
          nullable: true
          format: uri
          description: 작품 포스터. 장면 사진이 아니다 — 그쪽은 `sceneImageUrl`.
        sceneDescription:
          type: string
          nullable: true
          description: 이 작품에서 이 장소가 어떻게 등장했는지
        sceneImageUrl:
          type: string
          nullable: true
          format: uri
          description: |
            그 장면의 스틸. 작품마다 다르므로 `posterUrl` 과 별개다.

            목업에서 작품을 눌렀을 때 뜨는 팝업이 `sceneDescription` 과 이것을
            함께 쓴다. 둘 다 이 응답에 실려 오므로 **팝업을 열 때 추가 호출이
            필요 없다.**

            수집분에 없는 장면이 있어 `null` 이 올 수 있다. 그때는 자리를 비우고
            설명만 보여 준다 — 포스터로 대신 채우면 사용자가 그것을 장면 사진으로
            읽는다.

    Cart:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        totalCount:
          type: integer

    CartItemCreate:
      type: object
      required: [placeId]
      properties:
        placeId:
          type: integer
          format: int64
        sourceContentId:
          type: integer
          nullable: true
          format: int64
          description: |
            어떤 작품을 보다가 담았는지. 선택 사항이지만, 장바구니 목록에
            대표 작품을 보여 주려면 필요하다.

    CartItem:
      type: object
      required: [placeId, name, addedAt]
      properties:
        placeId:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        sourceContentId:
          type: integer
          nullable: true
          format: int64
        sourceContentTitle:
          type: string
          nullable: true
        addedAt:
          type: string
          format: date-time
    # ───────────── 코스 ─────────────

    CourseStatus:
      type: string
      enum: [upcoming, active]
      description: |
        예정(`upcoming`) / 여행 중(`active`).

        **이 값이 여행 중 기능의 스위치다.** `active` 일 때만 방문 체크와 길찾기가
        열린다. 「완료」 상태가 없는 것은 목업 그대로다 — 여행을 끝내면 `upcoming` 으로
        돌아가고, 지난 여행은 떠나는 날로 구분한다.

    CourseOrigin:
      type: string
      enum: [ai, self, market]
      description: |
        이 코스를 어떻게 만들었는가. AI 가 짠 코스와 직접 짠 코스의 완주율이 다를 것이라
        나중에 비교하려면 만든 시점에 남겨 둬야 한다 — 소급이 안 된다.

        `market` 은 코스마켓에서 담아 온 것이고, 이 값은 서버가 붙인다.

    CoursePace:
      type: string
      enum: [tight, loose]
      description: |
        「빡빡하게 / 널널하게」. AI 로 짠 코스만 값이 있다.

        **지금은 두 값의 결과가 같다.** 항목은 확정됐지만 일정을 어떻게 바꾸는지가 아직
        정해지지 않았다(3주차 회의 Open Issue 3). 그래도 받아 두는 이유는 로직이
        정해지면 지난 코스도 다시 계산할 수 있어서다.

    PinCategory:
      type: string
      enum: [lodging, food, attraction, street, building]
      description: |
        직접 찍은 핀의 분류. 목업의 다섯 갈래다 — 숙소 · 음식점·카페 · 명소·자연 ·
        거리·다리 · 건물·시설.

        등록된 촬영지의 `type` 과 다르다. 그쪽은 수집된 자유 문자열이고 이쪽은 사용자가
        고르는 닫힌 목록이다.

    TravelBasis:
      type: string
      enum: [straight-line, route]
      description: |
        이동시간을 무엇으로 냈는가. `straight-line` 은 직선거리에서 나온 **추정**이라
        실제와 다르다. 계획 단계는 언제나 이 값이다.

    CourseItemSource:
      type: string
      enum: [place, customPin]
      description: 등록된 촬영지인가, 사용자가 지도에 직접 찍은 핀인가.

    CourseCreate:
      type: object
      required: [dayCount, origin]
      properties:
        dayCount:
          type: integer
          minimum: 1
          maximum: 15
          description: 며칠짜리인가. 이만큼의 빈 일차가 함께 만들어진다.
        title:
          type: string
          maxLength: 50
          description: 비우면 서버가 「이름 없는 코스」로 채운다. 응답에는 언제나 값이 있다.
        origin:
          $ref: "#/components/schemas/CourseOrigin"
        pace:
          $ref: "#/components/schemas/CoursePace"

    CourseList:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourseSummary"
        totalCount:
          type: integer

    CourseSummary:
      type: object
      required: [id, title, dayCount, status, origin, placeCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 비어 있지 않다. 사용자가 안 적었으면 서버가 채운 값이다.
        dayCount:
          type: integer
          description: 며칠짜리인가. 편집에서 보낸 `days` 배열의 길이가 그대로 여기 온다.
        startDate:
          type: string
          format: date
          nullable: true
          description: |
            떠나는 날. 정하지 않았으면 없다. 돌아오는 날은 주지 않는다 —
            `startDate + dayCount - 1` 로 나오는 파생값이다.
        status:
          $ref: "#/components/schemas/CourseStatus"
        currentDayNo:
          type: integer
          nullable: true
          description: 여행 중일 때 지금 몇 일차인지. 예정 코스에는 없다.
        origin:
          $ref: "#/components/schemas/CourseOrigin"
        pace:
          $ref: "#/components/schemas/CoursePace"
        sourceMarketCourseId:
          type: integer
          format: int64
          nullable: true
          description: 마켓에서 담아 왔다면 그 원본. 「담아 온 코스」 표시에 쓴다.
        placeCount:
          type: integer
          description: 모든 일차의 장소 수 합계. 목록 카드의 "장소 7곳" 이다.
        thumbnailUrl:
          type: string
          nullable: true
          format: uri
          description: 첫 번째 장소의 대표 이미지. 장소가 하나도 없으면 비어 있다.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: "#/components/schemas/CourseSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              description: |
                1일차부터 순서대로. **빈 일차도 빠지지 않는다** — 배열 길이가 곧
                기간이다.
              items:
                $ref: "#/components/schemas/CourseDay"

    CourseDay:
      type: object
      required: [dayNumber, items, dwellMinutes, travelMinutes, totalMinutes, travelBasis]
      properties:
        dayNumber:
          type: integer
          minimum: 1
          description: |
            1 부터. **날짜가 아니다** — 떠나는 날이 없어도 일차는 있다. 배열 순서와 같다.
        items:
          type: array
          description: 갈 순서대로. 프론트는 받은 순서를 그대로 그리면 된다.
          items:
            $ref: "#/components/schemas/CourseItem"
        dwellMinutes:
          type: integer
          description: 이 날 머무는 시간의 합
        travelMinutes:
          type: integer
          description: |
            이 날 이동에 드는 시간의 합. **일차 합계로만 준다** — 구간별 소요 시간은
            여행 전에 보여 주지 않기로 했으므로 `CourseItem` 에 그 필드가 아예 없다.
        totalMinutes:
          type: integer
          description: |
            `dwellMinutes + travelMinutes`. **시작 시각을 받지 않으므로 도착·출발 시각은
            없다.** 화면은 "약 6시간 20분" 처럼 길이만 보여 준다.
        travelBasis:
          $ref: "#/components/schemas/TravelBasis"

    CourseItem:
      type: object
      required: [id, source, name, latitude, longitude, dwellMinutes]
      properties:
        id:
          type: integer
          format: int64
          description: |
            **편집 완료(`PUT`)에서 이 값을 그대로 돌려보내야 한다.** 빠뜨리면 서버가
            새 장소로 보아 방문 체크가 날아간다.
        source:
          $ref: "#/components/schemas/CourseItemSource"
        placeId:
          type: integer
          format: int64
          nullable: true
          description: |
            등록된 촬영지일 때만 있다. 직접 찍은 핀에는 없다 — 그 핀은 `place` 에 들어가지
            않아 촬영지 상세로 갈 수 없다.
        customPinId:
          type: integer
          format: int64
          nullable: true
          description: |
            직접 찍은 핀일 때만 있다. **편집에서 이 값을 쓸 일은 없다** — 자리를 가리키는
            것은 아이템의 `id` 이고, 핀은 그 자리 전용이라 함께 따라간다. 같은 숙소를 두
            자리에 넣었다면 이 값이 서로 다르다.
        name:
          type: string
        address:
          type: string
          nullable: true
          description: 등록된 촬영지만 있다. 직접 찍은 핀은 주소를 받지 않는다.
        category:
          type: string
          nullable: true
          description: |
            등록된 촬영지는 수집된 유형 문자열, 직접 찍은 핀은 `PinCategory` 값이다.
            둘의 값 범위가 다르므로 하나로 묶어 필터에 쓰지 않는다.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        dwellMinutes:
          type: integer
          minimum: 15
          maximum: 180
          description: 머무는 시간(분). 15분 ~ 3시간이 목업 슬라이더의 범위다.
        distanceMetersFromPrevious:
          type: integer
          nullable: true
          description: |
            앞 장소에서 여기까지의 **직선거리**다. 첫 번째 장소에는 없다.

            실제 도로 거리가 아니고, 여기에 대응하는 소요 시간 필드도 없다 — 여행 전에는
            "몇 분" 을 보여 주지 않는다. 직접 찍은 핀도 이 계산에 들어간다(숙소가 하루의
            시작과 끝이라 빼면 합계가 크게 어긋난다).
        sourceContentId:
          type: integer
          format: int64
          nullable: true
          description: |
            어떤 작품 때문에 담았는지. 장바구니에서 넘어올 때 따라온다.

            같은 N서울타워가 이태원 클라쓰의 것인지 눈물의 여왕의 것인지 구별하는 값이라,
            화면에 작품 배지를 띄울 때 이것을 쓴다.
        sourceContentTitle:
          type: string
          nullable: true
        visitedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            여행 중 방문 체크를 누른 시각. 없으면 아직 안 갔다는 뜻이다.

            **편집 완료에서 `id` 를 빠뜨리면 이 값이 사라진다.**

    CourseReplace:
      type: object
      required: [title, days]
      description: |
        편집 화면의 최종 모습. **보낸 것이 코스의 전부이고, 빠진 것은 지운 것이다.**
      properties:
        title:
          type: string
          maxLength: 50
          description: 비우면 서버가 「이름 없는 코스」로 채운다.
        startDate:
          type: string
          format: date
          description: 떠나는 날. **빼면 지운다.**
        days:
          type: array
          minItems: 1
          maxItems: 15
          description: |
            1일차부터 순서대로. **배열 길이가 곧 기간이다** — 5일 코스에 3개를 보내면
            3일 코스가 되고 4·5일차의 장소는 삭제된다.

            빈 일차는 `items` 가 빈 배열인 항목으로 표현한다. 일차는 큐라서 뒤에서만
            늘고 준다 — 가운데를 빼는 조작은 없다.
          items:
            $ref: "#/components/schemas/CourseDayInput"

    CourseDayInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            갈 순서대로. **배열 순서가 곧 방문 순서다** — 드래그 결과를 따로 보내는
            요청이 없는 이유가 이것이다.
          items:
            $ref: "#/components/schemas/CourseItemInput"

    CourseItemInput:
      type: object
      description: |
        `placeId` 와 `customPin` 중 **정확히 하나**를 보낸다. 둘 다이거나 둘 다 없으면
        `400` 이다. OpenAPI 로는 이 조건을 표현할 방법이 마땅치 않아 서버가 검사한다.
      properties:
        id:
          type: integer
          format: int64
          description: |
            **원래 있던 장소면 조회에서 받은 `id` 를 그대로 넣는다.** 그래야 방문
            체크(`visitedAt`)가 보존된다. 새로 담은 장소는 이 값을 비운다.
        placeId:
          type: integer
          format: int64
          description: |
            등록된 촬영지. 장바구니에서 꺼내든 검색으로 찾든 같은 값이다.
        customPin:
          $ref: "#/components/schemas/CustomPinInput"
        dwellMinutes:
          type: integer
          minimum: 15
          maximum: 180
          description: |
            머무는 시간(분).

            **비우면 서버가 장소 유형에 맞는 기본값을 채운다** — 고궁 90, 카페 40,
            다리 15 처럼 다르고 모르는 유형은 60 이다. 프론트가 그 표를 들고 있을 필요가
            없다. 값이 필요하면 담은 뒤 응답의 `CourseItem.dwellMinutes` 를 보면 된다.

            사용자가 슬라이더를 만졌으면 그 값을 보낸다. 이미 담긴 장소를 옮기기만 할
            때도 지금 값을 그대로 실어 보내는 편이 안전하다 — 비우면 기본값으로
            되돌아간다.
        sourceContentId:
          type: integer
          format: int64
          description: |
            어떤 작품 때문에 담았는지. 장바구니에서 넘어올 때 그 값을 그대로 옮긴다.

    CustomPinInput:
      type: object
      required: [name, category, latitude, longitude]
      description: |
        등록되지 않은 곳을 지도에 직접 찍은 핀. 주로 숙소다. 이름·분류·위경도만 받는다 —
        주소도 작품도 없다.

        **핀은 담은 자리마다 따로 만들어진다.** 2박 3일 숙소를 1일차 끝과 2일차 끝에
        넣으면 핀이 둘 생긴다. 하나를 여러 자리가 나눠 쓰게 하면 프론트가 핀에 이름표를
        붙여 관리해야 하는데, 그 복잡함에 비해 얻는 것이 없다고 봤다 — 사용자 눈에는
        어느 쪽이든 같은 화면이다.

        그 대신 **숙소 이름이나 위치를 고치면 담은 자리마다 각각 보내야 한다.** 프론트가
        한 곳에서 고쳤다면 그 값을 해당 자리 전부에 채워 보낸다.

        `id` 가 있는 아이템에 이 값을 함께 보내면 그 자리의 핀을 갱신한다. 아이템이
        요청에서 빠지면 그 핀도 함께 지워진다 — 핀이 그 자리 전용이라 남길 이유가 없다.

        **이 핀은 그 코스 안에서만 존재한다.** 검색·지도 결과에 나타나지 않고 다른
        코스로 가져갈 수도 없다. 마켓에 올릴 때도 빠진다.
      properties:
        name:
          type: string
          maxLength: 50
        category:
          $ref: "#/components/schemas/PinCategory"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    CourseProgress:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/CourseStatus"
        currentDayNo:
          type: integer
          minimum: 1
          description: |
            지금 몇 일차인지. `active` 로 바꿀 때 함께 보낸다. `upcoming` 으로 되돌릴
            때는 보내지 않는다 — 예정 코스에는 뜻이 없는 값이다.

    VisitUpdate:
      type: object
      required: [visited]
      properties:
        visited:
          type: boolean
          description: 체크했으면 `true`, 되돌리면 `false`. 시각은 서버가 찍는다.

    # ───────────── 작품 찜 ─────────────

    FavoriteContentCreate:
      type: object
      required: [contentId]
      properties:
        contentId:
          type: integer
          format: int64

    # ───────────── 코스마켓 ─────────────

    MarketSort:
      type: string
      enum: [saves, likes]
      default: saves
      description: 담기순(`saves`) / 좋아요순(`likes`). 동점이면 최근에 올라온 것이 앞선다.

    MarketCourseCreate:
      type: object
      required: [courseId, description]
      properties:
        courseId:
          type: integer
          format: int64
          description: 올릴 내 코스. **이 시점의 모습이 사본으로 떠진다.**
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: 이 코스가 어떤 코스인지. 목업 기준 200자다.

    MarketCourseList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketCourseSummary"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    MarketCourseSummary:
      type: object
      required:
        [id, title, description, dayCount, placeCount, likeCount, saveCount, liked, saved, mine, publishedAt]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: 올릴 때의 코스 이름. 사본이라 원본을 고쳐도 바뀌지 않는다.
        description:
          type: string
        dayCount:
          type: integer
        placeCount:
          type: integer
          description: 직접 찍은 핀을 뺀 수다. 원본보다 적을 수 있다.
        contents:
          type: array
          description: |
            이 코스의 작품 태그. 카드의 작품 배지이자 `q` 검색이 보는 대상이다.

            올릴 때 값으로 굳힌다 — 나중에 장소-작품 연결이 늘어도 올릴 때의 태그가
            유지된다.
          items:
            $ref: "#/components/schemas/ContentRef"
        thumbnailUrl:
          type: string
          nullable: true
          format: uri
        likeCount:
          type: integer
        saveCount:
          type: integer
        liked:
          type: boolean
          description: 내가 좋아요를 눌렀는가. 하트를 채울지 정한다. 비회원은 언제나 `false`.
        saved:
          type: boolean
          description: 내가 이미 담아 갔는가. 「담김」 표시에 쓴다.
        mine:
          type: boolean
          description: 내가 올렸는가. 「내리기」 버튼을 보일지 정한다.
        publishedAt:
          type: string
          format: date-time

    MarketCourseDetail:
      allOf:
        - $ref: "#/components/schemas/MarketCourseSummary"
        - type: object
          required: [days]
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/MarketDay"

    MarketDay:
      type: object
      required: [dayNumber, items, dwellMinutes, travelMinutes, totalMinutes, travelBasis]
      description: |
        `CourseDay` 와 모양이 닮았지만 별개 스키마다. 이쪽은 **올린 시점의 사본**이라
        장소에 코스 아이템 id 도 방문 체크도 없다.

        직접 찍은 핀이 빠지므로 **`items` 가 빈 일차가 있을 수 있다.** 숙소만 넣어 둔
        마지막 날이 그렇다. 그래도 기간은 그대로 유지된다.
      properties:
        dayNumber:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketItem"
        dwellMinutes:
          type: integer
        travelMinutes:
          type: integer
        totalMinutes:
          type: integer
        travelBasis:
          $ref: "#/components/schemas/TravelBasis"

    MarketItem:
      type: object
      required: [placeId, name, latitude, longitude, dwellMinutes]
      properties:
        placeId:
          type: integer
          format: int64
          description: |
            언제나 등록된 촬영지다 — 직접 찍은 핀은 올릴 때 빠진다.

            장소 정보 자체는 사본으로 굳히지 않고 계속 참조한다. 이름이나 주소가 나중에
            고쳐지면 마켓에서도 고쳐진 값이 보이는 편이 맞다. 사본이어야 하는 것은 장소가
            아니라 **순서와 머무는 시간**이다.
        name:
          type: string
        address:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        imageUrl:
          type: string
          nullable: true
          format: uri
        dwellMinutes:
          type: integer
        distanceMetersFromPrevious:
          type: integer
          nullable: true
        sourceContentId:
          type: integer
          format: int64
          nullable: true
          description: |
            함께 복사한다. 없으면 담아 간 코스가 장소마다 「어느 작품 때문에 담겼는지」를
            잃는다 — 작품 태그는 코스 단위라 거기까지 말하지 못한다.
        sourceContentTitle:
          type: string
          nullable: true

    # ───────────── 길찾기 (미구현) ─────────────

    NextLegRequest:
      type: object
      required: [courseId, itemId, latitude, longitude]
      description: |
        **미구현.** 모양은 T맵 응답을 확인하며 바뀔 수 있다.
      properties:
        courseId:
          type: integer
          format: int64
          description: 여행 중(`active`)인 코스여야 한다.
        itemId:
          type: integer
          format: int64
          description: |
            다음 목적지. 계획 순서와 달라도 된다 — 사용자는 계획대로만 움직이지 않는다.
        latitude:
          type: number
          format: double
          description: 지금 사용자의 위치
        longitude:
          type: number
          format: double

    NextLeg:
      type: object
      required: [distanceMeters, durationMinutes, geometry]
      description: |
        **미구현.** 여행 중에만 나오는 실제 경로다.
      properties:
        distanceMeters:
          type: integer
          description: 실제 도로 거리. 계획 단계의 직선거리와 다르다.
        durationMinutes:
          type: integer
          description: 예상 소요 시간. **여행 중에만 존재하는 값이다.**
        geometry:
          $ref: "#/components/schemas/LineString"

    LineString:
      type: object
      required: [type, coordinates]
      description: |
        GeoJSON(RFC 7946)의 `LineString`. 지도 라이브러리에 그대로 넣어 폴리라인으로
        그린다.

        자유 형식 객체(`type: object` 만)로 두지 않은 이유는 Swift 생성기가 그것을
        `AnyCodable` 로 만들고, 그 타입이 별도 의존성이라 클라이언트 빌드가 깨지기
        때문이다. 형태를 적어 두면 생성기가 제대로 된 타입을 만든다.
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          description: |
            **좌표 순서가 `[경도, 위도]` 다.** 국내 API 는 대부분 `위도, 경도` 순으로
            주므로 뒤집기 쉽고, 뒤집으면 좌표가 아프리카 앞바다로 간다.
          items:
            type: array
            items:
              type: number
              format: double
