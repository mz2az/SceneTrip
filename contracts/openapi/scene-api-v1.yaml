openapi: 3.0.3

# scene-api 의 REST 계약. 이 파일이 정본이고 핸들러가 여기를 따라간다.
#
# 규칙 (contracts/README.md · contracts/openapi/README.md):
#   - 손으로 쓴다. 구현에서 역생성하지 않는다.
#   - iOS·Android 클라이언트는 이 파일로부터 생성된다. 앱이 직접 쓰지 않는다.
#   - 파괴적 변경은 메이저 버전을 올리고 새 파일로 낸다 — 제자리 수정 금지.
#
# 설계 배경과 v1 에서 뺀 필드의 목록: docs/project/plans/scene-api-search-map.md

info:
  title: scene-api
  version: 1.2.0
  description: |
    SceneTrip 앱 **작품검색 탭**과 **경로여정 탭**을 받치는 API. 작품·촬영지·인물을
    검색하고, 지도 뷰포트 안의 촬영지를 조회하고, 방문할 장소를 장바구니에 담고,
    담은 장소로 며칠짜리 코스를 짜서 남과 나눈다.

    ## 언어

    사람이 읽는 모든 문자열(작품 제목, 장소명, 주소, 장면 설명)은
    `Accept-Language` 헤더를 따른다. 해당 언어의 번역이 없으면 `ko` 로 폴백하고,
    실제로 무엇을 골랐는지 `Content-Language` 응답 헤더로 알린다.

    ## 검색 범위

    **통합검색이다.** 사용자는 검색 전에 탭을 고르지 않는다. 검색어에 걸린 것과
    이어진 것을 **작품과 장소 양쪽으로 모두** 돌려주고, 탭은 그것을 종류별로 나눠
    보여 줄 뿐이다.

    훑는 곳은 여섯이고, 두 엔드포인트가 **같은 텍스트 뭉치**를 본다.

    | 훑는 곳 | 어떻게 |
    | --- | --- |
    | 장소명 · 장소 별칭 | `search_term` |
    | 장소 설명 | 원문 부분 일치 |
    | 작품 제목 · 작품 별칭 | `search_term` |
    | 작품 설명 | 원문 부분 일치 |
    | 인물 이름 (배우·감독) | `search_term` |
    | **장면 설명** (작품 × 장소) | 원문 부분 일치 |

    **장면 설명은 작품 하나와 장소 하나의 조합에 붙는다.** "2화에서 지은탁이 등장하는
    버스정류장" 처럼 *어느 작품의 어느 장면이 여기서 찍혔는가* 를 적은 문장이라,
    작품에도 장소에도 속하지 않고 그 둘을 잇는 자리에 있다. 그래서 여기에 걸리면
    **작품 탭과 장소 탭이 함께 채워진다.**

    걸린 것은 `place_content` 와 `content_cast` 를 타고 **양쪽으로 옮겨진다.**

    | 검색어 | 작품 탭 | 장소 탭 |
    | --- | --- | --- |
    | `도깨비` (작품명) | 도깨비 | 도깨비 촬영지 전부 |
    | `북촌한옥마을` (장소명) | 거기서 찍은 작품 전부 | 북촌한옥마을 |
    | `공유` (인물명) | 공유 출연작 | 그 출연작의 촬영지 전부 |
    | `한강` (장소 설명) | 그 장소의 촬영작 | 설명에 그 말이 든 장소 |
    | `버스정류장` (장면 설명) | 그 장면이 나온 작품 | 그 장면을 찍은 장소 |

    별칭이 있으므로 `Goblin` 으로도 `도깨비` 가 걸린다.

    **다리는 하나만 건넌다.** `도깨비` 로 그 촬영지들까지는 오지만, 그 촬영지에서
    찍은 *또 다른* 작품까지 딸려 오지는 않는다. 무한히 번지면 결과가 사실상 전체
    목록이 되어 검색이 뜻을 잃는다.

    **엔드포인트는 나뉘어 있다.** 탭마다 페이지네이션이 따로 필요해 하나로 합치지
    않았다 — 합친 목록에는 `limit`·`offset`·`total` 이 하나뿐이라 "장소만 더" 를
    표현할 수 없다. 프론트가 둘을 호출해 각 탭에 꽂는다.

    **자동완성(`/search/suggestions`)은 범위가 좁다.** 이름류(`search_term`)만 보고
    설명은 **셋 다** 보지 않는다 — 장소 설명도, 작품 설명도, 장면 설명도. 제안어로 쓸
    수 없는 긴 문장이 나오기 때문이다. 장면 설명은 실제로 값이 차 있어 넣고 싶어지는
    자리인데, 넣으면 제안 목록에 "2화에서 … 버스정류장입니다" 가 통째로 뜬다.

    **알려진 한계** — 수집된 장소명은 현재 한국어 표기뿐이라, 영어로 입력하면
    작품만 걸리고 장소는 걸리지 않는다. 장소 영문명 확보는 별도 작업이다.

    ## 인증

    v1 에는 로그인이 없다. 그렇다고 저장의 주체가 설치본인 것은 아니다 —
    **주체는 계정이고, `X-Device-Id` 는 그 계정을 찾는 열쇠일 뿐이다.**

    앱은 최초 실행 때 만들어 보관하는 **설치 UUID** 를 이 헤더로 보낸다. 서버는
    처음 보는 값이면 비회원 계정을 하나 만들어 짝지어 두고, 그 뒤로는 같은 계정을
    찾아 준다. 장바구니·코스·찜·마켓이 전부 그 계정을 주체로 저장된다.

    **앱이 할 일은 지금과 같다.** 보내는 헤더도 값도 바뀌지 않는다 — 설치 UUID 를
    계정으로 바꾸는 일은 서버 안에서만 일어난다. 이 문단 때문에 프론트가 고칠
    것은 없다.

    이렇게 한 몫은 로그인이 붙을 때 드러난다. 계정 행이 이미 있으므로 가입은 그
    행에 표시를 남기는 일이 되고, 담아 둔 장소와 만들어 둔 코스는 한 줄도 옮기지
    않은 채 그대로 이어진다.

    남의 것은 보이지 않는다. 마켓에 올라온 코스만 예외로 모두에게 공개된다.

    ## 코스의 시간 모델

    **시작 시각을 받지 않는다.** 따라서 장소별 도착·출발 시각을 계산하지 않고,
    그런 필드도 없다. 하루가 얼마나 걸리는지만 낸다.

    ```
    하루 소요 시간 = Σ 머무는 시간 + Σ 이동시간
    ```

    **떠나는 날도 필수가 아니다.** 코스를 만들 때는 며칠짜리인지만 받고, 날짜는
    나중에 붙이거나 비워 둘 수 있다.

    **여행 전과 여행 중이 다르다.**

    | | 계획 단계 (`status: upcoming`) | 여행 중 (`status: active`) |
    | --- | --- | --- |
    | 구간 표시 | 직선거리(m)만 | 실제 경로 |
    | 구간 소요 시간 | **주지 않는다** | 준다 |
    | 길찾기 API | 부르지 않는다 | 종량제로 한 구간씩 |

    그래서 `CourseItem` 에는 `distanceMetersFromPrevious` 만 있고 구간 소요 시간
    필드가 없다. 일차 단위의 `travelMinutes` 는 하루 합계를 설명하기 위한 값이고
    직선거리에서 나온 추정이다 — `CourseDay.travelBasis` 가 그 근거를 밝힌다.

    ## 수정은 PUT 전체 교체다

    코스와 아이템을 고칠 때 PATCH 를 쓰지 않는다. "떠나는 날을 지운다" 를 PATCH 로
    표현하려면 *필드가 없음*(안 고침)과 *값이 null*(지움)을 구분해야 하는데, 그 구분은
    생성기 설정과 의존성을 하나 더 부른다. PUT 은 구분 자체를 없앤다 — **보낸 것이
    전부이고 빠진 것은 지운 것이다.**

    ## 정렬과 상위 N

    목록의 기본 정렬은 **인기도 내림차순**이다. 지도 전체를 훑으면 핀이 수천 개가
    되므로 `limit` 이 상한이고, 잘린 경우 `total` 이 `items` 길이보다 크게 나온다.
    프론트는 이 차이로 "더 있음" 을 판단한다.

    **v1 의 인기도는 임시로 고정한 값이다.** 사용자 행동(조회·검색·저장) 기반의
    실제 계산은 로그가 쌓인 뒤에 붙인다. 그래서 점수 자체는 응답에 넣지 않는다 —
    지금 값에는 의미가 없고, 프론트가 쓸 것은 점수가 아니라 **정렬된 순서**다.
    나중에 계산 방식이 바뀌어도 이 계약은 그대로다.
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8080/v1
    description: 로컬 개발

tags:
  - name: search
    description: 통합 검색과 자동완성
  - name: contents
    description: 작품 조회
  - name: places
    description: 촬영지 조회 — 목록·지도·상세
  - name: pois
    description: 편의시설(POI) — 음식·숙박·명소·교통. 촬영지와 별개의 표
  - name: cart
    description: 장바구니 — 담긴 장소. 코스에 넣는 것은 `courses` 쪽이다
  - name: courses
    description: 코스 — 만들기·고치기, 일차와 그 안의 장소
  - name: favorites
    description: 작품 찜 — 장소 장바구니와 별개다
  - name: market
    description: 코스 공유 — 올리기·담기·내리기
  - name: navigation
    description: 길찾기 — 여행 중에만. 아직 구현되지 않았다
  - name: guide
    description: 여행 가이드 챗봇 — 앱은 화면 상태를 보내고, LLM 호출과 도구 실행은 서버가 한다 (ADR 0012)

paths:
  /search/suggestions:
    get:
      tags: [search]
      operationId: suggest
      summary: 자동완성 제안
      description: |
        입력 중인 문자열에 대해 장소·작품·인물 제안을 인기도 순으로 돌려준다.
        앞글자 일치를 우선하고 부분 일치가 뒤따른다.

        **이름과 별칭만 본다. 설명·줄거리는 보지 않는다.** 목록 검색
        (`GET /contents`·`GET /places`)과 범위가 다른 점에 주의한다. 자동완성은
        한 줄짜리 제안이라 "줄거리 어딘가에 그 낱말이 있다" 를 보여 줄 방법이
        없고, 이름용 정규화(`term_norm`)는 문장에 맞지 않는다.

        각 항목이 `type` 과 `id` 를 들고 있으므로 프론트는 눌린 항목이 어디로
        가는지 추가 조회 없이 안다 — `place` 는 장소 상세, `content` 는 작품 상세,
        `person` 은 그 인물의 작품 목록(`GET /contents?personId=`).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          required: true
          description: 입력 중인 검색어. 앞뒤 공백은 서버가 제거한다.
          schema:
            type: string
            minLength: 1
            maxLength: 100
          example: gob
        - name: limit
          in: query
          description: 제안 개수 상한
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: 제안 목록. 걸린 것이 없으면 빈 배열이다.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents:
    get:
      tags: [contents]
      operationId: listContents
      summary: 작품 목록·검색
      description: |
        목업의 **작품 탭** 목록. `q` 가 없으면 인기도 상위 작품을 돌려준다.

        `q` 는 이 작품에 딸린 **모든 텍스트**에 걸린다.

        | 걸리는 곳 | 예 |
        | --- | --- |
        | 작품 제목 · 작품 별칭 | `도깨비` · `Goblin` |
        | 작품 설명 | `재벌` → 설명에 그 말이 든 작품 |
        | 인물 이름 (배우·감독) | `공유` → 공유 출연작 |
        | 이 작품이 성지로 가진 장소의 이름 · 별칭 | `북촌한옥마을` → 거기서 찍은 작품들 |
        | 이 작품이 성지로 가진 장소의 설명 | `한강` → 설명에 그 말이 든 장소의 촬영작 |

        마지막 두 줄이 `GET /places?q=` 와 **대칭**을 이룬다. 그쪽은 걸린 것과 이어진
        장소를 모으고, 이쪽은 이어진 작품을 모은다. 사용자는 검색 전에 탭을 고르지
        않으므로 검색어 하나가 두 탭을 모두 채워야 한다.

        **장면 설명은 보지 않는다.** 장면은 장소와 작품 사이에 붙은 값이라
        어느 한쪽의 검색 대상으로 삼으면 경계가 흐려진다.

        결과는 합쳐서 중복을 제거하고 **인기도 내림차순**으로 정렬한다. 같은
        작품이 제목과 배우 양쪽에 걸려도 한 번만 나온다.

        설명까지 뒤지므로 흔한 낱말은 결과가 많다. 정렬이 인기도순이고
        `limit`·`offset` 이 있으므로, 프론트는 위에서부터 필요한 만큼만 받아
        무한 스크롤로 이어 붙인다. `total` 로 남은 양을 안다.

        `personId` 는 인물을 **정확히 지목**할 때 쓴다 — 자동완성에서 인물
        제안을 누른 경우다. 동명이인이 있어도 어긋나지 않는다는 점이 `q` 와
        다르다. 둘을 함께 주면 교집합이다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          description: 작품 제목·별칭·설명·인물 이름·촬영지 이름·별칭·설명·장면 설명을 함께 검색
          schema:
            type: string
            maxLength: 100
          example: 공유
        - name: personId
          in: query
          description: 이 인물이 참여한 작품만
          schema:
            type: integer
            format: int64
        - name: category
          in: query
          description: 작품 분류
          schema:
            $ref: "#/components/schemas/ContentCategory"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 인기도 내림차순 작품 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents/{contentId}:
    get:
      tags: [contents]
      operationId: getContent
      summary: 작품 상세
      description: |
        목업의 **작품 상세** 화면. 줄거리·출연진·별칭까지 포함한다.
        촬영지 목록은 별도 조회다 — `GET /contents/{contentId}/places`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: 작품 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /contents/{contentId}/places:
    get:
      tags: [contents, places]
      operationId: listContentPlaces
      summary: 한 작품의 촬영지 목록
      description: |
        작품 상세 화면의 **촬영 장소 리스트**이자, 지도에 찍을 핀의 원본이다.

        목업은 각 행에 번호를 매겨 촬영 순서처럼 보여 주지만, 수집 데이터에
        촬영 순서가 없다. 응답은 인기도 내림차순이고 번호는 프론트가 배열
        순서대로 매긴다.

        `lat`·`lng` 를 함께 주면 각 항목의 `distanceMeters` 가 채워진다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/ContentId"
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 이 작품의 촬영지 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /places:
    get:
      tags: [places]
      operationId: listPlaces
      summary: 촬영지 목록·검색·지도 조회
      description: |
        하나의 엔드포인트가 목업의 세 가지 상황을 모두 담당한다.

        | 상황 | 파라미터 |
        | --- | --- |
        | 장소 탭 검색 | `q` |
        | 지도 뷰포트 안의 핀 · 「현 지도 내 성지 검색」 | `bbox` |
        | 한 점을 중심으로 한 반경 (「이어서 걷기 좋은 곳」) | `lat` + `lng` + `radiusMeters` |

        **`bbox` 와 `radiusMeters` 는 함께 쓸 수 없다.** 둘 다 오면 400 이다.
        화면은 네모지 원이 아니므로 「이 화면 안」을 묻는 동작에는 `bbox` 를 쓴다 —
        앱의 「현 지도 내 성지 검색」이 그렇게 부른다.
        영역 조건이 하나도 없으면 전국을 대상으로 인기도 상위를 돌려준다.

        `sort=distance` 는 기준점이 있을 때만 유효하다 — `lat`·`lng` 없이 주면 400.

        `q` 는 이 장소에 딸린 **모든 텍스트**에 걸린다.

        | 걸리는 곳 | 예 |
        | --- | --- |
        | 장소명 · 장소 별칭 | `여의도공원` |
        | 장소 설명 | `한강` → 설명에 그 말이 든 장소 |
        | 이 장소에서 촬영된 작품의 제목·별칭 | `도깨비` → 도깨비 촬영지 전부 |
        | 이 장소에서 촬영된 작품의 설명 | `재벌` → 그런 작품이 촬영된 장소들 |
        | 그 작품에 참여한 인물의 이름 | `공유` → 공유 출연작의 촬영지 전부 |

        `GET /contents?q=` 와 **같은 텍스트 뭉치**를 본다. 다른 것은 결과를 작품으로
        내느냐 장소로 내느냐뿐이다. 검색어 하나로 두 탭이 함께 채워지고, 사용자는
        탭을 먼저 고르지 않는다.

        작품을 **정확히 지목**하려면 `contentId` 를 쓴다 — 작품 탭에서 작품을 눌렀을
        때다. `GET /contents/{contentId}/places` 도 같은 것을 준다.

        **장면 설명은 보지 않는다.** 장면은 장소와 작품 사이에 붙은 값이라
        어느 한쪽의 검색 대상으로 삼으면 경계가 흐려진다.

        결과는 중복을 제거하고 **인기도 내림차순**으로 정렬한다. 흔한 낱말은
        결과가 많으므로 `limit`·`offset` 으로 나눠 받는다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: q
          in: query
          description: 장소명·별칭·장소 설명·등장 작품의 제목·별칭·설명·출연진 이름·장면 설명을 함께 검색
          schema:
            type: string
            maxLength: 100
          example: 감자탕
        - name: contentId
          in: query
          description: 이 작품에 등장한 장소만
          schema:
            type: integer
            format: int64
        - name: bbox
          in: query
          description: |
            지도 뷰포트. `minLng,minLat,maxLng,maxLat` 순서의 쉼표 구분 4개 —
            GeoJSON 과 같은 경도-위도 순서다.
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
          example: 126.9,37.5,127.1,37.6
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
        - name: radiusMeters
          in: query
          description: |
            기준점으로부터의 반경. 지금 이것을 쓰는 곳은 촬영지 상세의
            "이어서 걷기 좋은 곳" 하나다 (`GET /places/{placeId}` 설명 참고).
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: sort
          in: query
          description: 정렬 기준
          schema:
            type: string
            enum: [popularity, distance]
            default: popularity
        - name: limit
          in: query
          description: |
            돌려줄 개수 상한. 지도용이라 목록 기본값보다 크다.
            `total` 이 이 값보다 크면 인기도 상위만 잘려 나온 것이다.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 조건에 맞는 촬영지 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /places/{placeId}:
    get:
      tags: [places]
      operationId: getPlace
      summary: 촬영지 상세
      description: |
        목업의 **촬영지 상세** 화면. 이 장소에서 촬영된 작품들과 각 장면 설명을
        함께 돌려준다.

        "이어서 걷기 좋은 곳" 은 별도 필드가 아니다. 이 장소의 좌표로
        `GET /places?lat=&lng=&radiusMeters=1000&limit=3` 을 부르면 된다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: placeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
      responses:
        "200":
          description: 촬영지 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pois:
    get:
      tags: [pois]
      operationId: listPois
      summary: 편의시설 지도 조회
      description: |
        촬영지 곁의 **음식점·카페·숙박·관광명소·교통시설**. 촬영지(`/places`)와 다른 표를
        본다 — 성지 155 개와 POI 50 만 개를 한 목록에 섞으면 `limit`·`total` 이 하나뿐이라
        「성지만 더 보기」를 표현할 수 없다(`docs/project/plans/poi.md` §3-1). 앱이 둘을
        따로 불러 각 자리에 꽂는다.

        파라미터 모양은 `/places` 를 따른다. 다른 점만 적는다.

        | | `/places` | `/pois` |
        | --- | --- | --- |
        | 갈래 | 없음 | `categoryGroup` 으로 거른다 |
        | 정렬 | 인기도 · 거리 | **거리 · 이름순** — POI 에는 인기도가 없다 |
        | `limit` | 기본 20 · 최대 100 | 기본 30 · 최대 200 |
        | 이름 검색 `q` | 있음 | **아직 없음** (MZ2AZ-283) |

        지금 이것을 쓰는 곳은 경로 탭의 **주변 편의시설 핀**이다 — 지도 카메라가 멈추면
        앱이 뷰포트(`bbox`)와 화면 중심(`lat`·`lng`)을 보내고, 중심에 가까운 순으로 30 개를
        찍는다. 상한에 걸릴 때 화면 가운데부터 채우는 이유: 앞에서부터 자르면 자료에 먼저
        적힌 동네가 상한을 다 먹어 정작 보고 있는 자리가 빈다(프로토타입 실측 — 서울 전체를
        보면 여의도·잠실만 찍히고 종로가 텅 비었다).

        **`bbox` 와 `radiusMeters` 는 함께 쓸 수 없다.** 둘 다 오면 400.
        `sort=distance` 는 기준점이 있을 때만 유효하다 — `lat`·`lng` 없이 주면 400.
        영역 조건이 하나도 없으면 400 이다 — 50 만 건을 전국 대상으로 돌려줄 정렬 기준이 없다.

        `total` 이 `items` 길이보다 크면 잘린 것이다. 앱은 그것을 「더 확대하세요」의
        근거로 쓴다. 겹치는 핀을 솎는 규칙(격자당 하나)은 아직 없다 — 필요해지면 선택
        파라미터로 더한다.

        `Accept-Language` 를 받지만 **지금은 언제나 `ko` 로 응답한다.** 자료가 한국어뿐이다.
        다국어 표기가 생기면 계약은 그대로 두고 서버가 채운다.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: bbox
          in: query
          description: |
            지도 뷰포트. `minLng,minLat,maxLng,maxLat` 순서의 쉼표 구분 4개 —
            GeoJSON 과 같은 경도-위도 순서다. `/places` 와 같다.
          schema:
            type: string
            pattern: '^-?\d+(\.\d+)?(,-?\d+(\.\d+)?){3}$'
          example: 127.017,37.489,127.037,37.507
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
        - name: radiusMeters
          in: query
          description: 기준점으로부터의 반경. `lat`·`lng` 가 있어야 한다.
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: categoryGroup
          in: query
          description: 네 갈래 중 하나로 거른다. 없으면 전부.
          schema:
            $ref: "#/components/schemas/PoiCategoryGroup"
        - name: sort
          in: query
          description: |
            정렬. 기본은 기준점이 있으면 `distance`, 없으면 `alphabetical` 이다.
            인기도 정렬은 없다 — POI 에는 순위를 매길 근거가 없다.
            (`name` 이 아닌 이유: 코틀린 enum 의 내장 속성 이름과 겹쳐 생성이 깨진다.)
          schema:
            type: string
            enum: [distance, alphabetical]
        - name: limit
          in: query
          description: |
            돌려줄 개수 상한. 앱의 주변 핀이 30 을 보낸다. 200 위는 화면에 먼지처럼
            흩어질 뿐이라 잘라 낸다 — 그때는 앱이 확대를 유도한다.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 30
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: 조건에 맞는 편의시설 목록
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoiList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /pois/{poiId}:
    get:
      tags: [pois]
      operationId: getPoi
      summary: 편의시설 상세
      description: |
        핀을 눌렀을 때 바로 보여 줄 수 있는 것 — 우리 자료에 있는 이름·종류·주소·전화.
        사진·영업시간·평점은 여기 없다. 그것은 바깥 출처에서 오는 것이라 별도
        엔드포인트가 맡는다(예정).
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: poiId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/OriginLat"
        - $ref: "#/components/parameters/OriginLng"
      responses:
        "200":
          description: 편의시설 상세
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoiDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pois/{poiId}/card:
    get:
      tags: [pois]
      operationId: getPoiCard
      summary: 편의시설 카드 — 사진·영업시간·평점 (바깥 출처)
      description: |
        핀을 눌렀을 때 뜨는 카드. 우리 자료에 없는 것 — 사진·영업시간·별점·리뷰 수 — 을
        바깥 출처(네이버 장소)에서 가져온다. 서버가 그 출처에 한 번 물어 결과를 표에 두고,
        두 번째부터는 표에서 준다.

        **표에 없으면 지금 바로 묻는다** — 검색과 상세 두 호출, 약 0.35 초. 사용자가 「이거」
        하고 누른 한 곳이라 그만큼은 기다린다. 여럿을 한 번에 채우려면 `GET /pois/cards` 다.

        **못 찾아도 200 이다.** 「그 출처에 없다」도 답이다 — `found: false` 에 `why` 가 이유를
        말한다. 출처가 막혔거나 서버 설정으로 꺼져 있어도 200 이다. 카드가 뜨는 화면이 바깥
        사정으로 죽으면 안 된다. 404 는 `poiId` 자체가 없을 때뿐이다.

        이 정보의 출처와 한계는 ADR 0011 — 데모 한정이고 정식 출시 전에 대체한다.
      parameters:
        - name: poiId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 카드. `found` 가 결과다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoiCard"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /pois/cards:
    get:
      tags: [pois]
      operationId: listPoiCards
      summary: 편의시설 카드 여럿 — 있는 것은 주고, 없는 것은 뒤에서 채운다
      description: |
        목록 화면용. 보이는 행들의 `poiId` 를 한 번에 보내면 **표에 있는 것만** 카드로 주고,
        없는 것은 `pending: true` 로 표시한 뒤 서버가 뒤에서 채운다. **이 경로는 바깥 출처를
        부르지 않는다** — 응답은 언제나 몇 ms 다.

        | 항목 | 뜻 |
        | --- | --- |
        | `found: true` | 찾았고 상세가 있다 |
        | `found: false` | 물어봤는데 없었다. `why` 가 이유. 다시 묻지 않는다 |
        | `pending: true` | 아직 안 물어봤다. 줄에 넣었으니 잠시 뒤 다시 물으면 위 둘 중 하나가 된다 |

        `items` 는 **요청한 순서 그대로, 요청한 개수만큼**이다 — 목록 행과 1:1 로 붙인다.
        없는 `poiId` 도 404 가 아니라 그 자리에 `found: false` 로 온다. 상태 코드는 요청
        전체의 것이고, 하나가 없다고 나머지 29 개를 못 받게 하지 않는다.

        **앱의 규칙** — `pending` 이 하나라도 있으면 `retryAfterSeconds` 만큼 기다렸다가
        **`pending` 이었던 id 만** 다시 묻는다. 없어질 때까지, 최대 3 회. 그 뒤엔 사진 없이 둔다.
        `retryAfterSeconds` 는 서버의 줄 길이와 최근 처리 속도로 계산한 어림이다 — 틀리면 다음
        응답이 다시 계산해 준다. 1~30 사이다.
      parameters:
        - name: ids
          in: query
          required: true
          description: 쉼표로 이은 `poiId`. 1~50 개. 예 `ids=225568,448442,17121`
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 50
            items:
              type: integer
              format: int64
      responses:
        "200":
          description: 요청한 순서대로의 카드들
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoiCardBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

