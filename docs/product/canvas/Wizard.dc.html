<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #0088FF; } a:hover { color: #0069c9; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; background: #fff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 59px; flex-shrink: 0;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-shrink: 0;">
    <div style="font-size: 17px; color: #0088FF;">취소</div>
    <div style="font-size: 13px; color: rgba(60,60,67,.6);">1 / 4</div>
    <div style="width: 32px;"></div>
  </div>

  <!-- 진행 막대 -->
  <div style="height: 3px; background: #E5E5EA; flex-shrink: 0;">
    <div style="height: 100%; width: 25%; background: #0088FF;"></div>
  </div>

  <div style="padding: 26px 16px 0; flex-shrink: 0;">
    <div style="font-size: 20px; font-weight: 600; color: #000;">얼마나 다녀오나요?</div>
  </div>

  <!-- 기간 고르기 -->
  <div style="flex-grow: 1; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{spans}}" as="s" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; border-radius: 12px; background: {{s.bg}}; border: 1.5px solid {{s.border}};">
        <div style="font-size: 17px; font-weight: {{s.weight}}; color: {{s.tone}}; flex-grow: 1;">{{s.label}}</div>
        <sc-if value="{{s.on}}" hint-placeholder-val="{{true}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,13 10,18 19,7"/></svg>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 16px; flex-shrink: 0;">
    <div style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 12px; background: #0088FF; color: #fff; font-size: 17px; font-weight: 600;">다음</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const plain = { bg: '#F2F2F7', border: 'transparent', tone: '#000', weight: '400', on: false };
    const picked = { bg: 'rgba(0,136,255,.10)', border: '#0088FF', tone: '#0088FF', weight: '600', on: true };
    return {
      spans: [
        { label: '당일치기', ...plain },
        { label: '1박 2일', ...plain },
        { label: '2박 3일', ...plain },
        { label: '3박 4일', ...plain },
        { label: '4박 5일', ...picked },
        { label: '5박 6일', ...plain },
      ],
    };
  }
}
</script>
</body>
</html>
