<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }

    /* 핀이 지도에 꽂히듯 위에서 떨어진다. 착지에서 한 번 눌렸다 편다. */
    @keyframes drop {
      0%   { transform: translateY(-320px) scale(.86); opacity: 0; }
      55%  { transform: translateY(0) scale(1); opacity: 1; }
      66%  { transform: translateY(0) scaleX(1.09) scaleY(.91); }
      78%  { transform: translateY(-14px) scale(1); }
      88%  { transform: translateY(0) scaleX(1.03) scaleY(.97); }
      100% { transform: translateY(0) scale(1); }
    }
    /* 착지 순간 바닥에 그림자가 퍼진다. */
    @keyframes shade {
      0%, 45% { transform: scaleX(.2); opacity: 0; }
      58%     { transform: scaleX(1.15); opacity: .22; }
      100%    { transform: scaleX(1); opacity: .15; }
    }
    /* 착지 파문 — 한 번만 퍼지고 사라진다. */
    @keyframes ripple {
      0%, 52% { transform: scale(.3); opacity: 0; }
      60%     { opacity: .55; }
      100%    { transform: scale(2.4); opacity: 0; }
    }
    @keyframes ear   { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-7deg); } 96% { transform: rotate(3deg); } }
    @keyframes tail  { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(9deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
    @keyframes rise  { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes glow  { 0%,100% { opacity: .30; transform: scale(1); } 50% { opacity: .48; transform: scale(1.07); } }

    .sp-cat    { animation: drop 1.5s cubic-bezier(.34,1.2,.64,1) both; transform-origin: 60px 148px; transform-box: view-box; }
    .sp-shade  { animation: shade 1.5s ease-out both; transform-origin: center; transform-box: fill-box; }
    .sp-ripple { animation: ripple 1.5s ease-out both; transform-origin: center; transform-box: fill-box; }
    .sp-earL   { animation: ear 5.5s ease-in-out 1.5s infinite; transform-origin: 34px 34px; transform-box: view-box; }
    .sp-earR   { animation: ear 5.5s ease-in-out 2.6s infinite; transform-origin: 86px 34px; transform-box: view-box; }
    .sp-tail   { animation: tail 2.4s ease-in-out 1.5s infinite; transform-origin: 80px 104px; transform-box: view-box; }
    .sp-eyes   { animation: blink 4.2s ease-in-out 1.6s infinite; transform-origin: center; transform-box: fill-box; }
    .sp-glow   { animation: glow 3.4s ease-in-out 1.5s infinite; transform-origin: center; transform-box: fill-box; }
    .sp-word   { animation: rise .7s ease-out 1.15s both; }
    .sp-sub    { animation: rise .7s ease-out 1.35s both; }
    .sp-dots   { animation: rise .7s ease-out 1.6s both; }
    @keyframes bounce3 { 0%,80%,100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }
    .sp-dots i { display: block; width: 6px; height: 6px; border-radius: 3px; background: #fff;
                 animation: bounce3 1.3s ease-in-out infinite; }
    .sp-dots i:nth-child(2) { animation-delay: .16s; }
    .sp-dots i:nth-child(3) { animation-delay: .32s; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; background: linear-gradient(168deg, #8FCCF7 0%, #7A68ED 62%, #5B4BC4 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; position: relative;">

  <!-- 바탕의 흐릿한 지도 격자. 여행앱이라는 걸 배경만으로 말한다. -->
  <svg width="402" height="874" viewBox="0 0 402 874" style="position: absolute; inset: 0; opacity: .13;">
    <g stroke="#fff" stroke-width="1" fill="none">
      <path d="M-20 210 C 90 190, 150 260, 250 240 S 400 300, 430 280"/>
      <path d="M-20 640 C 80 620, 170 690, 260 655 S 390 700, 430 670"/>
      <path d="M70 -20 C 90 140, 40 300, 96 450 S 60 720, 110 900"/>
      <path d="M300 -20 C 320 160, 268 320, 322 470 S 300 730, 340 900"/>
    </g>
    <g fill="#fff" opacity=".5">
      <circle cx="96" cy="450" r="3"/><circle cx="322" cy="470" r="3"/>
      <circle cx="250" cy="240" r="3"/><circle cx="110" cy="676" r="3"/>
    </g>
  </svg>

  <!-- 마스코트 -->
  <svg width="240" height="320" viewBox="0 0 120 160" style="overflow: visible; margin-bottom: 26px;">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#EAF5FE"/><stop offset="1" stop-color="#BFD9F6"/>
      </linearGradient>
      <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#DCEEFD"/><stop offset="1" stop-color="#B6D2F3"/>
      </linearGradient>
    </defs>

    <!-- 바닥 그림자와 착지 파문 -->
    <ellipse class="sp-shade" cx="60" cy="150" rx="30" ry="6.5" fill="#2A2060"/>
    <ellipse class="sp-ripple" cx="60" cy="150" rx="26" ry="6" fill="none" stroke="#fff" stroke-width="2"/>

    <g class="sp-cat">
      <!-- 뒤에서 도는 빛무리 -->
      <circle class="sp-glow" cx="60" cy="54" r="52" fill="#fff" opacity=".3"/>

      <!-- 꼬리. 물방울 오른쪽 아래에서 나와 위로 감긴다 -->
      <g class="sp-tail">
        <path d="M78 106 C 100 110, 112 92, 101 74" fill="none" stroke="url(#body)"
              stroke-width="10" stroke-linecap="round"/>
      </g>

      <!-- 귀. 몸통보다 먼저 그려 뒤로 보낸다 -->
      <g class="sp-earL">
        <path d="M25 39 L 28 2 L 54 18 Z" fill="url(#ear)" stroke="#fff" stroke-width="3"
              stroke-linejoin="round"/>
        <path d="M32 34 L 34 13 L 47 22 Z" fill="#F7A8C0"/>
      </g>
      <g class="sp-earR">
        <path d="M95 39 L 92 2 L 66 18 Z" fill="url(#ear)" stroke="#fff" stroke-width="3"
              stroke-linejoin="round"/>
        <path d="M88 34 L 86 13 L 73 22 Z" fill="#F7A8C0"/>
      </g>

      <!-- 몸통 = 지도 핀 그대로. PinImage.numbered 의 물방울(머리 r14 @ 19,17 → 꼬리 19,45)을 3배로 -->
      <path d="M30.3 83.7 A 42 42 0 1 1 89.7 83.7 L 60 141 Z"
            fill="url(#body)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>

      <!-- 얼굴 배지. 핀의 번호 배지와 같은 자리·같은 비율이다 -->
      <circle cx="60" cy="52" r="31" fill="#fff"/>

      <g class="sp-eyes" fill="#4A3FA8">
        <ellipse cx="49" cy="47" rx="4.2" ry="5.6"/>
        <ellipse cx="71" cy="47" rx="4.2" ry="5.6"/>
      </g>
      <circle cx="50.4" cy="45" r="1.5" fill="#fff"/>
      <circle cx="72.4" cy="45" r="1.5" fill="#fff"/>

      <path d="M56.6 57 L 63.4 57 L 60 61.2 Z" fill="#F0849F"/>
      <path d="M60 61.2 C 60 65, 56 66.5, 53.6 63.6 M60 61.2 C 60 65, 64 66.5, 66.4 63.6"
            fill="none" stroke="#4A3FA8" stroke-width="1.8" stroke-linecap="round"/>

      <g stroke="#B9B3E0" stroke-width="1.5" stroke-linecap="round">
        <path d="M42 53 L 33 51"/><path d="M42 57 L 33.5 58"/>
        <path d="M78 53 L 87 51"/><path d="M78 57 L 86.5 58"/>
      </g>

      <!-- 볼 -->
      <circle cx="43.5" cy="58" r="4" fill="#F7A8C0" opacity=".55"/>
      <circle cx="76.5" cy="58" r="4" fill="#F7A8C0" opacity=".55"/>
    </g>
  </svg>

  <!-- 워드마크 -->
  <div class="sp-word" style="font-size: 44px; font-weight: 800; color: #fff; letter-spacing: -1.2px; line-height: 1;">SceneTrip</div>
  <div class="sp-sub" style="margin-top: 12px; font-size: 15px; font-weight: 500; color: rgba(255,255,255,.82); letter-spacing: .2px;">Stand where the scene happened</div>

  <div class="sp-dots" style="position: absolute; bottom: 74px; display: flex; gap: 7px;">
    <i></i><i></i><i></i>
  </div>
</div>
</x-dc>
</body>
</html>
