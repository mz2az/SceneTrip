      </svg>
      <div style="position: relative;">

  <div style="padding: 0 32px; text-align: center; flex-shrink: 0;">
    <div style="font-size: 28px; font-weight: 700; color: #000; letter-spacing: -.5px; line-height: 1.25;">Where the scene<br>was filmed</div>
    <div style="margin-top: 12px; font-size: 16px; color: rgba(60,60,67,.6); line-height: 1.5;">Search by drama, movie, or the scene itself.<br>Real locations, straight onto the map.</div>
    <div style="margin-top: 14px; font-size: 13px; color: rgba(60,60,67,.3); line-height: 1.45;">드라마 이름으로도, 장면 설명으로도 찾는다</div>

  <div style="display: flex; gap: 6px; justify-content: center; align-items: center; padding: 30px 0 22px; flex-shrink: 0;">
