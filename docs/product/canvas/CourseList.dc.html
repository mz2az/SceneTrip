<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
           -webkit-font-smoothing: antialiased; }
    a { color: #0088FF; } a:hover { color: #0069c9; }
  </style>
</helmet>
<div style="width: 402px; height: 874px; background: #F2F2F7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 59px; flex-shrink: 0;"></div>

  <div style="padding: 4px 14px 8px; flex-shrink: 0;">
    <div style="font-size: 34px; font-weight: 700; color: #000; letter-spacing: -0.4px;">코스</div>
  </div>

  <div style="padding: 8px 14px 12px; flex-shrink: 0;">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 9px; background: #EEEEEF;">
      <div style="padding: 6px 0; border-radius: 7px; background: #fff; text-align: center; font-size: 13px; font-weight: 600; color: #000; box-shadow: 0 1px 3px rgba(0,0,0,.12);">내 코스</div>
      <div style="padding: 6px 0; border-radius: 7px; text-align: center; font-size: 13px; color: rgba(60,60,67,.6);">코스마켓</div>
    </div>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 0 14px; display: flex; flex-direction: column; gap: 8px;">

    <div style="font-size: 13px; font-weight: 600; color: rgba(60,60,67,.6); padding: 4px 4px 0;">여행 중</div>
    <div style="background: #fff; border-radius: 12px; padding: 14px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="2"><path d="M12 3l1.6 4.2L18 8.8l-4.4 1.6L12 14.6l-1.6-4.2L6 8.8l4.4-1.6z"/></svg>
        <div style="font-size: 17px; font-weight: 600; color: #000; flex-grow: 1;">인기 촬영지 4박 5일</div>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(60,60,67,.3)" stroke-width="2.4"><polyline points="9,5 16,12 9,19"/></svg>
      </div>
      <div style="font-size: 12px; color: rgba(60,60,67,.6); margin-top: 6px;">8월 22일 – 8월 26일</div>
      <div style="font-size: 11px; color: rgba(60,60,67,.3); margin-top: 3px;">12곳 · 직선 231.4 km</div>
    </div>

    <div style="font-size: 13px; font-weight: 600; color: rgba(60,60,67,.6); padding: 8px 4px 0;">내 코스 3</div>
    <sc-for list="{{courses}}" as="c" hint-placeholder-count="2">
      <div style="background: #fff; border-radius: 12px; padding: 14px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <div style="font-size: 17px; font-weight: 600; color: #000; flex-grow: 1;">{{c.title}}</div>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(60,60,67,.3)" stroke-width="2.4"><polyline points="9,5 16,12 9,19"/></svg>
        </div>
        <div style="font-size: 12px; color: rgba(60,60,67,.6); margin-top: 6px;">{{c.when}}</div>
        <div style="font-size: 11px; color: rgba(60,60,67,.3); margin-top: 3px;">{{c.stat}}</div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; justify-content: center; gap: 7px; background: #fff; border-radius: 12px; padding: 15px; font-size: 17px; font-weight: 500; color: #0088FF; margin-top: 4px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0088FF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      코스 추가하기
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 0 22px; background: #fff; border-top: 0.5px solid rgba(60,60,67,.29); flex-shrink: 0; margin-top: 10px;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 10px; color: {{t.tone}};">{{t.label}}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const off = 'rgba(60,60,67,.6)';
    return {
      courses: [
        { title: '도깨비 촬영지 2박 3일', when: '날짜 미정 · 2박 3일', stat: '7곳 · 직선 88.2 km' },
        { title: '서울 하루', when: '9월 3일', stat: '4곳 · 직선 12.6 km' },
      ],
      tabs: [
        { label: '작품검색', tone: off },
        { label: '경로여정', tone: '#0088FF' },
        { label: '커뮤니티', tone: off },
        { label: '마이페이지', tone: off },
      ],
    };
  }
}
</script>
</body>
</html>
