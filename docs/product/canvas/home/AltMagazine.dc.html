<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    a { color: #007AFF; } a:hover { color: #0060CC; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #FAFAFC; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid #E4E4E8; box-sizing: border-box;">

  <div style="padding: 14px 20px 0 20px; font-size: 12px; font-weight: 700; color: #AEAEB2; letter-spacing: 0.5px;">대안 스케치 — 매거진형 (섹션 없이 큰 카드 한 줄 피드)</div>

  <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px 20px 0 20px;">
    <div style="height: 52px; border-radius: 14px; background: #ECECF1; display: flex; align-items: center; padding: 0 16px; font-size: 13px; color: #8A8A8E;">인사 + 검색 (얇게 한 줄)</div>
    <div style="height: 220px; border-radius: 20px; background: #DDD9F5; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; gap: 4px;">
      <div style="font-size: 12px; font-weight: 700; color: #5B49D6;">카드 1 — 전체 폭 히어로</div>
      <div style="font-size: 15px; font-weight: 700; color: #3A3A3C;">오늘의 성지를 사진 크게, 잡지 표지처럼</div>
    </div>
    <div style="height: 150px; border-radius: 20px; background: #D6E8F8; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; gap: 4px;">
      <div style="font-size: 12px; font-weight: 700; color: #2B6CB0;">카드 2</div>
      <div style="font-size: 14px; color: #3A3A3C;">내 여행 이어가기 (여행 중일 때만 끼어듦)</div>
    </div>
    <div style="height: 150px; border-radius: 20px; background: #ECECF1; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; gap: 4px;">
      <div style="font-size: 12px; font-weight: 700; color: #8A8A8E;">카드 3</div>
      <div style="font-size: 14px; color: #3A3A3C;">인기 코스 · 커뮤니티 글이 한 카드씩 섞여 내려옴</div>
    </div>
    <div style="height: 90px; border-radius: 20px; background: #ECECF1; opacity: 0.6;"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #FFFFFF; border-top: 1px solid #E4E4E8; display: flex; align-items: center; justify-content: space-around;">
    <div style="font-size: 12px; color: #8A8A8E;">작품검색</div>
    <div style="width: 52px; height: 52px; border-radius: 26px; background: #C9BFF5; margin-top: -22px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #FFFFFF; font-weight: 700;">홈</div>
    <div style="font-size: 12px; color: #8A8A8E;">커뮤니티</div>
  </div>
</div>
</x-dc>
</body>
</html>
