# scene-api 기본 설정.
#
# 환경마다 달라지는 값은 여기 두지 않는다 — platform/kubernetes/scene-api/configmap.yaml
# 이 환경변수로 덮어쓴다. 시크릿은 어느 쪽에도 두지 않는다 (AGENTS.md §9).

spring:
  application:
    name: scenetrip-scene-api

  threads:
    # 가상 스레드. 가이드 챗봇(POST /guide/*)이 **요청당 3~5 초를 기다리는 첫 경로**라 켠다.
    #
    # 플랫폼 스레드면 톰캣 스레드 200 개가 전부 에이전트 응답을 기다리는 동안 CPU 는 놀면서도
    # /places 같은 0.01 초 요청이 줄을 선다. 가상 스레드는 기다리는 동안 캐리어를 놓아 주므로
    # 그 병목이 사라진다 — 자바 21 · Boot 4.1 이라 이 한 줄이면 된다(ADR 0013, 계획 §2-4).
    #
    # 병목이 없어지는 것이 아니라 **DB 커넥션 풀(HikariCP 기본 10)로 옮겨 간다.** 동시 요청이
    # 수천으로 늘어도 커넥션은 열 개다. 챗봇 경로는 cart.* 가 올 때만 DB 를 잠깐 쓰므로 괜찮지만,
    # 알고 켜는 것이다. 런타임 JDK 가 21 이 아니면 무시되고 경고만 난다.
    virtual:
      enabled: true

  jackson:
    # 값이 없는 필드는 응답에서 뺀다.
    #
    # 기본값은 `"traceId": null` 처럼 빈 칸을 그대로 내보내는 것이다. 400·404 응답마다
    # 쓰이지 않는 traceId 가 붙고, 장소 목록에서는 기준점을 안 준 요청에 distanceMeters
    # 가 전부 null 로 나간다 — 읽는 사람에게도 파싱하는 쪽에도 뜻이 없는 값이다.
    #
    # **계약을 어기지 않는다.** 명세에서 required 이면서 nullable 인 필드는 하나도 없다
    # (전수 확인). 즉 여기서 사라질 수 있는 것은 전부 선택 필드이고, 선택 필드가 없는
    # 응답은 명세가 이미 허용한다.
    #
    # 생성기의 openApiNullable 을 끈 것과 같은 판단이다 — "값이 없음" 과 "필드가 아예
    # 없음" 을 구분해야 하는 자리(PATCH)가 우리 명세에 없다 (contracts/openapi/BUILD.bazel).
    default-property-inclusion: non_null

  datasource:
    # 호스트 이름 postgres 는 platform/kubernetes/postgres/service.yaml 의 Service
    # 이름이다. 같은 네임스페이스 안에서는 이 이름만으로 닿는다.
    #
    # **비밀번호는 여기 두지 않는다.** 이미지 안에 박히면 이미지를 가진 사람이 곧
    # 자격 증명을 가진 것이 된다 (AGENTS.md §9). SPRING_DATASOURCE_PASSWORD 환경변수로
    # 들어오고, 값의 출처는 배포 환경이 정한다 — 로컬은 ConfigMap, 원격은 Secret.
    # 값이 없으면 접속이 거부되어 기동이 실패한다. 조용히 넘어가지 않는다.
    url: jdbc:postgresql://postgres:5432/scenetrip
    username: scenetrip

  flyway:
    # 기동할 때 스키마를 최신으로 맞춘다. docs/installs/k8s_install.md §16 이 규정한
    # 순서이고, 그래서 Deployment 에 DB 를 기다리는 initContainer 가 있다.
    enabled: true
    locations: classpath:db/migration
    # 빈 DB 에 baseline 을 찍지 않는다. 찍으면 V1 부터가 "이미 적용된 것"으로 간주되어
    # 테이블이 하나도 없는 채로 기동이 성공해 버린다.
    baseline-on-migrate: false

server:
  port: 8080
  shutdown: graceful

  servlet:
    # 명세가 약속한 주소를 실제로 만든다.
    #
    # contracts/openapi/scene-api-v1.yaml 의 servers.url 이 `.../v1` 이다. OpenAPI 에서
    # servers 는 "이 API 가 어디에 매달려 있는가" 이고 paths 는 그 아래의 경로라, 생성기는
    # 서버 인터페이스에 `/places` 만 매핑한다 — 접두사는 배포가 붙이는 몫이다.
    #
    # 그 몫을 아무도 하지 않아 명세와 서버가 어긋나 있었다. 명세로 생성한 앱 클라이언트는
    # `/v1/places` 를 부르는데 서버는 `/places` 로만 답했다 — 앱이 붙는 순간 모든 호출이
    # 실패하는 상태였고, 실제 요청으로 확인했다.
    #
    # **actuator 도 함께 밀린다.** /actuator/health 가 아니라 /v1/actuator/health 다.
    # 쿠버네티스 프로브 3종과 `just health` 가 그 경로를 쓰므로 같이 고쳤다.
    context-path: /v1

management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. 열어 둔 엔드포인트는 그대로 공격면이 된다.
        include: health
  endpoint:
    health:
      # liveness·readiness 그룹은 기본으로 꺼져 있다. 이것을 켜야
      # /actuator/health/liveness 와 /actuator/health/readiness 가 생기고,
      # Deployment 의 프로브 3종이 각각 다른 것을 보게 된다.
      probes:
        enabled: true
      # 상세 정보는 노출하지 않는다. 내부 구성요소 이름이 그대로 드러난다.
      show-details: never

# 코스의 계획 단계 계산값.
#
# 여행 전에는 길찾기 API 를 부르지 않고 직선거리로 하루가 얼마나 걸리는지만 어림한다
# (3주차 회의). 그 어림에 쓰는 두 수치다.
#
# **실측 없이 정한 값이라 설정으로 둔다.** 도보 4km/h 는 흔히 쓰는 성인 평균이고,
# 우회 계수는 직선거리가 실제 도로보다 짧다는 것을 메우는 값이다. 데이터가 쌓이면
# 코드를 고치지 않고 여기서 조정한다.
scenetrip:
  # 요청 한도(MZ2AZ-334, 계약 「요청 한도」, docs/project/plans/rate-limit.md). 폭주·버그·악용을 막는 값이다 — 보통
  # 사용자는 걸리지 않는다. 숫자는 요금제별이고 지금은 free 하나. 유료화하면 요금제를 더하고 계정의 요금제로 고른다.
  # 챗봇·길찾기는 DB 로 정확히(돈이 든다), 일반 분당 상한은 서버(파드)마다 메모리로 센다. 하루는 한국 시간 자정.
  limits:
    plans:
      free:
        guide-chat:
          per-hour: 15
          per-day: 100
        navigation:
          per-minute: 10
          per-day: 300
        requests-per-minute: 120
    guest-requests-per-minute: 60
  # 사용자 사진 저장소(리뷰 사진) — S3 버킷 scenetrip-user-media-<계정>-<리전>-<환경>, bootstrap 이 만든다
  # (docs/project/plans/review.md §13). 비어 있으면 서버는 뜨고 사진 올리기만 503 이다(PhotoStorageConfiguration).
  # DEV·PRD 는 배포가 Helm ConfigMap 으로 버킷 이름만 넣고 자격 증명은 EKS Pod Identity(SDK 기본 사슬). 로컬은 kind
  # 안의 MinIO 라 scene-api ConfigMap 이 아래 값들을 함께 넣는다(platform/kubernetes/scene-api/configmap.yaml).
  media:
    bucket: ${SCENETRIP_MEDIA_BUCKET:}
    region: ${SCENETRIP_MEDIA_REGION:ap-northeast-2}
    # 로컬 kind 의 MinIO 만 쓴다(§14) — DEV·PRD 는 비워 진짜 S3 와 기본 자격 증명 사슬을 쓴다.
    # endpoint 는 서버가 저장소를 부를 주소, public-port 는 앱에 줄 서명된 주소의 포트(호스트는 요청을 따른다).
    endpoint: ${SCENETRIP_MEDIA_ENDPOINT:}
    public-port: ${SCENETRIP_MEDIA_PUBLIC_PORT:}
    access-key: ${SCENETRIP_MEDIA_ACCESS_KEY:}
    secret-key: ${SCENETRIP_MEDIA_SECRET_KEY:}
  auth:
    # 가입 판정. **기본은 켬**이고 이 값은 어느 환경에서도 여기서 바꾸지 않는다.
    #
    # 로그인 스토리가 붙기 전에는 아무도 가입할 수 없어 마켓·길찾기가 전부 401 이다.
    # 시뮬레이터에서 그 화면을 실제 서버로 보려면 벽을 잠시 치워야 하는데, 앱에 우회를
    # 넣으면 배포본에 실려 나간다. 그래서 서버 설정으로 두고 **로컬 kind 의 ConfigMap 만**
    # SCENETRIP_AUTH_REQUIRE_REGISTRATION=false 로 끈다. 꺼진 파드는 기동 로그에 경고를
    # 남긴다(UserStore). 로그인이 붙으면 설정째 지운다.
    require-registration: true
    # 우리 액세스 토큰(JWT, HS256)의 서명 키 — base64, 32 바이트 이상 (ADR 0018).
    #
    # **값은 여기 두지 않는다.** SCENETRIP_AUTH_JWT_SECRET 환경변수로 들어온다 — 로컬은
    # .env 에서 `just secrets-apply` 가 만든 Secret, 원격은 시크릿 매니저. 비어 있으면 서버는
    # 뜨되 로그인이 꺼진다(발급 불가, 토큰은 전부 ACCESS_TOKEN_INVALID). 길찾기 키가 없을 때
    # 길찾기만 멈추는 것과 같다. 있는데 짧거나 base64 가 아니면 기동을 멈춘다.
    jwt-secret: ${SCENETRIP_AUTH_JWT_SECRET:}
    # 수명. 앱은 응답의 *ExpiresIn 을 따르므로 계약을 고치지 않고 바꿀 수 있다.
    # 액세스가 짧은 만큼 로그아웃·탈퇴 뒤에 서명상 살아 있는 시간이 짧다.
    access-token-ttl: 30m
    # 리프레시는 쓸 때마다 새로 받으므로 「마지막으로 앱을 연 뒤 60 일」 이 로그인 유지 기간이다.
    refresh-token-ttl: 60d
    # 외부 토큰(지금은 애플 refresh token) 암호화 키 — AES-256, base64 32 바이트. JWT 서명 키와
    # 따로 둔다(하나가 새도 다른 하나는 안전하다). 로컬 .env → secrets-apply, DEV·PRD 는 배포가 환경당
    # 한 번 만든다(tools/aws 의 auth 칸). 없으면 애플 로그인만 꺼진다.
    token-encryption-key: ${SCENETRIP_AUTH_TOKEN_ENCRYPTION_KEY:}
    # 애플 로그인 (MZ2AZ-337). 개인 키만 비밀이고 나머지는 공개 값이다.
    apple:
      # 네이티브 앱의 애플 로그인은 번들 ID 가 곧 클라이언트다 — identityToken 의 aud.
      client-id: com.mz2az.scenetrip
      team-id: PZA39D74D2
      key-id: 334974PHUY
      jwks-uri: https://appleid.apple.com/auth/keys
      # 코드 교환(/auth/token)·연결 끊기(/auth/revoke). 테스트에서 가짜 서버로 돌리려고 뺐다.
      base-url: https://appleid.apple.com
      timeout-seconds: 10
      # .p8 파일 전체(PEM)의 base64 한 줄. 사람이 애플에서 받아 오는 값이다 — 배포가 만들 수 없다.
      # 없으면 애플 로그인만 꺼진다(/auth/apple 501). 로컬 .env → secrets-apply, DEV·PRD 는 Secrets
      # Manager 의 scene_api 칸 **선택 항목**이다. ⚠ PRD 출시(App Store 심사) 전에는 필수 항목으로 옮긴다 —
      # 구글 로그인을 내면 애플 로그인도 반드시 켜져 있어야 한다(App Store 4.8). tools/aws/config.py 참고.
      private-key: ${SCENETRIP_AUTH_APPLE_PRIVATE_KEY:}
    # 구글 로그인. 비밀값이 없다 — 클라이언트 ID 는 앱 바이너리에도 들어가는 공개 값이다.
    google:
      # 구글 ID 토큰의 서명 공개키. 받아서 캐시하고, 처음 보는 키 id 가 오면 다시 받는다.
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
      # 받아 줄 aud. 이것을 안 보면 남의 앱용 구글 토큰으로도 로그인된다(계획 §9).
      #   웹  — Android 가 serverClientId 로 넘겨 Android 토큰의 aud 가 이것이 된다
      #   iOS — iOS 토큰의 aud
      # Android 클라이언트 ID 는 넣지 않는다 — 패키지·서명 지문 등록용일 뿐 aud 로 오지 않는다.
      # 클라이언트는 서버 환경이 아니라 앱에 묶이므로 로컬·DEV·PRD 가 같은 목록이다.
      client-ids: >-
        700188854872-3dl36cm33ndb2m1e8j04svnrnjpjleep.apps.googleusercontent.com,
        700188854872-7v9hphkb4phavae7stepil7q6vp7lbig.apps.googleusercontent.com
  # 네이버 장소(비공식 — 네이버 지도 웹의 내부 주소, ADR 0011·0020·0021). 키는 없다.
  naver:
    # 카드(사진·평점·영업시간) 스위치. **꺼져 있다(ADR 0020, MZ2AZ-355, 베타 전).** 카드 창구(deprecated)는 꺼진 채
    # 늘 「못 찾음」 이다. 코드와 함께 다음에 지운다 — 켜지 않는다.
    enabled: false
    # 링크 스위치(ADR 0021, MZ2AZ-373). 편의시설 상세의 naverPlaceUrl — 검색만 불러 장소 번호를 찾는다. 상세는 부르지
    # 않는다. 막히거나 문제가 되면 이것만 끈다 — 앱은 이름 검색 링크로 돌아간다.
    link-lookup:
      enabled: true
    search-url: https://bff-gateway.place.naver.com/graphql
    detail-url: https://map.naver.com/p/api/place/summary/{id}
    # 한 번 부를 때. 실측 0.3 초의 두 배 남짓 — 상세 응답이 이것을 기다린다(재검색까지 최대 두 번, 계약 「최대 1.5 초」).
    # 넘으면 이번은 비워 보내고 다음에 다시 묻는다.
    timeout-ms: 700
    # 뒤에서 채우는 일꾼 — 한 건 사이 최소 간격(초당 3 건 상한)과, 막혔을 때 쉬는 시간.
    min-interval-ms: 300
    pause-seconds: 60

  # 가이드 챗봇·일정짜기 마법사 — agents/trip-guide 에이전트를 부른다 (ADR 0013, MZ2AZ-319).
  # 키는 없다. 모델 키는 에이전트가 들고 있고 이 서비스는 모른다.
  guide:
    # 에이전트 주소(web/server.py). 로컬은 노트북의 8899. 클러스터 값은 rules_python 이 켜져
    # 에이전트 컨테이너가 생길 때 ConfigMap 이 SCENETRIP_GUIDE_AGENT_BASE_URL 로 덮어쓴다.
    # 비어 있어도 기동은 된다 — 부를 때 503 GUIDE_UNAVAILABLE 을 낸다. 챗봇 없이도 나머지 API 는
    # 돌아야 한다(카카오 키가 없을 때와 같은 판단).
    agent-base-url: http://localhost:8899
    # 응답을 기다리는 상한 — **벽**이다. 안에서 모델을 몇 번 부르는지는 모르고 알 필요도 없다.
    #
    # 원칙은 「안쪽이 바깥보다 먼저 포기한다」: 에이전트 턴 예산 30 초 < 이 값 40 초 < 앱 50 초.
    # 에이전트가 자기 예산 안에서 스스로 503 을 내는 것이 정상 경로이고, 이 값은 에이전트가
    # 그 역할을 못 했을 때의 안전망이다. 바깥이 먼저 끊으면 에이전트는 모른 채 끝까지 돌아
    # 토큰을 쓰고 이력에 답을 남긴다(MZ2AZ-320 §7). 앱이 먼저 끊으면 서버가 뒤늦게 cart.add 를
    # 저장하는데 앱은 실패로 보인다 — 그래서 앱은 이보다 길게(MZ2AZ-321 §6).
    #
    # 정상 턴 3~5 초, 모델이 도구를 4 번 도는 정상 최악 15~20 초. 실측 p95 가 나오면 그에 맞춘다.
    # 연결은 따로 3 초(코드) — 연결이 안 되면 에이전트가 없는 것이라 40 초를 기다릴 이유가 없다.
    # **재시도는 없다.** /guide/chat 은 멱등이 아니다 — 토큰을 쓰고 세션 이력이 쌓이고 cart.add 가
    # 두 번 올 수 있다.
    timeout-seconds: 40

  course:
    walking-speed-kmh: 4.0
    detour-factor: 1.3

    # 장소 유형별 기본 체류시간(분). 클라이언트가 dwellMinutes 를 비워 보내면 서버가
    # 이 표를 보고 채운다 — 표가 세 곳(iOS·Android·서버)에 흩어지지 않게 하려는 것이다.
    #
    # 수집된 place.type 은 자유 문자열이고 지금 37종이다. 전부 적지 않고 **오래 머무는
    # 곳과 스쳐 가는 곳만** 적었다. 나머지는 fallback 으로 간다.
    #
    dwell:
      fallback: 60
      # "유형=분" 을 쉼표로 잇는다. 맵이 아닌 이유는 DwellDefaults 주석에 있다 —
      # 요약하면 한글 키가 스프링 완화 바인딩에서 뭉개지고, 대괄호로 감싸면 YAML 이
      # 그것을 리스트로 읽어 조용히 전부 폴백값이 된다.
      by-place-type: >-
        테마파크=180, 박물관/미술관=120,
        고궁=90, 경기장=90, 쇼핑몰=90, 백화점=90, 해변=90, 캠핑장=90,
        공원=60, 시장=60, 음식점=60,
        카페=40,
        전망대=30, 상점=30, 서점=30, 마트=30, 거리=30,
        편의점=15, 다리=15, 역/교통=15, 호텔=15

  # 여행 중 길찾기. 카카오 대중교통·도보 API 를 서버가 부른다 — 키가 앱에 박히면
  # 뽑아낼 수 있고, 뽑히면 남이 우리 쿼터와 요금을 쓴다.
  navigation:
    # 이 아래는 대중교통을 묻지 않고 걷게 한다. 실측(2026-09-02): 카카오는 150 m 에도
    # 버스 답을 주는데 걷는 것보다 느렸다. 컷은 「실패 회피」가 아니라 「걷는 게 빠른데
    # 버스 타라는 답 회피」다. 900 은 어림값이라 설정이다 — 배차 간격과 지형에 따라 답이
    # 다르고, 실제 사용자가 어느 구간에서 길찾기를 누르는지 쌓이면 그때 다듬는다.
    walk-only-under-meters: 900
    kakao:
      # 테스트에서 로컬 가짜 서버로 돌리기 위해 설정으로 뺐다.
      base-url: https://dapi.kakao.com
      # **값은 여기 두지 않는다.** KAKAO_REST_KEY 환경변수로 들어오고, 출처는 배포
      # 환경이 정한다 — 로컬은 .env 에서 만든 Secret, 원격은 시크릿 매니저. 비어 있어도
      # 기동은 한다: 길찾기 없이도 검색·코스는 돌아야 한다. 부를 때 503 을 낸다.
      rest-key: ${KAKAO_REST_KEY:}
      # 앱이 쓰던 값과 같다. 카카오가 경로를 계산하는 데 몇 초 걸릴 수 있다.
      timeout-seconds: 12
