# PostgreSQL 접속 정보.
#
# **여기 있는 값은 시크릿이 아니다.** 로컬 kind 클러스터 전용이고 외부로 나가지 않는다
# (Service 가 ClusterIP 라 노드 밖에서 닿지 않는다). 시크릿이 아닌 값을 시크릿처럼
# 다루면 진짜 시크릿 관리가 느슨해진다 — AGENTS.md §9 의 "실제 자격 증명 금지" 는
# 그대로 유효하다.
#
# 원격 환경이 생기면 그때는 Secret 으로 바꾸고 값은 시크릿 매니저에서 온다.
# platform/environments/<env>/ 가 그 자리다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
data:
  POSTGRES_DB: "scenetrip"
  POSTGRES_USER: "scenetrip"
  POSTGRES_PASSWORD: "scenetrip-local"

  # 초기화 시 로케일. 한국어 정렬을 쓰지 않는 이유 — 검색은 term_norm(소문자 + 공백
  # 제거)과 pg_trgm 이 담당하므로 DB 콜레이션에 기대지 않는다. C 로케일이 인덱스
  # 동작이 단순하고 빠르다.
  POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
