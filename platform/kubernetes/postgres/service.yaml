# PostgreSQL 접속 지점.
#
# **ClusterIP 다 — 호스트로 열지 않는다.** DB 는 클러스터 안에서만 닿으면 되고,
# NodePort 로 열면 노트북의 5432 를 점유하면서 공격면만 넓어진다. 로컬에서 psql 로
# 들여다볼 때는 `just db-psql` 이 파드 안에서 실행한다.
#
# clusterIP: None (헤드리스)인 이유 — StatefulSet 의 안정적인 파드 DNS 이름
# (postgres-0.postgres) 을 얻기 위해서다. 복제본이 늘어날 때 각 파드를 지목할 수 있다.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
