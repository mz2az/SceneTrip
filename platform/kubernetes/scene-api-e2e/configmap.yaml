# scene-api e2e 인스턴스가 기본 ConfigMap(scene-api) 위에 덮는 값 (MZ2AZ-496, docs/project/plans/api-e2e.md §2).
#
# 바깥 서비스는 전부 시험이 호스트에 띄우는 가짜 서버(tests/e2e, 0.0.0.0:18900)로 간다. kind 파드는 host.docker.internal 로
# 호스트에 닿는다(trip-guide 와 같은 길). 경로 앞머리로 서비스를 가른다 — /kakao · /google · /naver · /guide.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-api-e2e
  labels:
    app.kubernetes.io/name: scene-api-e2e
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
data:
  # 운영과 같이 가입한 사용자만 회원 기능을 쓴다 — 평소 로컬(false)과 다르다.
  SCENETRIP_AUTH_REQUIRE_REGISTRATION: "true"
  OTEL_SERVICE_NAME: "scenetrip-scene-api-e2e"
  # 카카오 길찾기 — 키는 아무 값(가짜는 보지 않고 헤더에 왔는지만 본다).
  SCENETRIP_NAVIGATION_KAKAO_BASEURL: "http://host.docker.internal:18900/kakao"
  KAKAO_REST_KEY: "e2e-fake-kakao-key"
  SCENETRIP_NAVIGATION_KAKAO_TIMEOUTSECONDS: "5"
  # 구글 로그인 — 가짜가 JWKS(공개키)를 내고 시험이 같은 키로 ID 토큰을 서명한다. aud 는 이 값.
  SCENETRIP_AUTH_GOOGLE_JWKSURI: "http://host.docker.internal:18900/google/jwks"
  SCENETRIP_AUTH_GOOGLE_CLIENTIDS: "e2e-client.apps.googleusercontent.com"
  # 애플은 개인 키·암호화 키가 없어 꺼진 채로 둔다(/auth/apple 501) — 전체 흐름은 2차.
  SCENETRIP_AUTH_APPLE_JWKSURI: "http://host.docker.internal:18900/apple/jwks"
  SCENETRIP_AUTH_APPLE_BASEURL: "http://host.docker.internal:18900/apple"
  # 네이버 장소 링크 찾기 — 평소 로컬은 진짜 네이버를 부른다. e2e 는 가짜로.
  SCENETRIP_NAVER_SEARCHURL: "http://host.docker.internal:18900/naver/graphql"
  SCENETRIP_NAVER_DETAILURL: "http://host.docker.internal:18900/naver/summary/{id}"
  # 챗봇 에이전트 — scene-api ↔ 에이전트 경계를 가짜로(진짜 trip-guide + 가짜 LLM 은 2차).
  SCENETRIP_GUIDE_AGENT_BASE_URL: "http://host.docker.internal:18900/guide-agent"
  SCENETRIP_GUIDE_TIMEOUTSECONDS: "10"
  # 일반 분당 요청 한도(파드 메모리) — 시험 100 여 개가 한 IP(호스트)에서 몰려 나가 비회원·IP 칸 60/분에 걸렸다(2026-10-18).
  # 이 한도는 e2e 대상이 아니라 크게 연다. 돈이 드는 길찾기·챗봇 한도(DB, plans.free.navigation·guide-chat)는 그대로 둬서 시험한다.
  SCENETRIP_LIMITS_GUESTREQUESTSPERMINUTE: "100000"
  SCENETRIP_LIMITS_PLANS_FREE_REQUESTSPERMINUTE: "100000"
