# scene-api e2e 인스턴스 — 평소 로컬 scene-api 와 같은 이미지(scene-api:dev)·같은 DB, 바깥 서비스만 가짜로 (MZ2AZ-496).
#
# 계획: docs/project/plans/api-e2e.md §2. 평소 서버의 설정(네이버 실제 호출, 가입 강제 끔)을 건드리지 않으려고 따로 띄운다.
# NodePort 가 없다 — kind 의 호스트 포트 잇기는 클러스터를 만들 때만 정해지므로 `just e2e-up` 이 port-forward(18082)로 연다.
# 나머지(보안 설정·프로브·init 컨테이너)는 scene-api/deployment.yaml 과 같다 — 이유는 그쪽 주석에.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-api-e2e
  labels:
    app.kubernetes.io/name: scene-api-e2e
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-api-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-api-e2e
        app.kubernetes.io/part-of: scenetrip
    spec:
      # 이미지가 UID 10001 로 실행되도록 만들어져 있다 (services/scene-api/Dockerfile).
      # 여기서 한 번 더 못 박아, 이미지가 바뀌어 root 로 돌게 되면 파드가 뜨지 않게 한다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      # DB 가 응답할 때까지 기다렸다가 앱을 띄운다.
      #
      # 없으면 어떻게 되냐면 — 앱은 기동하면서 Flyway 마이그레이션을 돌리려고 DB 에
      # 접속한다. DB 가 아직이면 예외로 죽고, 파드는 CrashLoopBackOff 에 들어간다.
      # 재시작 간격이 지수적으로 늘어나서 DB 가 10 초 뒤에 떠도 앱은 몇 분을 더 기다린다.
      # `just deploy postgres local` 을 먼저 하는 것으로도 대부분 맞지만, 순서를
      # 사람의 기억에 맡기지 않는다 (docs/installs/k8s_install.md §16).
      #
      # 이미지를 postgres 것으로 쓰는 이유: pg_isready 가 들어 있고 이미 노드에 적재돼
      # 있어 추가로 받아올 것이 없다. busybox 로 포트만 확인하면 "포트는 열렸는데 아직
      # 복구 중" 인 상태를 통과시킨다 — StatefulSet 의 프로브와 같은 이유다.
      initContainers:
        - name: wait-for-db
          image: imresamu/postgis:17-3.5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER"; do
                echo "postgres 대기 중..."
                sleep 2
              done
          envFrom:
            - configMapRef:
                name: postgres
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: scene-api
          image: scene-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: scene-api
            # 같은 키가 둘 다에 있으면 뒤의 것이 이긴다 — 바깥 주소·로그인 설정만 e2e 값으로 덮는다.
            - configMapRef:
                name: scene-api-e2e
          # DB 자격 증명은 postgres 의 ConfigMap 을 그대로 가리킨다. 값을 여기 옮겨
          # 적으면 한쪽만 바뀌는 날이 온다 — 접속 정보의 정본은 DB 를 정의한 쪽 하나다.
          #
          # 원격 환경에서는 이 두 블록의 configMapKeyRef 가 secretKeyRef 로 바뀐다.
          # 참조 방식만 바뀌고 애플리케이션은 그대로다.
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            # e2e 전용 Secret — `just e2e-up` 이 실행마다 무작위로 만든다(저장소에 값이 없다). 진짜 키(scene-api-secrets)는
            # 보지 않는다: 바깥은 전부 가짜라 진짜 카카오 키가 필요 없고, 새면 안 되는 값을 시험 파드에 넣지 않는다.
            - name: SCENETRIP_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: scene-api-e2e-secrets
                  key: SCENETRIP_AUTH_JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # CPU 한도는 일부러 두지 않는다. JVM 은 기동 때 CPU 를 몰아 쓰는데
              # 한도가 걸리면 쓰로틀링으로 기동이 느려지고 프로브가 먼저 죽인다.
              memory: 512Mi
          # 프로브 셋이 각각 다른 것을 막는다.
          #
          #   startup   기동이 느릴 때 liveness 가 먼저 죽이는 것
          #   readiness 준비 전에 Service 가 트래픽을 보내는 것
          #   liveness  죽은 프로세스가 살아 있는 것처럼 보이는 것
          #
          # startupProbe 가 성공할 때까지 나머지 둘은 아예 실행되지 않는다.
          #
          # 경로에 /v1 이 붙는 이유: application.yaml 의 server.servlet.context-path 가
          # /v1 이라 actuator 도 그 아래로 밀린다. 명세(contracts/openapi)가 약속한 주소를
          # 맞추려고 넣은 설정인데, 상태 점검 경로까지 함께 움직인다.
          #
          # 여기를 빠뜨리면 프로브가 404 를 받아 파드가 **영원히 준비되지 않는다.**
          # 애플리케이션은 멀쩡히 떠 있는데 롤아웃만 실패해서 원인을 찾기 어렵다.
          startupProbe:
            httpGet:
              path: /v1/actuator/health
              port: http
            periodSeconds: 2
            failureThreshold: 30 # 최대 60초까지 기동을 기다린다
          readinessProbe:
            httpGet:
              path: /v1/actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # 종료 직전에 잠깐 기다린다. 이것이 없으면 무중단 배포가 되지 않는다.
          #
          # 파드를 지우면 두 가지가 **동시에** 일어난다 — kubelet 이 SIGTERM 을 보내
          # 애플리케이션이 새 연결을 거부하기 시작하는 것과, 엔드포인트 컨트롤러가
          # 이 파드를 Service 에서 빼는 것이다. 전자가 먼저 이기면 Service 는 아직
          # 이 파드로 요청을 보내는데 파드는 이미 거부한다.
          #
          # preStop 이 그 순서를 만든다. 이 5 초 동안 컨테이너는 계속 응답하고,
          # 그 사이 엔드포인트 제거가 전파된다. 그 뒤에 SIGTERM 이 가고
          # application.yaml 의 graceful shutdown 이 남은 요청을 마무리한다.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # 루트 파일시스템을 읽기 전용으로 두면 JVM 과 Tomcat 이 /tmp 에 쓰지 못해
            # 기동에 실패한다. 그 한 곳만 쓰기 가능한 임시 볼륨으로 연다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
