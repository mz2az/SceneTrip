# scene-api e2e 인스턴스의 클러스터 안 주소. 호스트에서는 `just e2e-up` 의 port-forward(localhost:18082)로 닿는다.
apiVersion: v1
kind: Service
metadata:
  name: scene-api-e2e
  labels:
    app.kubernetes.io/name: scene-api-e2e
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scene-api-e2e
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
