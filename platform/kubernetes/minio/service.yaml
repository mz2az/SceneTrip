# MinIO S3 API.
#
# **NodePort 하나로 안팎을 다 받는다.** 클러스터 안의 scene-api 는 `minio:9000` 으로(사진 옮기기·지우기), 클러스터 밖의 앱은
# `localhost:9000`(안드로이드 에뮬레이터는 10.0.2.2:9000)으로 — kind 가 호스트 9000 을 NodePort 30090 에 이어 준다
# (platform/kind/cluster.yaml). 앱이 받는 서명된 주소는 scene-api 가 밖의 주소로 만들어 준다.
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30090
      protocol: TCP
