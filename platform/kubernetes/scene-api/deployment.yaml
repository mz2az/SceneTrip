# scene-api 백엔드.
#
# 이미지는 `just image scene-api` 가 굽고 kind 노드에 적재한다. 레지스트리에 올리지
# 않으므로 imagePullPolicy 를 반드시 IfNotPresent 로 둔다 — 기본값(:latest 태그면
# Always)이면 파드가 레지스트리에서 받으려다 ErrImagePull 로 멈춘다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scene-api
  labels:
    app.kubernetes.io/name: scene-api
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scene-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scene-api
        app.kubernetes.io/part-of: scenetrip
    spec:
      # 이미지가 UID 10001 로 실행되도록 만들어져 있다 (services/scene-api/Dockerfile).
      # 여기서 한 번 더 못 박아, 이미지가 바뀌어 root 로 돌게 되면 파드가 뜨지 않게 한다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: scene-api
          image: scene-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: scene-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # CPU 한도는 일부러 두지 않는다. JVM 은 기동 때 CPU 를 몰아 쓰는데
              # 한도가 걸리면 쓰로틀링으로 기동이 느려지고 프로브가 먼저 죽인다.
              memory: 512Mi
          # 프로브 셋이 각각 다른 것을 막는다.
          #
          #   startup   기동이 느릴 때 liveness 가 먼저 죽이는 것
          #   readiness 준비 전에 Service 가 트래픽을 보내는 것
          #   liveness  죽은 프로세스가 살아 있는 것처럼 보이는 것
          #
          # startupProbe 가 성공할 때까지 나머지 둘은 아예 실행되지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 2
            failureThreshold: 30 # 최대 60초까지 기동을 기다린다
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # 루트 파일시스템을 읽기 전용으로 두면 JVM 과 Tomcat 이 /tmp 에 쓰지 못해
            # 기동에 실패한다. 그 한 곳만 쓰기 가능한 임시 볼륨으로 연다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
