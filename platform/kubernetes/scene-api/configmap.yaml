# scene-api 의 환경별 설정.
#
# 기본값은 이미지 안의 services/scene-api/src/main/resources/application.yaml 에 있고,
# 환경마다 달라지는 값만 여기서 환경변수로 덮어쓴다. Spring 은 SPRING_ 접두 환경변수를
# 설정 키로 자동 변환한다 (SERVER_PORT → server.port).
#
# **시크릿은 여기 두지 않는다** (AGENTS.md §9). ConfigMap 은 평문이고 저장소에
# 커밋된다. 비밀번호·토큰은 Secret 으로 분리하고 값은 시크릿 매니저에서 온다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-api
  labels:
    app.kubernetes.io/name: scene-api
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
data:
  SPRING_PROFILES_ACTIVE: "local"

  # 가입 판정을 끈다 — **로컬 kind 전용이다.** 로그인이 붙기 전이라 아무도 가입할 수
  # 없고, 그대로 두면 시뮬레이터의 마켓·길찾기가 전부 401 이다. 원격 환경의 ConfigMap
  # 에는 이 줄이 없어야 한다(기본값 true). 로그인이 붙으면 지운다 — MZ2AZ-302.
  SCENETRIP_AUTH_REQUIRE_REGISTRATION: "false"

  # 컨테이너 메모리 한도에 맞춰 힙을 잡는다. Java 21 은 cgroup 한도를 인식하지만
  # 기본 비율(25%)이 낮아 512Mi 한도에서 힙이 128Mi 밖에 안 잡힌다.
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40"

  # 리뷰 사진 저장소 — 로컬은 클러스터 안 MinIO(platform/kubernetes/minio). DEV·PRD 는 진짜 S3 라 이 넷이 없다(Helm).
  #   ENDPOINT     서버가 MinIO 와 직접 대화할 주소(사진 옮기기·지우기) — 클러스터 안의 이름
  #   PUBLIC_PORT  앱에 줄 서명된 주소의 포트. 호스트는 앱이 이 서버를 부른 주소를 따른다 — iOS 시뮬레이터
  #                localhost, 안드로이드 에뮬레이터 10.0.2.2, 같은 와이파이의 폰은 맥의 IP. kind 가 호스트 9000 을
  #                MinIO 에 잇는다(platform/kind/cluster.yaml). 서명에 주소가 들어가 앱이 바꿀 수 없어서다
  #   ACCESS/SECRET  MinIO ConfigMap 과 같은 로컬 고정값. 진짜 비밀이 아니다
  #   REGION       MinIO 의 기본 리전. 서명에 들어가므로 맞아야 한다
  SCENETRIP_MEDIA_BUCKET: "scenetrip-user-media"
  SCENETRIP_MEDIA_ENDPOINT: "http://minio:9000"
  SCENETRIP_MEDIA_PUBLIC_PORT: "9000"
  SCENETRIP_MEDIA_ACCESS_KEY: "scenetrip"
  SCENETRIP_MEDIA_SECRET_KEY: "scenetrip-local-minio"
  SCENETRIP_MEDIA_REGION: "us-east-1"

  # ── OpenTelemetry ──────────────────────────────────────────────────────────
  #
  # 에이전트 자체는 이미지가 들고 있다 (services/scene-api/Dockerfile). 여기 있는
  # 것은 "어디로 보낼지" 뿐이라 환경마다 달라진다.

  # 로그·트레이스 검색의 1차 필터 키다. 모듈마다 달라야 화면에서 섞이지 않는다.
  # 규칙은 scenetrip-<모듈> — docs/installs/signoz_install.md 의 표가 정본이다.
  OTEL_SERVICE_NAME: "scenetrip-scene-api"

  # 클러스터 안에서는 Service 이름으로 닿는다. 맥에서 직접 실행할 때는
  # `just signoz-forward` 를 띄우고 localhost:4317 을 쓴다.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://signoz-ingester.signoz.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  # 셋을 다 켠다. 트레이스만 켜면 SigNoz 의 로그 화면이 비고, 로그만 켜면 느린 요청의
  # 원인을 짚을 수 없다.
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "otlp"

  # 로그 한 줄과 트레이스를 잇는다. 이 값이 MDC 에 들어가야 ApiExceptionHandler 가
  # 오류 응답의 traceId 를 채울 수 있고, 사용자가 준 그 값으로 SigNoz 에서 요청
  # 하나를 그대로 찾을 수 있다.
  OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"

  # 상태 점검 요청은 트레이스로 남기지 않는다. 프로브가 2 초마다 세 종류를 부르므로
  # 그대로 두면 트레이스의 대부분이 헬스체크가 된다.
  OTEL_INSTRUMENTATION_HTTP_SERVER_EXPERIMENTAL_TELEMETRY_ENABLED: "false"
  OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED: "false"
