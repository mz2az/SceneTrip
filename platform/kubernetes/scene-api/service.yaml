# scene-api 를 호스트에 노출한다.
#
# NodePort 30081 은 platform/kind/cluster.yaml 이 호스트 8081 로 매핑해 둔 포트다.
# 그래서 port-forward 없이 http://localhost:8081 로 닿는다. 그 매핑은 클러스터를
# 만들 때만 설정할 수 있으므로 번호를 바꾸려면 cluster.yaml 도 함께 고치고
# 클러스터를 다시 만들어야 한다.
apiVersion: v1
kind: Service
metadata:
  name: scene-api
  labels:
    app.kubernetes.io/name: scene-api
    app.kubernetes.io/part-of: scenetrip
    app.kubernetes.io/managed-by: scenetrip
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scene-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
      protocol: TCP
