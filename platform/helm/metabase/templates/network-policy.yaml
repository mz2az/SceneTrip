# 기본 거부 뒤에 필요한 길만 연다 — DNS(53), RDS(5432) 나감, ALB 공개 서브넷에서 3000 들어옴.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: {{ required "EKS Auto Mode DNS CIDR이 필요합니다" .Values.network.dnsCidr }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metabase
spec:
  podSelector:
    matchLabels: { app: metabase }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- if not .Values.network.albCidrs }}{{ fail "ALB 서브넷 CIDR(network.albCidrs)이 필요합니다 — 비면 모든 곳에서 받는다" }}{{ end }}
        {{- range .Values.network.albCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports: [{ protocol: TCP, port: 3000 }]
  egress:
    # RDS(Metabase 앱 DB 와 scenetrip DB 둘 다 같은 인스턴스).
    - ports: [{ protocol: TCP, port: 5432 }]
