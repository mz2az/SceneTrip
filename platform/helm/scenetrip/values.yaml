# 필수 값은 배포 CLI가 Terraform 출력과 불변 이미지 태그로 채운다.
environment: dev
database:
  host: ""
gateway:
  image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
  host: ""
  certificateArn: ""
  allowedCidrs: []
  # true 면 client IP 검증을 끄고 인터넷 전체를 받는다. dev 에서만 허용(ADR 0019) —
  # 배포기가 Terraform 출력(ingress_public)으로 넣는다.
  public: false
  albSubnetIds: []
  trustedProxyCidrs: []
  securityGroupId: ""
  replicas: 1
sceneApi:
  image: ""
  # 사용자 사진 버킷 이름 — 배포기가 Terraform 출력(user_media_bucket)으로 채운다.
  mediaBucket: ""
  replicas: 1
tripGuide:
  image: ""
  # 세션을 메모리에 보관하므로 1개만 허용한다.
  replicas: 1
otel:
  endpoint: ""
network:
  # EKS serviceIpv4Cidr의 열 번째 주소를 배포 실행기가 계산한다.
  dnsCidr: ""
