# 필수 값은 배포 CLI가 Terraform 출력과 불변 이미지 태그로 채운다.
environment: dev
database:
  host: ""
gateway:
  image: nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:c97ff0bf7cbae369953c6da1232ec14ad9f971d66360c5698db0856a4cd657a0
  host: ""
  certificateArn: ""
  allowedCidrs: []
  # true 면 client IP 검증을 끄고 인터넷 전체를 받는다. dev 에서만 허용(ADR 0019) —
  # 배포기가 Terraform 출력(ingress_public)으로 넣는다.
  public: false
  albSubnetIds: []
  trustedProxyCidrs: []
  securityGroupId: ""
  replicas: 1
sceneApi:
  image: ""
  # 사용자 사진 버킷 이름 — 배포기가 Terraform 출력(user_media_bucket)으로 채운다.
  mediaBucket: ""
  replicas: 1
tripGuide:
  image: ""
  # 세션을 메모리에 보관하므로 1개만 허용한다.
  replicas: 1
otel:
  endpoint: ""
  # trip-guide 의 OTLP/HTTP trace 주소(…:4318/v1/traces). 비면 trip-guide 는 trace 를 보내지 않는다.
  tracesHttpEndpoint: ""
network:
  # EKS serviceIpv4Cidr의 열 번째 주소를 배포 실행기가 계산한다.
  dnsCidr: ""
# DEV 부하 시험 모드(MZ2AZ-502, docs/project/plans/load-test.md §3). 기본은 꺼짐 — 꺼져 있으면 렌더 결과가 이 블록이
# 없던 때와 같다. 켜면 가짜 바깥 서버(fake-external)를 올리고 scene-api 의 카카오·구글 공개키 주소와 trip-guide 의 모델
# 주소를 그쪽으로 돌리며 gateway 의 IP 당 상한을 올린다. **PRD 에서 켜면 렌더가 실패한다.** 켜고 끄기는
# `just loadtest-mode dev on|off` 로만 한다 — 보통 배포(`aws-deploy apply`)는 값을 다시 넣으므로 꺼진 상태로 돌아간다.
loadtest:
  enabled: false
  # 시험용 구글 ID 토큰의 aud — scene-api 가 받아 줄 client ID 를 이것 하나로 바꾼다(그동안 진짜 구글 로그인은 안 된다).
  googleClientId: ""
  # 시험용 키의 공개 JWK(JSON 한 덩어리) — `just load-tokens --jwk-out` 이 만든다. 가짜가 /google/jwks 로 낸다.
  googleJwkJson: ""
  # 시험 동안 gateway 의 IP 당 상한(평소 30r/s · burst 60 · 동시 60). 부하는 러너 한 대(IP 하나)에서 나간다.
  gatewayRate: "2000r/s"
  gatewayBurst: 4000
  gatewayConnections: 4000
