{{- range $name, $config := dict "scene-api" .Values.sceneApi "trip-guide" .Values.tripGuide "gateway" .Values.gateway }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ $config.replicas }}
  {{- if eq $name "trip-guide" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- if eq $name "scene-api" }}
      # 사용자 사진 버킷 권한을 EKS Pod Identity 로 받는다 — Terraform 이 이 이름으로 역할을 잇는다
      # (platform/terraform/aws/eks.tf 의 scene_api_media). 쿠버네티스 API 토큰은 여전히 마운트하지 않는다.
      serviceAccountName: scene-api
      {{- else if eq $name "trip-guide" }}
      # Bedrock 호출 권한을 Pod Identity 로 받는다(eks.tf trip_guide_bedrock, MZ2AZ-317) — 고정 키 대신.
      serviceAccountName: trip-guide
      {{- end }}
      nodeSelector:
        kubernetes.io/arch: amd64
      {{- if ge (int $config.replicas) 2 }}
      # 두 벌을 둔 이유는 한 대가 죽어도 남는 것이다 — 가용 영역을 **반드시** 나눈다(DoNotSchedule). 「되면」(ScheduleAnyway)
      # 이던 때는 클러스터가 전부를 노드 한 대에 넣었고, 그 노드가 멈추자 두 벌이 함께 죽어 PRD 가 15 분마다 502 를 냈다
      # (2026-10-14). Auto Mode 가 다른 영역에 노드를 띄운다. 같은 영역 안에서는 노드도 되도록 나눈다.
      # matchLabelKeys(pod-template-hash) — 같은 판의 파드끼리만 센다. 빼면 배포 중 아직 남은 옛 판 파드까지 세어, 새 두 벌이
      # 옛 판이 없는 한 영역에 함께 들어가고 옛 판이 지워진 뒤에도 그대로 남는다(2026-10-14 PRD 실측).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ $name }}
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $name }}
          matchLabelKeys: [pod-template-hash]
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ required (printf "%s.image가 필요합니다" $name) $config.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "gateway" }}
          command: ["nginx", "-g", "daemon off;"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ ternary 8899 8080 (eq $name "trip-guide") }}
          {{- if eq $name "scene-api" }}
          envFrom:
            - configMapRef: { name: scene-api }
            - secretRef: { name: scene-api-secrets }
            - secretRef: { name: database-runtime }
          {{- else if eq $name "trip-guide" }}
          env:
            - name: SCENE_API_BASE_URL
              value: "http://scene-api:8080/v1"
            {{- if $.Values.otel.tracesHttpEndpoint }}
            # trace — 표준 라이브러리로 OTLP/JSON 을 HTTP 로 보낸다(agents/trip-guide/src/tracing.py, ADR 0025).
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ $.Values.otel.tracesHttpEndpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "scenetrip-trip-guide"
            {{- end }}
            {{- if $.Values.loadtest.enabled }}
            # 부하 시험 모드(MZ2AZ-502, DEV 전용) — Bedrock 대신 클러스터 안 가짜 모델 서버. none 은 인증 헤더도 자격 증명 확인도 없다.
            - name: TRIP_GUIDE_MODEL_BASE_URL
              value: "http://fake-external:8080/bedrock"
            - name: TRIP_GUIDE_MODEL_AUTH
              value: "none"
            {{- end }}
          envFrom:
            - secretRef: { name: trip-guide-secrets }
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ if eq $name "scene-api" }}/v1/actuator/health/liveness{{ else if eq $name "trip-guide" }}/health/live{{ else }}/healthz{{ end }}
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: {{ if eq $name "scene-api" }}/v1/actuator/health/readiness{{ else if eq $name "trip-guide" }}/health/ready{{ else }}/healthz{{ end }}
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ if eq $name "scene-api" }}/v1/actuator/health/liveness{{ else if eq $name "trip-guide" }}/health/live{{ else }}/healthz{{ end }}
              port: http
            periodSeconds: 10
          resources:
            # scene-api(JVM)는 상한(1Gi) 가까이 쓴다 — 최소 필요량을 상한과 같게 적어야 클러스터가 노드에 넘치게 싣지 않는다.
            requests:
              cpu: {{ ternary "250m" "100m" (eq $name "scene-api") }}
              memory: {{ ternary "1Gi" "128Mi" (eq $name "scene-api") }}
            limits:
              memory: {{ ternary "1Gi" "512Mi" (eq $name "scene-api") }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq $name "gateway" }}
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $name "gateway" }}
        - name: config
          configMap:
            name: gateway
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ if eq $name "trip-guide" }}8899{{ else }}8080{{ end }}
      targetPort: http
{{- if ge (int $config.replicas) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $name }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scene-api
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
# trip-guide 의 Bedrock 역할(Pod Identity, MZ2AZ-317). 쿠버네티스 API 토큰은 마운트하지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: trip-guide
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
