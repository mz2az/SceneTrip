apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock:
            cidr: {{ required "EKS Auto Mode DNS CIDR이 필요합니다" .Values.network.dnsCidr }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.gateway.trustedProxyCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: scene-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scene-api
spec:
  podSelector:
    matchLabels: { app: scene-api }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: gateway } }
        - podSelector: { matchLabels: { app: trip-guide } }
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: trip-guide } } }]
      ports: [{ protocol: TCP, port: 8899 }]
    - ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 443 }]
    # EKS Pod Identity 에이전트(노드의 링크 로컬 주소) — 역할의 임시 자격 증명을 여기서 받는다(MZ2AZ-317). 막으면
    # 사진 버킷(scene-api)·Bedrock(trip-guide) 호출이 키를 못 받아 실패한다.
    - to: [{ ipBlock: { cidr: 169.254.170.23/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-guide
spec:
  podSelector:
    matchLabels: { app: trip-guide }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: scene-api } } }]
      ports: [{ protocol: TCP, port: 8899 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: scene-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - ports: [{ protocol: TCP, port: 443 }]
    # EKS Pod Identity 에이전트(노드의 링크 로컬 주소) — 역할의 임시 자격 증명을 여기서 받는다(MZ2AZ-317). 막으면
    # 사진 버킷(scene-api)·Bedrock(trip-guide) 호출이 키를 못 받아 실패한다.
    - to: [{ ipBlock: { cidr: 169.254.170.23/32 } }]
      ports: [{ protocol: TCP, port: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-jobs
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        # data-load: 원격 데이터 적재 Job(MZ2AZ-414). 데이터가 이미지에 있어 5432 밖으로 나갈 일이 없다.
        values: [database-bootstrap, database-migrate, data-load]
  policyTypes: [Egress]
  egress:
    - ports: [{ protocol: TCP, port: 5432 }]
{{- if .Values.otel.endpoint }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scene-api-otel
spec:
  podSelector:
    matchLabels: { app: scene-api }
  policyTypes: [Egress]
  egress:
    - ports: [{ protocol: TCP, port: 4317 }]
{{- end }}
{{- if .Values.otel.tracesHttpEndpoint }}
---
# trip-guide 의 trace — SigNoz 수집기의 OTLP/HTTP(4318).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trip-guide-otel
spec:
  podSelector:
    matchLabels: { app: trip-guide }
  policyTypes: [Egress]
  egress:
    - ports: [{ protocol: TCP, port: 4318 }]
{{- end }}
