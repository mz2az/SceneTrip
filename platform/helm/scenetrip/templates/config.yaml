{{- if ne (int .Values.tripGuide.replicas) 1 }}{{ fail "trip-guide는 메모리 세션으로 replica=1만 지원합니다" }}{{ end }}
{{- if not (has .Values.environment (list "dev" "prd")) }}{{ fail "환경은 dev 또는 prd여야 합니다" }}{{ end }}
{{- if not .Values.gateway.allowedCidrs }}{{ fail "gateway.allowedCidrs가 필요합니다" }}{{ end }}
{{- if not .Values.gateway.trustedProxyCidrs }}{{ fail "ALB proxy subnet CIDR이 필요합니다" }}{{ end }}
{{- range .Values.gateway.allowedCidrs }}
{{- if or (eq . "0.0.0.0/0") (eq . "::/0") }}{{ fail "전체 인터넷 공개는 허용하지 않습니다" }}{{ end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-api
  namespace: {{ .Release.Namespace }}
data:
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:5432/scenetrip?sslmode=require" (required "database.host가 필요합니다" .Values.database.host) | quote }}
  SPRING_FLYWAY_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  SCENETRIP_AUTH_REQUIRE_REGISTRATION: "true"
  SCENETRIP_GUIDE_AGENT_BASE_URL: "http://trip-guide:8899"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40"
  OTEL_SERVICE_NAME: "scenetrip-scene-api"
  OTEL_SDK_DISABLED: {{ ternary "false" "true" (ne .Values.otel.endpoint "") | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      log_format safe '$remote_addr $request_method $uri $status $request_time';
      access_log /dev/stdout safe;
      error_log /dev/stderr warn;
      server_tokens off;
      {{- range .Values.gateway.trustedProxyCidrs }}
      set_real_ip_from {{ . }};
      {{- end }}
      real_ip_header X-Forwarded-For;
      real_ip_recursive off;
      geo $realip_remote_addr $trusted_alb_peer {
        default 0;
        {{- range .Values.gateway.trustedProxyCidrs }}
        {{ . }} 1;
        {{- end }}
      }
      geo $remote_addr $allowed_client {
        default 0;
        {{- range .Values.gateway.allowedCidrs }}
        {{ . }} 1;
        {{- end }}
      }
      map "$trusted_alb_peer:$allowed_client" $api_allowed {
        default 0;
        "1:1" 1;
      }
      limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
      limit_conn_zone $binary_remote_addr zone=connections:10m;
      server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location / { return 404; }
      }
      server {
        listen 8080;
        server_name {{ required "gateway.host가 필요합니다" .Values.gateway.host }};
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; return 200 'ok'; }
        location ~* ^/v1/(actuator|internal)(/|$) { return 404; }
        location ~ ^/v1/(search|contents|places|pois|cart|courses|favorites|market|navigation|guide)(/|$) {
          if ($api_allowed = 0) { return 403; }
          limit_req zone=api burst=20 nodelay;
          limit_req_status 429;
          limit_conn connections 20;
          proxy_pass http://scene-api:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Forwarded "";
          proxy_set_header X-Service-Token "";
          proxy_set_header Connection "";
          proxy_connect_timeout 3s;
          proxy_read_timeout 45s;
        }
        location / { return 404; }
      }
    }
