{{- if ne (int .Values.tripGuide.replicas) 1 }}{{ fail "trip-guide는 메모리 세션으로 replica=1만 지원합니다" }}{{ end }}
{{- if not (has .Values.environment (list "dev" "prd")) }}{{ fail "환경은 dev 또는 prd여야 합니다" }}{{ end }}
{{- if not .Values.gateway.allowedCidrs }}{{ fail "gateway.allowedCidrs가 필요합니다" }}{{ end }}
{{- if not .Values.gateway.trustedProxyCidrs }}{{ fail "ALB proxy subnet CIDR이 필요합니다" }}{{ end }}
{{- range .Values.gateway.allowedCidrs }}
{{- if or (eq . "0.0.0.0/0") (eq . "::/0") }}{{ fail "전체 인터넷 공개는 allowedCidrs 가 아니라 gateway.public 으로 한다" }}{{ end }}
{{- end }}
{{- if and .Values.gateway.public (ne .Values.environment "dev") }}{{ fail "전체 인터넷 공개는 dev 에서만 허용합니다 (ADR 0019)" }}{{ end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: scene-api
  namespace: {{ .Release.Namespace }}
data:
  SPRING_DATASOURCE_URL: {{ printf "jdbc:postgresql://%s:5432/scenetrip?sslmode=require" (required "database.host가 필요합니다" .Values.database.host) | quote }}
  SPRING_FLYWAY_ENABLED: "false"
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  SCENETRIP_AUTH_REQUIRE_REGISTRATION: "true"
  SCENETRIP_GUIDE_AGENT_BASE_URL: "http://trip-guide:8899"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=40"
  OTEL_SERVICE_NAME: "scenetrip-scene-api"
  # 사용자 사진 버킷(bootstrap 이 만든다). 비면 사진 올리기만 503 — 배포기가 Terraform 출력으로 넣는다.
  SCENETRIP_MEDIA_BUCKET: {{ .Values.sceneApi.mediaBucket | quote }}
  OTEL_SDK_DISABLED: {{ ternary "false" "true" (ne .Values.otel.endpoint "") | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      log_format safe '$remote_addr $request_method $uri $status $request_time';
      access_log /dev/stdout safe;
      error_log /dev/stderr warn;
      server_tokens off;
      {{- range .Values.gateway.trustedProxyCidrs }}
      set_real_ip_from {{ . }};
      {{- end }}
      real_ip_header X-Forwarded-For;
      real_ip_recursive off;
      geo $realip_remote_addr $trusted_alb_peer {
        default 0;
        {{- range .Values.gateway.trustedProxyCidrs }}
        {{ . }} 1;
        {{- end }}
      }
      # dev 는 공개(gateway.public) — 모든 client 를 받는다. ALB 를 거쳐 왔는지
      # ($trusted_alb_peer)는 공개여도 그대로 본다.
      geo $remote_addr $allowed_client {
        default {{ ternary 1 0 .Values.gateway.public }};
        {{- range .Values.gateway.allowedCidrs }}
        {{ . }} 1;
        {{- end }}
      }
      map "$trusted_alb_peer:$allowed_client" $api_allowed {
        default 0;
        "1:1" 1;
      }
      # IP 당 상한은 폭주만 막는 바깥 울타리다 — LTE 는 통신사 CGNAT 로 많은 사용자가 IP 하나를 함께 쓴다. 실제 한도는
      # 계정 기준으로 scene-api 가 센다(MZ2AZ-334, docs/project/plans/rate-limit.md).
      limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
      limit_conn_zone $binary_remote_addr zone=connections:10m;
      server {
        listen 8080 default_server;
        server_name _;
        location = /healthz { access_log off; return 200 'ok'; }
        location / { return 404; }
      }
      server {
        listen 8080;
        server_name {{ required "gateway.host가 필요합니다" .Values.gateway.host }};
        client_max_body_size 1m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; return 200 'ok'; }
        location ~* ^/v1/(actuator|internal)(/|$) { return 404; }
        location ~ ^/v1/(search|contents|places|pois|cart|courses|favorites|market|navigation|guide|auth|me)(/|$) {
          if ($api_allowed = 0) { return 403; }
          limit_req zone=api burst=60 nodelay;
          limit_req_status 429;
          limit_conn connections 60;
          proxy_pass http://scene-api:8080;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header Forwarded "";
          proxy_set_header X-Service-Token "";
          proxy_set_header Connection "";
          proxy_connect_timeout 3s;
          proxy_read_timeout 45s;
        }
        location / { return 404; }
      }
    }
