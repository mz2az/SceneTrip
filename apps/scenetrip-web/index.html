<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#7B69ED" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- 촬영지 사진(작은 판)이 있는 곳 — 첫 화면의 카드 사진이 연결을 새로 맺느라 왕복을 더 쓰지 않게(§10-3-3). -->
    <link rel="preconnect" href="https://scenetrip-media-prod.s3.ap-northeast-2.amazonaws.com" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <!--
      검색 결과·링크 미리보기 꼬리표 — 영어가 기본이다. 한국어판 주소 /?lang=ko 는 Pages Function(functions/index.ts)이
      src/seo/localizeHead.ts 로 이 줄들을 한국어로 바꿔 낸다. 문구를 바꾸면 그 파일의 SEO_COPY 도 같이 바꾼다.
      지우면 src/seo/staticFiles.test.ts 가 깨진다(2026-11-15 에 한 번 통째로 사라졌다). 계획: docs/project/plans/web-seo-bilingual.md
    -->
    <title>SceneTrip — K-Drama &amp; Movie Filming Locations Trip Planner</title>
    <meta name="description" content="Stand where the scene happened. Pick a K-drama or movie and SceneTrip maps its real filming locations in Korea, then builds a trip with nearby food and cafés." />
    <link rel="canonical" href="https://app.scenetrip.io/" />
    <link rel="alternate" hreflang="en" href="https://app.scenetrip.io/" />
    <link rel="alternate" hreflang="ko" href="https://app.scenetrip.io/?lang=ko" />
    <link rel="alternate" hreflang="x-default" href="https://app.scenetrip.io/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SceneTrip" />
    <meta property="og:url" content="https://app.scenetrip.io/" />
    <meta property="og:title" content="SceneTrip — K-Drama &amp; Movie Filming Locations Trip Planner" />
    <meta property="og:description" content="Stand where the scene happened. Pick a K-drama or movie and SceneTrip maps its real filming locations in Korea, then builds a trip with nearby food and cafés." />
    <meta property="og:image" content="https://app.scenetrip.io/icons/icon-512.png" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <!--
      첫 화면(web-ad-landing.md §10-3-1 · §11): 처음 온 사람일 수 있으면(첫 화면을 본 기록·로그인이 없으면) JS 를 받기 전에
      보라 바탕 + 해태 + SceneTrip 을 그린다. 모양은 src/features/landing/IntroSplash.tsx 와 같다. 그림은 빌드가 끼워 넣는다(vite.config.ts).
    -->
    <style>
      .st-splash { display: none; }
      html.st-intro .st-splash {
        position: absolute; inset: 0; z-index: 50;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        background: radial-gradient(120% 80% at 50% 30%, #7a52d6 0%, #5c4ad6 45%, #2a1856 100%);
        color: #fff; font: 800 22px/1.2 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', Roboto, sans-serif;
        letter-spacing: -0.2px;
      }
      html.st-intro #root > .st-splash { position: fixed; }
      html.st-intro .st-splash img { width: 72px; height: 62px; object-fit: contain; animation: st-splash-breathe 1.1s ease-in-out infinite; }
      @keyframes st-splash-breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { html.st-intro .st-splash img { animation: none; } }
    </style>
    <!--
      시험용 초기화 링크 ?reset=1 — 첫 화면을 정하는 아래 스크립트·앱 JS 보다 먼저. 시험용 웹·로컬에서만 이 앱의 저장소 키를 지우고,
      어디서든 주소에서 reset 만 뗀다. 규칙의 정본은 src/app/resetLink.ts, resetLink.test.ts 가 이 스크립트도 함께 본다.
    -->
    <script data-scenetrip-reset>
      try {
        var stQuery = new URLSearchParams(location.search)
        if (stQuery.get('reset') === '1') {
          var stHost = location.hostname.toLowerCase()
          if (['dev.scenetrip.io', 'dev.scenetrip-app.pages.dev', 'intro-lab.scenetrip-app.pages.dev', 'localhost', '127.0.0.1', '[::1]', '::1'].indexOf(stHost) >= 0) {
            [localStorage, sessionStorage].forEach(function (s) {
              for (var i = s.length - 1; i >= 0; i--) {
                var k = s.key(i)
                if (k && /^(scenetrip\.|proto\.|ph_)/.test(k)) s.removeItem(k)
              }
            })
          }
          stQuery.delete('reset')
          var stRest = stQuery.toString()
          history.replaceState(history.state, '', location.pathname + (stRest ? '?' + stRest : '') + location.hash)
        }
      } catch (e) {}
    </script>
    <script>
      try {
        // 넘어온 주소(?keep=·?places=·?pois=)는 첫 화면을 띄우지 않는다(web-ad-landing.md §13-3, src/app/intro.ts 와 같은 규칙).
        if (!localStorage.getItem('scenetrip.intro.done') && !localStorage.getItem('scenetrip.auth.session') && !/[?&](keep|places|pois)=\d/.test(location.search)) document.documentElement.classList.add('st-intro')
      } catch (e) {}
      // 탭 아이콘(22KB)은 첫 화면이면 미뤄 둔 일이 풀릴 때 붙인다(src/main.tsx) — 느린 망에서 첫 사진과 대역폭을 다투지 않게.
      window.__stIcon = function () { document.head.insertAdjacentHTML('beforeend', '<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />') }
      if (!document.documentElement.classList.contains('st-intro')) window.__stIcon()
    </script>
  </head>
  <body>
    <div id="root"><div class="st-splash st-landing st-landing--loading" aria-busy="true"><img src="%SCENETRIP_INTRO_HAETAE%" alt="" width="72" height="62" /><span>SceneTrip</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
