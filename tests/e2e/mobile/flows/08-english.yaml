# 영어로 고르면 온보딩·홈·탭 이름이 영어로 바뀐다. 두 앱의 번역 표가 같은 문구를 내는지 본다.
appId: com.mz2az.scenetrip
name: 영어 화면
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "언어를 선택하세요"
    timeout: 15000
- tapOn: "English"
- extendedWaitUntil:
    visible: "Skip"
    timeout: 10000
- takeScreenshot: 01-lesson-1-en
- tapOn: "Skip"
- waitForAnimationToEnd
- takeScreenshot: 02-home-en
- scroll
- takeScreenshot: 03-home-en-scrolled
