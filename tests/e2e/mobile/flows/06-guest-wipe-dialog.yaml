# 비회원 「이 기기의 기록 지우기」 (MZ2AZ-471). 대화상자를 열어 문구만 확인하고 취소한다 — 아무것도 지우지 않는다.
appId: com.mz2az.scenetrip
name: 기기 기록 지우기 대화상자
---
- runFlow: ../subflows/first-run.yaml
- tapOn: "마이페이지"
- scrollUntilVisible:
    element: "이 기기의 기록 지우기"
    timeout: 30000
- takeScreenshot: 01-wipe-row
- tapOn: "이 기기의 기록 지우기"
- assertVisible: "이 기기의 기록을 지울까요?"
- takeScreenshot: 02-wipe-dialog
- tapOn: "취소"
- assertNotVisible: "이 기기의 기록을 지울까요?"
- takeScreenshot: 03-wipe-cancelled
