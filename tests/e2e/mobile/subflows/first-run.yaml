# 깨끗한 설치 직후부터 홈까지. 언어는 한국어, 사용법은 건너뛴다.
appId: com.mz2az.scenetrip
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "언어를 선택하세요"
    timeout: 15000
- tapOn: "한국어"
- extendedWaitUntil:
    visible: "건너뛰기"
    timeout: 10000
- tapOn: "건너뛰기"
- extendedWaitUntil:
    visible: "오늘은 어느 장면으로 갈까요?"
    timeout: 15000
