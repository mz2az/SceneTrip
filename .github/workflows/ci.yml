# 얇은 껍데기: 체크아웃하고 just·bazelisk 를 설치한 뒤 just 레시피를 호출한다.
# 파이프라인 로직은 tools/just/ci.just 에 있어 `just ci` 로 로컬에서 그대로 재현된다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # 손으로 돌릴 수 있어야 한다. 2026-08-07 에 GitHub 이 pull_request(synchronize)
  # 이벤트를 흘려 커밋 두 개가 CI 를 아예 타지 않았고, 그때 이 트리거가 없어서
  # 다시 돌릴 방법이 없었다 — PR 을 닫았다 여는 것도 듣지 않았다. macOS 러너가
  # 불안정한 편이라(같은 날 4 번 중 3 번이 GitHub 쪽 문제) 이 손잡이가 필요하다.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ktlint 는 여기 없다. Bazel 이 //:ktlint 로 받아오므로(MODULE.bazel) 러너에 깔 것이
# 없고, 버전도 그 파일 한 곳에서 고정된다 — 로컬과 두 잡이 자동으로 같은 바이너리를
#쓴다. 예전에는 이 자리에서 KTLINT_VERSION 을 못 박고 잡마다 내려받았는데, 로컬은
# brew 라 따로 놀아서 값을 손으로 맞춰야 했다 (MZ2AZ-264).
#
# shellcheck 은 아직 호스트 도구라 남는다. 러너 이미지가 주는 버전은 brew 가 주는
# 것보다 낮아서, **로컬에서 통과한 스크립트가 CI 에서만 죽었다** (실측 — SC2015 는
# 0.11.0 에서 나지 않는다). 검사 도구는 판정을 내리는 물건이라 버전이 갈리면 게이트가
# 사람마다 다른 말을 한다.
env:
  SHELLCHECK_VERSION: "0.11.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      # shellcheck 은 이미지에 있지만 **버전이 낮다.** 위 env 절의 이유로 덮어쓴다.
      # ktlint 는 Bazel 이 주므로 여기서 받지 않는다.
      - name: 검사 도구 설치
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: 검증
        run: just ci-full

  # iOS 를 짓는 유일한 잡 (ADR 0002 후속 "CI 에 macOS 러너 잡 추가 — 첫 iOS 모듈이
  # 생길 때", 계획서 mobile-native-search-tab.md §5-4).
  #
  # 위 verify 잡은 ubuntu 라 iOS 를 짓지 못한다. Apple 라이선스상 Bazel 이 Xcode 를
  # 대신 받아올 수 없어(docs/engineering/onboarding.md), .bazelrc 가 리눅스에서
  # `ios` 태그를 걸러낸다. 그 걸러낸 몫을 여기서 짓는다.
  #
  # 같은 `just ci-full` 을 돌리므로 Java 쪽은 verify 와 겹친다. 그 중복을 감수한다 —
  # 팀 셋 다 맥북이라 "리눅스 CI 는 초록인데 로컬에서 안 되는" 경우를 여기서 잡는다.
  # 저장소가 공개라 GitHub 표준 러너는 무료다(비공개였다면 macOS 는 10배 차감).
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-darwin-arm64
          sudo chmod +x /usr/local/bin/bazel

      # 러너 이미지에 들어 있는지 보장되지 않아 명시적으로 깐다. 없으면 lint.sh ·
      # format.sh 가 게이트를 빨간불로 만든다 (계획서 §5-6).
      #
      # shellcheck 을 챙기는 이유: ubuntu-latest 이미지에는 들어 있지만
      # **macos-latest 에는 없다.** 그래서 verify 는 통과하는데 이 잡만 셸 린트에서
      # 죽었다(실측, run 31118229436). lint.sh 의 셸 절은 "항상 대상이 있는" 검사라
      # 어느 러너에서도 건너뛰지 않는다.
      #
      # shellcheck 은 brew 가 아니라 고정 버전을 내려받는다 — 위 env 절 주석 참조.
      # verify 잡과 같은 바이너리를 써야 두 잡의 판정이 일치한다.
      # swiftformat · swiftlint 는 이 잡에서만 도니 brew 로 둔다.
      # ktlint 는 Bazel 이 주므로 여기서 받지 않는다 — 그쪽은 저절로 두 잡이 같다.
      - name: 검사 도구 설치
        run: |
          brew install --quiet swiftformat swiftlint
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.darwin.aarch64.tar.xz" \
            | tar -xJ -C /tmp
          sudo install "/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck

      # macOS 의 Bazel 기본 출력 경로는 `~/.cache/bazel` 이 아니라
      # `/var/tmp/_bazel_<사용자>` 다. verify 잡의 캐시 경로를 그대로 베끼면 없는
      # 디렉터리를 캐시해 **조용히 아무 효과가 없다.** 경로를 명시해 양쪽을 맞춘다.
      #
      # `.bazelrc` 가 머신 전용 설정 자리로 열어 둔 `.bazelrc.user` 를 쓴다 — 공용
      # `.bazelrc` 를 건드리지 않고, 그 파일 규약대로 빌드 성공이 이 설정에 의존하지도
      # 않는다(캐시가 비어도 그냥 느릴 뿐이다).
      - name: 캐시 경로 고정
        run: |
          {
            echo "build --disk_cache=~/.cache/bazel-disk"
            echo "build --repository_cache=~/.cache/bazel-repo"
          } >> .bazelrc.user

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: 검증
        run: just ci-full

  # 통합 레인. 실제 PostgreSQL 이 필요해 잡을 나눈다 (ADR 0005).
  #
  # 이 잡의 services 블록이 ADR 0001 의 "CI 워크플로는 얇은 껍데기" 에 대한 **유일한
  # 예외**다. 서비스 컨테이너 선언은 Actions 고유 문법이라 just 레시피로 감쌀 수 없다.
  # 그 위에서 도는 명령은 전부 just 레시피여야 한다 — 아래 steps 를 보면 그렇다.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # 로컬 kind 와 같은 이미지를 쓴다 (platform/kubernetes/postgres/statefulset.yaml).
        # 갈라지면 "CI 에서만 되는" 상황이 생긴다.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_DB: scenetrip
          POSTGRES_USER: scenetrip
          # 러너 안에서만 사는 임시 DB 의 값이다. 진짜 자격 증명이 아니다.
          POSTGRES_PASSWORD: scenetrip-local
        ports:
          - 5432:5432
        # 준비되기 전에 마이그레이션을 돌리면 "연결 거부" 로 죽는다.
        options: >-
          --health-cmd "pg_isready -U scenetrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 이 값이 있으면 스크립트들이 포트포워드를 세우지 않고 여기로 바로 붙는다
      # (tools/scripts/_lib.sh 의 db_connect).
      SCENETRIP_DB_HOST: localhost
      SCENETRIP_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-integration-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-integration-${{ runner.os }}-

      # 아래 셋은 노트북에서 치는 것과 같은 명령이다. 로컬에서는 kind 가, 여기서는
      # 서비스 컨테이너가 DB 를 준다는 것만 다르다.
      - name: 스키마
        run: just db-migrate

      - name: 데이터 적재
        run: just seed

      # 인자 없이 치면 저장소의 표본 23 행. 전량(190 MB)은 TMAP 약관상 저장소에 없다.
      - name: 편의시설 표본 적재
        run: just seed-poi

      - name: 검색 색인 갱신
        run: just db-refresh-search

      - name: 통합 테스트
        run: just test-integration

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 보안 점검
        run: just ci-security
