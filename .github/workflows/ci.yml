# 얇은 껍데기: 체크아웃하고 just·bazelisk 를 설치한 뒤 just 레시피를 호출한다.
# 파이프라인 로직은 tools/just/ci.just 에 있어 `just ci` 로 로컬에서 그대로 재현된다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: 검증
        run: just ci-full

  # iOS 를 짓는 유일한 잡 (ADR 0002 후속 "CI 에 macOS 러너 잡 추가 — 첫 iOS 모듈이
  # 생길 때", 계획서 mobile-native-search-tab.md §5-4).
  #
  # 위 verify 잡은 ubuntu 라 iOS 를 짓지 못한다. Apple 라이선스상 Bazel 이 Xcode 를
  # 대신 받아올 수 없어(docs/engineering/onboarding.md), .bazelrc 가 리눅스에서
  # `ios` 태그를 걸러낸다. 그 걸러낸 몫을 여기서 짓는다.
  #
  # 같은 `just ci-full` 을 돌리므로 Java 쪽은 verify 와 겹친다. 그 중복을 감수한다 —
  # 팀 셋 다 맥북이라 "리눅스 CI 는 초록인데 로컬에서 안 되는" 경우를 여기서 잡는다.
  # 저장소가 공개라 GitHub 표준 러너는 무료다(비공개였다면 macOS 는 10배 차감).
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-darwin-arm64
          sudo chmod +x /usr/local/bin/bazel

      # 러너 이미지에 들어 있는지 보장되지 않아 명시적으로 깐다. 이 둘이 없으면
      # lint.sh · format.sh 가 게이트를 빨간불로 만든다 (계획서 §5-6).
      - name: Swift 도구 설치
        run: brew install --quiet swiftformat swiftlint

      # macOS 의 Bazel 기본 출력 경로는 `~/.cache/bazel` 이 아니라
      # `/var/tmp/_bazel_<사용자>` 다. verify 잡의 캐시 경로를 그대로 베끼면 없는
      # 디렉터리를 캐시해 **조용히 아무 효과가 없다.** 경로를 명시해 양쪽을 맞춘다.
      #
      # `.bazelrc` 가 머신 전용 설정 자리로 열어 둔 `.bazelrc.user` 를 쓴다 — 공용
      # `.bazelrc` 를 건드리지 않고, 그 파일 규약대로 빌드 성공이 이 설정에 의존하지도
      # 않는다(캐시가 비어도 그냥 느릴 뿐이다).
      - name: 캐시 경로 고정
        run: |
          {
            echo "build --disk_cache=~/.cache/bazel-disk"
            echo "build --repository_cache=~/.cache/bazel-repo"
          } >> .bazelrc.user

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: 검증
        run: just ci-full

  # 통합 레인. 실제 PostgreSQL 이 필요해 잡을 나눈다 (ADR 0005).
  #
  # 이 잡의 services 블록이 ADR 0001 의 "CI 워크플로는 얇은 껍데기" 에 대한 **유일한
  # 예외**다. 서비스 컨테이너 선언은 Actions 고유 문법이라 just 레시피로 감쌀 수 없다.
  # 그 위에서 도는 명령은 전부 just 레시피여야 한다 — 아래 steps 를 보면 그렇다.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # 로컬 kind 와 같은 이미지를 쓴다 (platform/kubernetes/postgres/statefulset.yaml).
        # 갈라지면 "CI 에서만 되는" 상황이 생긴다.
        image: imresamu/postgis:17-3.5
        env:
          POSTGRES_DB: scenetrip
          POSTGRES_USER: scenetrip
          # 러너 안에서만 사는 임시 DB 의 값이다. 진짜 자격 증명이 아니다.
          POSTGRES_PASSWORD: scenetrip-local
        ports:
          - 5432:5432
        # 준비되기 전에 마이그레이션을 돌리면 "연결 거부" 로 죽는다.
        options: >-
          --health-cmd "pg_isready -U scenetrip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 이 값이 있으면 스크립트들이 포트포워드를 세우지 않고 여기로 바로 붙는다
      # (tools/scripts/_lib.sh 의 db_connect).
      SCENETRIP_DB_HOST: localhost
      SCENETRIP_DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: just 설치
        uses: extractions/setup-just@v2

      - name: bazelisk 설치
        run: |
          sudo curl -fsSLo /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazel

      - name: Bazel 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-integration-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-integration-${{ runner.os }}-

      # 아래 셋은 노트북에서 치는 것과 같은 명령이다. 로컬에서는 kind 가, 여기서는
      # 서비스 컨테이너가 DB 를 준다는 것만 다르다.
      - name: 스키마
        run: just db-migrate

      - name: 데이터 적재
        run: just seed

      - name: 검색 색인 갱신
        run: just db-refresh-search

      - name: 통합 테스트
        run: just test-integration

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: 보안 점검
        run: just ci-security
